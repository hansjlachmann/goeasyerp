# Report 805 Where-Used List: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 805
  name: Where-Used List
  page:
    size: A4
    orientation: portrait
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: Item
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 120}
            - {value: today, x: 126, y: 0, width: 60, align: right}
            - {text: PAGE, x: 126, y: 4, width: 50, align: right}
            - {page_no: true, x: 176, y: 4, width: 10, align: right}
            - {value: user_id, x: 126, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 186, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: USED_IN_ITEM_NO, x: 3, y: 1, width: 20, bold: true, wrap: true}
            - {text: DESCRIPTION, x: 24, y: 1, width: 55, bold: true, wrap: true}
            - {text: QUANTITY_PER, x: 80, y: 1, width: 20, align: right, bold: true, wrap: true}
            - {text: BASE_UNIT_OF_MEASURE, x: 102, y: 1, width: 14, bold: true, wrap: true}
            - {text: INVENTORY, x: 117, y: 1, width: 22, align: right, bold: true, wrap: true}
            - {text: QTY_ON_SALES_ORDER, x: 140, y: 1, width: 22, align: right, bold: true, wrap: true}
            - {text: QTY_ON_PURCH_ORDER, x: 163, y: 1, width: 23, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          height: 6
          elements:
            - {field: "no", x: 0, y: 1.5, width: 22, bold: true}
            - {field: description, x: 23, y: 1.5, width: 100, bold: true}

    - name: BOM_Component
      sections: []

    - name: Item2
      sections:
        - type: body
          height: 4.2
          elements:
            - {field: "no", x: 3, y: 0, width: 20}
            - {field: description, x: 24, y: 0, width: 55}
            - {field: BOM_Component.quantity_per, x: 80, y: 0, width: 20, align: right, decimal_places: "2:5"}
            - {field: base_unit_of_measure, x: 102, y: 0, width: 14}
            - {field: quantity_on_hand, x: 117, y: 0, width: 22, align: right, decimal_places: "2:5", blank_zero: true}
            - {field: qty_on_sales_order, x: 140, y: 0, width: 22, align: right, decimal_places: "2:5", blank_zero: true}
            - {field: qty_on_purch_order, x: 163, y: 0, width: 23, align: right, decimal_places: "2:5", blank_zero: true}
