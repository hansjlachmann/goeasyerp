# Report 5605 Fixed Asset - Book Value 01: the printed layout (sections per data item, positions in
# mm from the section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 5605
  name: Fixed Asset - Book Value 01
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: FixedAsset
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 10}
            - {value: depr_book_text, x: 0, y: 5, width: 120}
            - {value: company_name, x: 0, y: 9, width: 120}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        # Group Totals: <field>, the column heads with the dates
        - type: header
          print_on_every_page: true
          height: 20.5
          elements:
            - {value: group_code_name, x: 0, y: 0, width: 60}
            - {value: head_1, x: 63, y: 4, width: 20, align: right, bold: true, wrap: true}
            - {value: head_2, x: 84, y: 4, width: 20, align: right, bold: true, wrap: true}
            - {value: head_3, x: 105, y: 4, width: 20, align: right, bold: true, wrap: true}
            - {value: head_4, x: 126, y: 4, width: 20, align: right, bold: true, wrap: true}
            - {value: head_5, x: 147, y: 4, width: 20, align: right, bold: true, wrap: true}
            - {value: head_6, x: 168, y: 4, width: 20, align: right, bold: true, wrap: true}
            - {value: head_7, x: 189, y: 4, width: 20, align: right, bold: true, wrap: true}
            - {value: head_8, x: 210, y: 4, width: 20, align: right, bold: true, wrap: true}
            - {value: head_9, x: 231, y: 4, width: 20, align: right, bold: true, wrap: true}
            - {value: head_10, x: 252, y: 4, width: 20, align: right, bold: true, wrap: true}
            - {text: NO, x: 0, y: 14, width: 20, bold: true, print_if: print_details}
            - {text: DESCRIPTION, x: 21, y: 14, width: 41, bold: true, print_if: print_details}
            - {line: true, x: 0, y: 18.5}
        # The total of the group before (the classic group footer)
        - type: body
          print_if: print_group_footer
          height: 6
          elements:
            - {value: group_total_text, x: 0, y: 0.5, width: 62, bold: true}
            - {value: grp_start_1, x: 63, y: 0.5, width: 20, align: right, bold: true}
            - {value: grp_net_1, x: 84, y: 0.5, width: 20, align: right, bold: true}
            - {value: grp_disp_1, x: 105, y: 0.5, width: 20, align: right, bold: true}
            - {value: grp_end_1, x: 126, y: 0.5, width: 20, align: right, bold: true}
            - {value: grp_start_2, x: 147, y: 0.5, width: 20, align: right, bold: true}
            - {value: grp_net_2, x: 168, y: 0.5, width: 20, align: right, bold: true}
            - {value: grp_disp_2, x: 189, y: 0.5, width: 20, align: right, bold: true}
            - {value: grp_end_2, x: 210, y: 0.5, width: 20, align: right, bold: true}
            - {value: grp_bv_start, x: 231, y: 0.5, width: 20, align: right, bold: true}
            - {value: grp_bv_end, x: 252, y: 0.5, width: 20, align: right, bold: true}
        # The group's head line (Print per Fixed Asset)
        - type: body
          print_if: print_group_header
          height: 6
          elements:
            - {value: group_head_line, x: 0, y: 1.5, width: 62, bold: true}
        - type: body
          print_if: print_details
          height: 4.2
          elements:
            - {field: "no", x: 0, y: 0, width: 20}
            - {field: description, x: 21, y: 0, width: 41}
            - {value: start_1, x: 63, y: 0, width: 20, align: right}
            - {value: net_1, x: 84, y: 0, width: 20, align: right}
            - {value: disp_1, x: 105, y: 0, width: 20, align: right}
            - {value: end_1, x: 126, y: 0, width: 20, align: right}
            - {value: start_2, x: 147, y: 0, width: 20, align: right}
            - {value: net_2, x: 168, y: 0, width: 20, align: right}
            - {value: disp_2, x: 189, y: 0, width: 20, align: right}
            - {value: end_2, x: 210, y: 0, width: 20, align: right}
            - {value: bv_start, x: 231, y: 0, width: 20, align: right}
            - {value: bv_end, x: 252, y: 0, width: 20, align: right}
        - type: footer
          print_if: group_totals
          height: 6
          elements:
            - {value: last_group_total_text, x: 0, y: 0.5, width: 62, bold: true}
            - {value: lgrp_start_1, x: 63, y: 0.5, width: 20, align: right, bold: true}
            - {value: lgrp_net_1, x: 84, y: 0.5, width: 20, align: right, bold: true}
            - {value: lgrp_disp_1, x: 105, y: 0.5, width: 20, align: right, bold: true}
            - {value: lgrp_end_1, x: 126, y: 0.5, width: 20, align: right, bold: true}
            - {value: lgrp_start_2, x: 147, y: 0.5, width: 20, align: right, bold: true}
            - {value: lgrp_net_2, x: 168, y: 0.5, width: 20, align: right, bold: true}
            - {value: lgrp_disp_2, x: 189, y: 0.5, width: 20, align: right, bold: true}
            - {value: lgrp_end_2, x: 210, y: 0.5, width: 20, align: right, bold: true}
            - {value: lgrp_bv_start, x: 231, y: 0.5, width: 20, align: right, bold: true}
            - {value: lgrp_bv_end, x: 252, y: 0.5, width: 20, align: right, bold: true}
        - type: footer
          height: 8
          elements:
            - {line: true, x: 63, y: 1}
            - {text: TOTAL, x: 0, y: 2, width: 62, bold: true}
            - {value: tot_start_1, x: 63, y: 2, width: 20, align: right, bold: true}
            - {value: tot_net_1, x: 84, y: 2, width: 20, align: right, bold: true}
            - {value: tot_disp_1, x: 105, y: 2, width: 20, align: right, bold: true}
            - {value: tot_end_1, x: 126, y: 2, width: 20, align: right, bold: true}
            - {value: tot_start_2, x: 147, y: 2, width: 20, align: right, bold: true}
            - {value: tot_net_2, x: 168, y: 2, width: 20, align: right, bold: true}
            - {value: tot_disp_2, x: 189, y: 2, width: 20, align: right, bold: true}
            - {value: tot_end_2, x: 210, y: 2, width: 20, align: right, bold: true}
            - {value: tot_bv_start, x: 231, y: 2, width: 20, align: right, bold: true}
            - {value: tot_bv_end, x: 252, y: 2, width: 20, align: right, bold: true}
