# Report 16 G/L Consolidation Eliminations: the printed layout (sections per data item, positions
# in mm from the section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 16
  name: G/L Consolidation Eliminations
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: G_L_Account
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: period_text, x: 0, y: 4.5, width: 140}
            - {value: company_name, x: 0, y: 9, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          height: 5
          elements:
            - {value: journal_text, x: 0, y: 0, width: 273}
        - type: header
          print_on_every_page: true
          height: 13
          elements:
            - {value: amount_type, x: 0, y: 1, width: 60, bold: true}
            - {text: NO, x: 0, y: 6, width: 18, bold: true}
            - {text: NAME, x: 19, y: 6, width: 60, bold: true}
            - {value: this_company, x: 80, y: 2, width: 30, align: right, bold: true, wrap: true}
            - {value: bu_heading, x: 111, y: 2, width: 30, align: right, bold: true, wrap: true}
            - {text: TOTAL, x: 142, y: 6, width: 30, align: right, bold: true}
            - {text: ELIMINATIONS, x: 173, y: 6, width: 30, align: right, bold: true}
            - {text: DESCRIPTION, x: 205, y: 6, width: 40, bold: true}
            - {text: TOTAL_INCL_ELIMINATIONS, x: 245, y: 2, width: 28, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 11}

    - name: Gen_Journal_Line
      sections:
        - type: body
          print_if: first_line
          height: 4.5
          elements:
            - {value: account_no, x: 0, y: 0.5, width: 18}
            - {value: name, x: 19, y: 0.5, width: 60}
            - {value: consolid_amount, x: 80, y: 0.5, width: 30, align: right, blank_zero: true}
            - {value: bu_amount, x: 111, y: 0.5, width: 30, align: right, blank_zero: true}
            - {value: total_amount, x: 142, y: 0.5, width: 30, align: right, blank_zero: true}
            - {field: amount, x: 173, y: 0.5, width: 30, align: right}
            - {field: description, x: 205, y: 0.5, width: 40}
        - type: body
          print_unless: first_line
          height: 4.5
          elements:
            - {field: amount, x: 173, y: 0.5, width: 30, align: right}
            - {field: description, x: 205, y: 0.5, width: 40}

    - name: Account_Total
      sections:
        - type: body
          print_if: show_account
          height: 4.5
          elements:
            - {value: account_no, x: 0, y: 0.5, width: 18}
            - {value: name, x: 19, y: 0.5, width: 60}
            - {value: consolid_amount, x: 80, y: 0.5, width: 30, align: right, blank_zero: true}
            - {value: bu_amount, x: 111, y: 0.5, width: 30, align: right, blank_zero: true}
            - {value: total_amount, x: 142, y: 0.5, width: 30, align: right, blank_zero: true}
            - {value: elimination_amount, x: 173, y: 0.5, width: 30, align: right, blank_zero: true}
            - {value: total_incl, x: 245, y: 0.5, width: 28, align: right, blank_zero: true}
        - type: body
          print_unless: show_account
          height: 5
          elements:
            - {line: true, x: 173, y: 0.3, width: 30}
            - {value: elimination_amount, x: 173, y: 1, width: 30, align: right, blank_zero: true}
            - {value: total_incl, x: 245, y: 1, width: 28, align: right, blank_zero: true}
