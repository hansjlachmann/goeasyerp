# Report 703 Item Register: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 703
  name: Item Register
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: ItemRegister
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: POSTING_DATE, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: ENTRY_TYPE, x: 21, y: 1, width: 28, bold: true, wrap: true}
            - {text: DOCUMENT_NO, x: 50, y: 1, width: 26, bold: true, wrap: true}
            - {text: ITEM_NO, x: 77, y: 1, width: 18, bold: true, wrap: true}
            - {text: DESCRIPTION, x: 96, y: 1, width: 60, bold: true, wrap: true}
            - {text: LOCATION_CODE, x: 157, y: 1, width: 18, bold: true, wrap: true}
            - {text: QUANTITY, x: 176, y: 1, width: 24, align: right, bold: true, wrap: true}
            - {text: COST_AMOUNT, x: 201, y: 1, width: 28, align: right, bold: true, wrap: true}
            - {text: ENTRY_NO, x: 250, y: 1, width: 20, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          height: 7
          elements:
            - {text: REGISTER_NO, x: 0, y: 1.5, width: 30, bold: true}
            - {field: "no", x: 30, y: 1.5, width: 20, bold: true}
            - {field: creation_date, x: 51, y: 1.5, width: 20}
            - {field: source_code, x: 72, y: 1.5, width: 30}

    - name: ItemLedgerEntry
      sections:
        - type: body
          height: 4.2
          elements:
            - {field: posting_date, x: 0, y: 0, width: 20}
            - {field: entry_type, x: 21, y: 0, width: 28}
            - {field: document_no, x: 50, y: 0, width: 26}
            - {field: item_no, x: 77, y: 0, width: 18}
            - {value: item_description, x: 96, y: 0, width: 60}
            - {field: location_code, x: 157, y: 0, width: 18}
            - {field: quantity, x: 176, y: 0, width: 24, align: right}
            - {field: adjusted_cost_qty, x: 201, y: 0, width: 28, align: right}
            - {field: entry_no, x: 250, y: 0, width: 20, align: right}
