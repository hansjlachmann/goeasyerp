# Report 5634 Maintenance - Details: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 5634
  name: Maintenance - Details
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: FixedAsset
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 10}
            - {value: depr_book_text, x: 0, y: 5, width: 120}
            - {value: company_name, x: 0, y: 9, width: 120}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 11.5
          elements:
            - {text: FA_POSTING_DATE, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: DOCUMENT_TYPE, x: 21, y: 1, width: 18, bold: true, wrap: true}
            - {text: DOCUMENT_NO, x: 40, y: 1, width: 28, bold: true, wrap: true}
            - {text: DESCRIPTION, x: 69, y: 1, width: 50, bold: true}
            - {text: AMOUNT, x: 120, y: 1, width: 24, align: right, bold: true}
            - {text: ENTRY_NO, x: 145, y: 1, width: 15, align: right, bold: true, wrap: true}
            - {text: USER_ID, x: 161, y: 1, width: 24, bold: true}
            - {text: POSTING_DATE, x: 186, y: 1, width: 20, bold: true, wrap: true}
            - {text: G_L_ENTRY_NO, x: 207, y: 1, width: 18, align: right, bold: true, wrap: true}
            - {text: MAINTENANCE_CODE, x: 226, y: 1, width: 30, bold: true, wrap: true}
            - {line: true, x: 0, y: 9.5}
        - type: body
          height: 7
          elements:
            - {field: "no", x: 0, y: 1.5, width: 25, bold: true}
            - {field: description, x: 26, y: 1.5, width: 120, bold: true}

    - name: MaintenanceLedgerEntry
      sections:
        - type: body
          height: 4.2
          elements:
            - {field: fa_posting_date, x: 0, y: 0, width: 20}
            - {field: document_type, x: 21, y: 0, width: 18}
            - {field: document_no, x: 40, y: 0, width: 28}
            - {field: description, x: 69, y: 0, width: 50}
            - {field: amount, x: 120, y: 0, width: 24, align: right}
            - {field: entry_no, x: 145, y: 0, width: 15, align: right}
            - {field: user_id, x: 161, y: 0, width: 24}
            - {field: posting_date, x: 186, y: 0, width: 20}
            - {field: g_l_entry_no, x: 207, y: 0, width: 18, align: right, blank_zero: true}
            - {field: maintenance_code, x: 226, y: 0, width: 30}
