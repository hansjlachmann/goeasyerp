# Report 120 Aged Accounts Receivable: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 120
  name: Aged Accounts Receivable
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: Customer
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          height: 5
          elements:
            - {text: AGED_AS_OF, x: 0, y: 0, width: 25}
            - {value: aged_as_of, x: 25, y: 0, width: 30}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: NO, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: NAME, x: 21, y: 1, width: 60, bold: true, wrap: true}
            - {text: DUE_DATE, x: 82, y: 1, width: 18, bold: true, wrap: true}
            - {text: DAYS_OVERDUE, x: 101, y: 1, width: 11, align: right, bold: true, wrap: true}
            - {text: BALANCE, x: 113, y: 1, width: 26, align: right, bold: true, wrap: true}
            - {text: NOT_DUE, x: 140, y: 1, width: 26, align: right, bold: true, wrap: true}
            - {text: DAYS_1_30, x: 167, y: 1, width: 26, align: right, bold: true, wrap: true}
            - {text: DAYS_31_60, x: 194, y: 1, width: 26, align: right, bold: true, wrap: true}
            - {text: DAYS_61_90, x: 221, y: 1, width: 26, align: right, bold: true, wrap: true}
            - {text: OVER_90, x: 248, y: 1, width: 25, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          height: 5
          elements:
            - {field: "no", x: 0, y: 0, width: 20, bold: true}
            - {field: name, x: 21, y: 0, width: 60, bold: true}
            - {value: balance, x: 113, y: 0, width: 26, align: right, bold: true}
            - {value: not_due, x: 140, y: 0, width: 26, align: right, bold: true, blank_zero: true}
            - {value: days_1_30, x: 167, y: 0, width: 26, align: right, bold: true, blank_zero: true}
            - {value: days_31_60, x: 194, y: 0, width: 26, align: right, bold: true, blank_zero: true}
            - {value: days_61_90, x: 221, y: 0, width: 26, align: right, bold: true, blank_zero: true}
            - {value: over_90, x: 248, y: 0, width: 25, align: right, bold: true, blank_zero: true}
        - type: footer
          height: 8
          elements:
            - {line: true, x: 113, y: 1}
            - {text: TOTAL, x: 21, y: 2, width: 60, bold: true}
            - {value: total_balance, x: 113, y: 2, width: 26, align: right, bold: true}
            - {value: total_not_due, x: 140, y: 2, width: 26, align: right, bold: true}
            - {value: total_days_1_30, x: 167, y: 2, width: 26, align: right, bold: true}
            - {value: total_days_31_60, x: 194, y: 2, width: 26, align: right, bold: true}
            - {value: total_days_61_90, x: 221, y: 2, width: 26, align: right, bold: true}
            - {value: total_over_90, x: 248, y: 2, width: 25, align: right, bold: true}

    - name: CustLedgerEntry
      sections:
        - type: body
          height: 4.2
          elements:
            - {field: posting_date, x: 4, y: 0, width: 18}
            - {field: document_type, x: 23, y: 0, width: 20}
            - {field: document_no, x: 44, y: 0, width: 30}
            - {field: due_date, x: 82, y: 0, width: 18}
            - {value: days_overdue, x: 101, y: 0, width: 11, align: right}
            - {value: entry_balance, x: 113, y: 0, width: 26, align: right}
            - {value: entry_not_due, x: 140, y: 0, width: 26, align: right, blank_zero: true}
            - {value: entry_days_1_30, x: 167, y: 0, width: 26, align: right, blank_zero: true}
            - {value: entry_days_31_60, x: 194, y: 0, width: 26, align: right, blank_zero: true}
            - {value: entry_days_61_90, x: 221, y: 0, width: 26, align: right, blank_zero: true}
            - {value: entry_over_90, x: 248, y: 0, width: 25, align: right, blank_zero: true}
