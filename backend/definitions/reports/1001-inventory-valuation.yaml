# Report 1001 Inventory Valuation: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 1001
  name: Inventory Valuation
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: Item
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: POSTING_DATE, x: 8, y: 1, width: 20, bold: true, wrap: true}
            - {text: ENTRY_TYPE, x: 29, y: 1, width: 30, bold: true, wrap: true}
            - {text: DOCUMENT_NO, x: 60, y: 1, width: 30, bold: true, wrap: true}
            - {text: LOCATION_CODE, x: 91, y: 1, width: 20, bold: true, wrap: true}
            - {text: REMAINING_QUANTITY, x: 150, y: 1, width: 30, align: right, bold: true, wrap: true}
            - {text: UNIT_COST, x: 181, y: 1, width: 30, align: right, bold: true, wrap: true}
            - {text: INVENTORY_VALUE, x: 212, y: 1, width: 32, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          height: 6.5
          elements:
            - {field: "no", x: 0, y: 1.5, width: 20, bold: true}
            - {field: description, x: 21, y: 1.5, width: 90, bold: true}
            - {field: base_unit_of_measure, x: 112, y: 1.5, width: 16}
            - {field: costing_method, x: 129, y: 1.5, width: 20}
            - {value: item_quantity, x: 150, y: 1.5, width: 30, align: right, bold: true}
            - {value: item_value, x: 212, y: 1.5, width: 32, align: right, bold: true}
        - type: footer
          height: 8
          elements:
            - {line: true, x: 212, y: 1}
            - {text: TOTAL, x: 150, y: 2, width: 60, bold: true}
            - {value: total_value, x: 212, y: 2, width: 32, align: right, bold: true}

    - name: ItemLedgerEntry
      sections:
        - type: body
          height: 4.2
          elements:
            - {field: posting_date, x: 8, y: 0, width: 20}
            - {field: entry_type, x: 29, y: 0, width: 30}
            - {field: document_no, x: 60, y: 0, width: 30}
            - {field: location_code, x: 91, y: 0, width: 20}
            - {field: remaining_quantity, x: 150, y: 0, width: 30, align: right}
            - {value: cost, x: 181, y: 0, width: 30, align: right}
            - {value: inventory_value, x: 212, y: 0, width: 32, align: right}
