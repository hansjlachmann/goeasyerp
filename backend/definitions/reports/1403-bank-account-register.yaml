# Report 1403 Bank Account Register: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 1403
  name: Bank Account Register
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: GLRegister
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: POSTING_DATE, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: DOCUMENT_TYPE, x: 21, y: 1, width: 22, bold: true, wrap: true}
            - {text: DOCUMENT_NO, x: 44, y: 1, width: 26, bold: true, wrap: true}
            - {text: BANK_ACCOUNT_NO, x: 71, y: 1, width: 24, bold: true, wrap: true}
            - {text: BANK_ACCOUNT_NAME, x: 96, y: 1, width: 39, bold: true, wrap: true}
            - {text: DESCRIPTION, x: 136, y: 1, width: 58, bold: true, wrap: true}
            - {text: AMOUNT, x: 195, y: 1, width: 26, align: right, bold: true, wrap: true}
            - {text: AMOUNT_LCY, x: 222, y: 1, width: 26, align: right, bold: true, wrap: true}
            - {text: ENTRY_NO, x: 250, y: 1, width: 20, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          height: 7
          elements:
            - {text: REGISTER_NO, x: 0, y: 1.5, width: 30, bold: true}
            - {field: "no", x: 30, y: 1.5, width: 20, bold: true}
            - {field: creation_date, x: 51, y: 1.5, width: 20}
            - {field: source_code, x: 72, y: 1.5, width: 30}
        - type: footer
          height: 8
          elements:
            - {line: true, x: 222, y: 1}
            - {text: TOTAL, x: 136, y: 2, width: 40, bold: true}
            - {value: total, x: 222, y: 2, width: 26, align: right, bold: true}

    - name: BankAccountLedgerEntry
      sections:
        - type: body
          height: 4.2
          elements:
            - {field: posting_date, x: 0, y: 0, width: 20}
            - {field: document_type, x: 21, y: 0, width: 22}
            - {field: document_no, x: 44, y: 0, width: 26}
            - {field: bank_account_no, x: 71, y: 0, width: 24}
            - {value: bank_account_name, x: 96, y: 0, width: 39}
            - {field: description, x: 136, y: 0, width: 58}
            - {field: amount, x: 195, y: 0, width: 26, align: right}
            - {field: amount_lcy, x: 222, y: 0, width: 26, align: right}
            - {field: entry_no, x: 250, y: 0, width: 20, align: right}
        - type: footer
          height: 6
          elements:
            - {line: true, x: 222, y: 0.5}
            - {text: REGISTER_TOTAL, x: 136, y: 1.5, width: 40}
            - {total: amount_lcy, x: 222, y: 1.5, width: 26, align: right}
