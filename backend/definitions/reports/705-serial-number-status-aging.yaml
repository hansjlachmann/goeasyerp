# Report 705 Serial Number Status/Aging: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 705
  name: Serial Number Status/Aging
  page:
    size: A4
    orientation: portrait
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: Item
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 120}
            - {text: AS_OF, x: 0, y: 9, width: 20}
            - {value: work_date, x: 20, y: 9, width: 30}
            - {value: today, x: 126, y: 0, width: 60, align: right}
            - {text: PAGE, x: 126, y: 4, width: 50, align: right}
            - {page_no: true, x: 176, y: 4, width: 10, align: right}
            - {value: user_id, x: 126, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 186, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: LOCATION_CODE, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: SERIAL_NO, x: 21, y: 1, width: 40, bold: true, wrap: true}
            - {text: POSTING_DATE, x: 62, y: 1, width: 22, bold: true, wrap: true}
            - {text: DAYS_AGED, x: 120, y: 1, width: 25, align: right, bold: true, wrap: true}
            - {text: UNIT_COST, x: 150, y: 1, width: 34, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}

    - name: Item_Ledger_Entry
      sections:
        - type: body
          print_if: first_entry
          height: 6
          elements:
            - {value: item_no, x: 0, y: 1.5, width: 25, bold: true}
            - {value: item_description, x: 26, y: 1.5, width: 100, bold: true}
        - type: body
          height: 4.2
          elements:
            - {field: location_code, x: 0, y: 0, width: 20}
            - {field: serial_no, x: 21, y: 0, width: 40}
            - {field: posting_date, x: 62, y: 0, width: 22}
            - {value: days_aged, x: 120, y: 0, width: 25, align: right}
            - {field: unit_cost, x: 150, y: 0, width: 34, align: right}
        - type: footer
          print_if: number_of_items
          height: 7
          elements:
            - {line: true, x: 120, y: 0.5, width: 25}
            - {value: item_no, x: 0, y: 1.5, width: 25, bold: true}
            - {value: total_quantity_text, x: 26, y: 1.5, width: 62}
            - {text: AVERAGE_AGE, x: 90, y: 1.5, width: 28, align: right}
            - {value: average_age, x: 120, y: 1.5, width: 25, align: right, decimal_places: "0:0"}
