# Report 211 Drop Shipment Status: the printed layout (see business-logic/reports/layout.go)
report:
  id: 211
  name: Drop Shipment Status
  page:
    size: A4
    orientation: portrait
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: Sales_Line
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 10}
            - {value: subtitle, x: 0, y: 5, width: 120}
            - {value: company_name, x: 0, y: 9, width: 120}
            - {value: today, x: 126, y: 0, width: 60, align: right}
            - {text: PAGE, x: 126, y: 4, width: 50, align: right}
            - {page_no: true, x: 176, y: 4, width: 10, align: right}
            - {value: user_id, x: 126, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 186, wrap: true}
        - type: header
          print_on_every_page: true
          height: 10
          elements:
            - {text: ITEM_NO, x: 0, y: 1, width: 22, bold: true, wrap: true}
            - {text: ORDER_OR_VENDOR, x: 23, y: 1, width: 28, bold: true, wrap: true}
            - {text: EXPECTED_DATES, x: 52, y: 1, width: 22, bold: true, wrap: true}
            - {text: STATUS, x: 75, y: 1, width: 60, bold: true, wrap: true}
            - {text: QUANTITY_ORDERED, x: 136, y: 1, width: 14, bold: true, wrap: true, align: right}
            - {text: UNIT_OF_MEASURE, x: 151, y: 1, width: 13, bold: true, wrap: true}
            - {text: QUANTITY_INVOICED, x: 165, y: 1, width: 21, bold: true, wrap: true, align: right}
            - {line: true, x: 0, y: 9}
        # group headings: the order, the customer or the item
        - type: body
          print_if: group_order
          height: 6
          elements:
            - {text: SALES_ORDER_NO, x: 0, y: 1.5, width: 30, bold: true}
            - {field: document_no, x: 31, y: 1.5, width: 25, bold: true}
            - {field: bill_to_customer_no, x: 57, y: 1.5, width: 22}
            - {value: customer_name, x: 80, y: 1.5, width: 60}
            - {value: customer_phone, x: 141, y: 1.5, width: 45}
        - type: body
          print_if: group_customer
          height: 6
          elements:
            - {text: CUSTOMER_NO, x: 0, y: 1.5, width: 30, bold: true}
            - {field: bill_to_customer_no, x: 31, y: 1.5, width: 25, bold: true}
            - {value: customer_name, x: 57, y: 1.5, width: 60}
            - {value: customer_phone, x: 118, y: 1.5, width: 30}
            - {value: customer_contact, x: 149, y: 1.5, width: 37}
        - type: body
          print_if: group_item
          height: 6
          elements:
            - {text: ITEM_NO, x: 0, y: 1.5, width: 30, bold: true}
            - {field: "no", x: 31, y: 1.5, width: 25, bold: true}
            - {value: item_description, x: 57, y: 1.5, width: 100}
        # the sales line
        - type: body
          height: 4.2
          elements:
            - {field: "no", x: 0, y: 0, width: 22}
            - {field: document_no, x: 23, y: 0, width: 28}
            - {field: shipment_date, x: 52, y: 0, width: 22}
            - {value: status_line_1, x: 75, y: 0, width: 60}
            - {field: quantity, x: 136, y: 0, width: 14, align: right, decimal_places: "0:5"}
            - {field: unit_of_measure_code, x: 151, y: 0, width: 13}
            - {value: cust_inv_qty, x: 165, y: 0, width: 21, align: right}
        # the purchase order line delivering it
        - type: body
          print_if: has_purch_line
          height: 4.2
          elements:
            - {text: PURCHASE_ORDER, x: 0, y: 0, width: 22}
            - {value: purch_order_no, x: 22, y: 0, width: 16}
            - {value: vendor_no, x: 38, y: 0, width: 14}
            - {value: expected_receipt_date, x: 52, y: 0, width: 22}
            - {value: status_line_2, x: 75, y: 0, width: 60}
            - {value: vend_ord_qty, x: 136, y: 0, width: 14, align: right}
            - {value: purch_unit_of_measure, x: 151, y: 0, width: 13}
            - {value: vend_inv_qty, x: 165, y: 0, width: 21, align: right}
        - type: body
          print_if: no_purch_order
          height: 4.2
          elements:
            - {text: NO_PURCHASE_ORDER_ISSUED, x: 75, y: 0, width: 80}
