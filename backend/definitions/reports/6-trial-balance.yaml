# Report 6 Trial Balance: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 6
  name: Trial Balance
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: GLAccount
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: period_text
          height: 5
          elements:
            - {value: period_text, x: 0, y: 0, width: 273}
        - type: header
          print_if: add_curr_text
          height: 5
          elements:
            - {value: add_curr_text, x: 0, y: 0, width: 273}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: NO, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: NAME, x: 21, y: 1, width: 100, bold: true, wrap: true}
            - {text: NET_CHANGE_DEBIT, x: 130, y: 1, width: 34, align: right, bold: true, wrap: true}
            - {text: NET_CHANGE_CREDIT, x: 166, y: 1, width: 34, align: right, bold: true, wrap: true}
            - {text: BALANCE_DEBIT, x: 202, y: 1, width: 34, align: right, bold: true, wrap: true}
            - {text: BALANCE_CREDIT, x: 238, y: 1, width: 34, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          print_if: is_total
          height: 4.2
          elements:
            - {field: "no", x: 0, y: 0, width: 20, bold: true}
            - {value: name, x: 21, y: 0, width: 100, bold: true}
            - {value: net_change_debit, x: 130, y: 0, width: 34, align: right, bold: true, blank_zero: true}
            - {value: net_change_credit, x: 166, y: 0, width: 34, align: right, bold: true, blank_zero: true}
            - {value: balance_debit, x: 202, y: 0, width: 34, align: right, bold: true, blank_zero: true}
            - {value: balance_credit, x: 238, y: 0, width: 34, align: right, bold: true, blank_zero: true}
        - type: body
          print_unless: is_total
          height: 4.2
          elements:
            - {field: "no", x: 0, y: 0, width: 20}
            - {value: name, x: 21, y: 0, width: 100}
            - {value: net_change_debit, x: 130, y: 0, width: 34, align: right, blank_zero: true}
            - {value: net_change_credit, x: 166, y: 0, width: 34, align: right, blank_zero: true}
            - {value: balance_debit, x: 202, y: 0, width: 34, align: right, blank_zero: true}
            - {value: balance_credit, x: 238, y: 0, width: 34, align: right, blank_zero: true}
        - type: footer
          height: 7
          elements:
            - {line: true, x: 130, y: 0.5}
            - {text: TOTAL, x: 21, y: 1.5, width: 100, bold: true}
            - {value: total_net_change_debit, x: 130, y: 1.5, width: 34, align: right, bold: true}
            - {value: total_net_change_credit, x: 166, y: 1.5, width: 34, align: right, bold: true}
            - {value: total_balance_debit, x: 202, y: 1.5, width: 34, align: right, bold: true}
            - {value: total_balance_credit, x: 238, y: 1.5, width: 34, align: right, bold: true}
