# Report 1103 Resource Register: the printed layout (see business-logic/reports/layout.go)
report:
  id: 1103
  name: Resource Register
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: Resource_Register
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: POSTING_DATE, x: 0, y: 1, width: 18, bold: true, wrap: true}
            - {text: ENTRY_TYPE, x: 19, y: 1, width: 14, bold: true, wrap: true}
            - {text: RESOURCE_NO, x: 34, y: 1, width: 20, bold: true, wrap: true}
            - {text: DOCUMENT_NO, x: 55, y: 1, width: 22, bold: true, wrap: true}
            - {text: WORK_TYPE, x: 78, y: 1, width: 20, bold: true, wrap: true}
            - {text: UNIT_OF_MEASURE, x: 99, y: 1, width: 14, bold: true, wrap: true}
            - {text: QUANTITY, x: 114, y: 1, width: 22, bold: true, wrap: true, align: right}
            - {text: UNIT_COST, x: 137, y: 1, width: 25, bold: true, wrap: true, align: right}
            - {text: TOTAL_COST, x: 163, y: 1, width: 27, bold: true, wrap: true, align: right}
            - {text: UNIT_PRICE, x: 191, y: 1, width: 25, bold: true, wrap: true, align: right}
            - {text: TOTAL_PRICE, x: 217, y: 1, width: 30, bold: true, wrap: true, align: right}
            - {text: CHARGEABLE, x: 249, y: 1, width: 24, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          height: 6
          elements:
            - {value: register_text, x: 0, y: 1, width: 60, bold: true}
            - {value: source_code_text, x: 61, y: 1, width: 60}
            - {value: source_code_description, x: 122, y: 1, width: 100}
    - name: Res_Ledger_Entry
      sections:
        - type: body
          height: 4.2
          elements:
            - {field: posting_date, x: 0, y: 0, width: 18}
            - {field: entry_type, x: 19, y: 0, width: 14}
            - {field: resource_no, x: 34, y: 0, width: 20}
            - {field: document_no, x: 55, y: 0, width: 22}
            - {field: work_type_code, x: 78, y: 0, width: 20}
            - {field: unit_of_measure_code, x: 99, y: 0, width: 14}
            - {field: quantity, x: 114, y: 0, width: 22, align: right, decimal_places: "2:5"}
            - {field: unit_cost, x: 137, y: 0, width: 25, align: right, decimal_places: "2:2"}
            - {field: total_cost, x: 163, y: 0, width: 27, align: right, decimal_places: "2:2"}
            - {field: unit_price, x: 191, y: 0, width: 25, align: right, decimal_places: "2:2"}
            - {field: total_price, x: 217, y: 0, width: 30, align: right, decimal_places: "2:2"}
            - {field: chargeable, x: 249, y: 0, width: 24}
        - type: body
          print_if: res_description
          height: 4.2
          elements:
            - {value: res_description, x: 4, y: 0, width: 100}
        - type: footer
          height: 7
          elements:
            - {value: entries_text, x: 0, y: 1, width: 120}
            - {value: no_of_entries, x: 121, y: 1, width: 20, align: right, decimal_places: "0:0"}
