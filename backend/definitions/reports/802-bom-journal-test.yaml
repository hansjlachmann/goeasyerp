# Report 802 BOM Journal - Test: the printed layout (see business-logic/reports/layout.go)
report:
  id: 802
  name: BOM Journal - Test
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: BOM_Journal_Batch
      new_page_per_record: true
      sections:
        - type: header
          print_on_every_page: true
          height: 22
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
            - {text: JOURNAL_TEMPLATE, x: 0, y: 12, width: 40}
            - {field: journal_template_name, x: 41, y: 12, width: 30}
            - {text: JOURNAL_BATCH, x: 0, y: 16, width: 40}
            - {field: name, x: 41, y: 16, width: 30}
        - type: header
          print_on_every_page: true
          height: 10.5
          elements:
            - {text: POSTING_DATE, x: 0, y: 1, width: 18, bold: true, wrap: true}
            - {text: DOCUMENT_NO, x: 19, y: 1, width: 22, bold: true, wrap: true}
            - {text: ITEM_NO, x: 42, y: 1, width: 20, bold: true, wrap: true}
            - {text: DESCRIPTION, x: 63, y: 1, width: 80, bold: true, wrap: true}
            - {text: QUANTITY, x: 144, y: 1, width: 22, bold: true, wrap: true, align: right}
            - {text: UNIT_OF_MEASURE, x: 167, y: 1, width: 16, bold: true, wrap: true}
            - {text: UNIT_COST, x: 184, y: 1, width: 28, bold: true, wrap: true, align: right}
            - {text: TOTAL_COST, x: 213, y: 1, width: 30, bold: true, wrap: true, align: right}
            - {line: true, x: 0, y: 9}
    - name: BOM_Journal_Line
      sections:
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: body
          height: 4.2
          elements:
            - {field: posting_date, x: 0, y: 0, width: 18}
            - {field: document_no, x: 19, y: 0, width: 22}
            - {field: item_no, x: 42, y: 0, width: 20}
            - {field: description, x: 63, y: 0, width: 80}
            - {field: quantity, x: 144, y: 0, width: 22, align: right, decimal_places: "0:5"}
            - {field: unit_of_measure_code, x: 167, y: 0, width: 16}
            - {field: unit_cost, x: 184, y: 0, width: 28, align: right, decimal_places: "2:2"}
            - {field: total_cost, x: 213, y: 0, width: 30, align: right, decimal_places: "2:2"}
        - type: footer
          height: 8
          elements:
            - {line: true, x: 213, y: 1}
            - {text: TOTAL, x: 144, y: 2.5, width: 40, bold: true}
            - {total: total_cost, x: 213, y: 2.5, width: 30, align: right, bold: true, decimal_places: "2:2"}
    - name: Error_Loop
      sections:
        - type: body
          height: 4.2
          elements:
            - {text: WARNING, x: 19, y: 0, width: 20, bold: true}
            - {value: error_text, x: 40, y: 0, width: 233, wrap: true}
