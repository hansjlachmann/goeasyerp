# Report 14 Consolidation - Test Database: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 14
  name: Consolidation - Test Database
  page:
    size: A4
    orientation: portrait
    margins: {top: 12, bottom: 12, left: 15, right: 12}
  font_size: 9
  data_items:
    - name: Business_Unit
      sections:
        - type: header
          print_on_every_page: true
          height: 15
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 11}
            - {value: company_name, x: 0, y: 5, width: 120}
            - {value: today, x: 123, y: 0, width: 60, align: right}
            - {text: PAGE, x: 123, y: 4, width: 50, align: right}
            - {page_no: true, x: 173, y: 4, width: 10, align: right}
            - {value: user_id, x: 123, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 183, wrap: true}
        - type: header
          print_if: per_day
          height: 5
          elements:
            - {text: PER_DAY, x: 0, y: 0, width: 183}
        - type: header
          print_if: per_dept
          height: 5
          elements:
            - {text: PER_DIMENSION_1, x: 0, y: 0, width: 183}
        - type: header
          print_if: per_proj
          height: 5
          elements:
            - {text: PER_DIMENSION_2, x: 0, y: 0, width: 183}
        - type: body
          height: 11
          elements:
            - {line: true, x: 0, y: 1}
            - {caption: code, x: 0, y: 2.5, width: 30, bold: true}
            - {field: code, x: 30, y: 2.5, width: 30, bold: true}
            - {caption: company_name, x: 65, y: 2.5, width: 30}
            - {field: company_name, x: 95, y: 2.5, width: 88}
            - {text: PERIOD_FROM_TO, x: 0, y: 6.5, width: 30}
            - {value: period_start, x: 30, y: 6.5, width: 25}
            - {value: period_end, x: 57, y: 6.5, width: 25}

    - name: Missing_Account
      sections:
        - type: header
          height: 7
          elements:
            - {value: accounts_heading, x: 0, y: 1.5, width: 183, bold: true, wrap: true}
        - type: body
          height: 4.5
          elements:
            - {value: missing_code, x: 5, y: 0.5, width: 40}
            - {value: missing_from, x: 47, y: 0.5, width: 60}

    - name: Missing_Dimension_1
      sections:
        - type: header
          height: 7
          elements:
            - {value: dimension_1_heading, x: 0, y: 1.5, width: 183, bold: true, wrap: true}
        - type: body
          height: 4.5
          elements:
            - {value: missing_code, x: 5, y: 0.5, width: 40}
            - {value: missing_from, x: 47, y: 0.5, width: 60}

    - name: Missing_Dimension_2
      sections:
        - type: header
          height: 7
          elements:
            - {value: dimension_2_heading, x: 0, y: 1.5, width: 183, bold: true, wrap: true}
        - type: body
          height: 4.5
          elements:
            - {value: missing_code, x: 5, y: 0.5, width: 40}
            - {value: missing_from, x: 47, y: 0.5, width: 60}
