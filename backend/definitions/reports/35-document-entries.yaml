# Report 35 Document Entries: the printed layout (sections per data item, positions in mm from
# the section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 35
  name: Document Entries
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: DocEntry
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: document_no_filter
          height: 4.5
          elements:
            - {text: DOCUMENT_NO, x: 0, y: 0, width: 35}
            - {value: document_no_filter, x: 36, y: 0, width: 237, wrap: true}
        - type: header
          print_if: posting_date_filter
          height: 4.5
          elements:
            - {text: POSTING_DATE, x: 0, y: 0, width: 35}
            - {value: posting_date_filter, x: 36, y: 0, width: 237, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: TABLE_ID, x: 0, y: 3, width: 20, bold: true}
            - {text: TABLE_NAME, x: 22, y: 3, width: 120, bold: true}
            - {text: NO_OF_RECORDS, x: 233, y: 3, width: 40, align: right, bold: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          height: 6
          elements:
            - {value: table_id, x: 0, y: 1, width: 20, decimal_places: "0:0", bold: true}
            - {value: table_name, x: 22, y: 1, width: 150, bold: true}
            - {value: no_of_records, x: 233, y: 1, width: 40, align: right, decimal_places: "0:0", bold: true}
    - name: Entry
      sections:
        - type: header
          height: 5
          elements:
            - {text: ENTRY_NO, x: 6, y: 0.5, width: 22, bold: true}
            - {text: POSTING_DATE, x: 30, y: 0.5, width: 22, bold: true}
            - {text: DOCUMENT_NO, x: 54, y: 0.5, width: 28, bold: true}
            - {text: ACCOUNT, x: 84, y: 0.5, width: 28, bold: true}
            - {text: DESCRIPTION, x: 114, y: 0.5, width: 110, bold: true}
            - {text: AMOUNT, x: 233, y: 0.5, width: 40, align: right, bold: true}
        - type: body
          height: 4.2
          elements:
            - {value: entry_no, x: 6, y: 0, width: 22}
            - {value: entry_posting_date, x: 30, y: 0, width: 22}
            - {value: entry_document_no, x: 54, y: 0, width: 28}
            - {value: entry_account, x: 84, y: 0, width: 28}
            - {value: entry_description, x: 114, y: 0, width: 117}
            - {value: entry_amount, x: 233, y: 0, width: 40, align: right, print_if: entry_has_amount}
