# Report 122 Reminder - Test: the printed layout (see business-logic/reports/layout.go)
report:
  id: 122
  name: Reminder - Test
  page:
    size: A4
    orientation: portrait
    margins: {top: 12, bottom: 12, left: 15, right: 12}
  font_size: 8
  data_items:
    - name: Reminder_Header
      new_page_per_record: true
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 120}
            - {value: today, x: 123, y: 0, width: 60, align: right}
            - {text: PAGE, x: 123, y: 4, width: 50, align: right}
            - {page_no: true, x: 173, y: 4, width: 10, align: right}
            - {value: user_id, x: 123, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 183, wrap: true}
        - type: body
          height: 58
          elements:
            - {value: document_heading, x: 0, y: 1, width: 183, bold: true, size: 9}
            - {lines: customer_address, x: 0, y: 7, width: 90}
            - {caption: customer_no, x: 98, y: 7, width: 40}
            - {field: customer_no, x: 140, y: 7, width: 43}
            - {caption: document_date, x: 98, y: 11, width: 40}
            - {field: document_date, x: 140, y: 11, width: 43}
            - {caption: posting_date, x: 98, y: 15, width: 40}
            - {field: posting_date, x: 140, y: 15, width: 43}
            - {caption: due_date, x: 98, y: 19, width: 40}
            - {field: due_date, x: 140, y: 19, width: 43}
            - {caption: post_interest, x: 98, y: 23, width: 40}
            - {field: post_interest, x: 140, y: 23, width: 43}
            - {caption: post_additional_fee, x: 98, y: 27, width: 40}
            - {field: post_additional_fee, x: 140, y: 27, width: 43}
            - {caption: reminder_terms_code, x: 98, y: 33, width: 40}
            - {field: reminder_terms_code, x: 140, y: 33, width: 43}
            - {caption: reminder_level, x: 98, y: 37, width: 40}
            - {field: reminder_level, x: 140, y: 37, width: 43}
            - {caption: fin_charge_terms_code, x: 98, y: 41, width: 40}
            - {field: fin_charge_terms_code, x: 140, y: 41, width: 43}
            - {value: reference_text, x: 98, y: 45, width: 40}
            - {field: your_reference, x: 140, y: 45, width: 43}
    - name: Header_Error_Loop
      sections:
        - type: body
          height: 4.2
          elements:
            - {text: WARNING, x: 0, y: 0, width: 20, bold: true}
            - {value: error_text, x: 21, y: 0, width: 162, wrap: true}
    - name: Lines
      sections:
        - type: header
          height: 10.5
          elements:
            - {text: DOCUMENT_DATE, x: 0, y: 1, width: 18, bold: true, wrap: true}
            - {text: DOCUMENT_TYPE, x: 19, y: 1, width: 22, bold: true, wrap: true}
            - {text: DOCUMENT_NO, x: 42, y: 1, width: 24, bold: true, wrap: true}
            - {text: DUE_DATE, x: 67, y: 1, width: 18, bold: true, wrap: true}
            - {text: ORIGINAL_AMOUNT, x: 86, y: 1, width: 24, bold: true, wrap: true, align: right}
            - {text: REMAINING_AMOUNT, x: 111, y: 1, width: 24, bold: true, wrap: true, align: right}
            - {text: AMOUNT, x: 158, y: 1, width: 25, bold: true, wrap: true, align: right}
            - {line: true, x: 0, y: 9.5}
        - type: body
          print_if: is_text
          height: 4.2
          elements:
            - {value: description, x: 0, y: 0, width: 183}
        - type: body
          print_if: is_entry
          height: 4.2
          elements:
            - {value: document_date, x: 0, y: 0, width: 18}
            - {value: document_type, x: 19, y: 0, width: 22}
            - {value: document_no, x: 42, y: 0, width: 24}
            - {value: due_date, x: 67, y: 0, width: 18}
            - {value: original_amount, x: 86, y: 0, width: 24, align: right, decimal_places: "2:2"}
            - {value: remaining_amount, x: 111, y: 0, width: 24, align: right, decimal_places: "2:2"}
            - {value: amount, x: 158, y: 0, width: 25, align: right, decimal_places: "2:2"}
        - type: body
          print_if: is_other
          height: 4.2
          elements:
            - {value: description, x: 42, y: 0, width: 90}
            - {value: remaining_amount, x: 158, y: 0, width: 25, align: right, decimal_places: "2:2"}
        - type: footer
          print_if: interest_amount
          height: 4.2
          elements:
            - {text: INTEREST_AMOUNT, x: 100, y: 0, width: 55}
            - {value: interest_amount, x: 158, y: 0, width: 25, align: right, decimal_places: "2:2"}
        - type: footer
          height: 5
          elements:
            - {line: true, x: 135, y: 0.5}
            - {value: total_text, x: 100, y: 1, width: 55, bold: true}
            - {value: total_amount, x: 158, y: 1, width: 25, align: right, bold: true, decimal_places: "2:2"}
        - type: footer
          print_if: tax_total
          height: 8.4
          elements:
            - {text: TAX_AMOUNT, x: 100, y: 0, width: 55}
            - {value: tax_total, x: 158, y: 0, width: 25, align: right, decimal_places: "2:2"}
            - {value: total_incl_tax_text, x: 100, y: 4.2, width: 55, bold: true}
            - {value: total_incl_tax, x: 158, y: 4.2, width: 25, align: right, bold: true, decimal_places: "2:2"}
    - name: Line_Error_Loop
      sections:
        - type: body
          height: 4.2
          elements:
            - {text: WARNING, x: 19, y: 0, width: 20, bold: true}
            - {value: error_text, x: 40, y: 0, width: 143, wrap: true}
    - name: End_Text
      sections:
        - type: body
          height: 4.2
          elements:
            - {value: end_description, x: 0, y: 0, width: 183}
    - name: Tax_Counter
      sections:
        - type: header
          height: 10
          elements:
            - {text: TAX_SPECIFICATION, x: 0, y: 1, width: 80, bold: true}
            - {text: TAX_PCT, x: 86, y: 5, width: 25, bold: true, align: right}
            - {text: TAX_BASE, x: 115, y: 5, width: 30, bold: true, align: right}
            - {text: TAX_AMOUNT, x: 150, y: 5, width: 33, bold: true, align: right}
        - type: body
          height: 4.2
          elements:
            - {value: tax_pct, x: 86, y: 0, width: 25, align: right, decimal_places: "0:5"}
            - {value: tax_base, x: 115, y: 0, width: 30, align: right, decimal_places: "2:2"}
            - {value: tax_amount, x: 150, y: 0, width: 33, align: right, decimal_places: "2:2"}
