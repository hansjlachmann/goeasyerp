# Report 5623 Insurance Register: the printed layout (see business-logic/reports/layout.go)
report:
  id: 5623
  name: Insurance Register
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: Insurance_Register
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 120}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 11.5
          elements:
            - {text: POSTING_DATE, x: 0, y: 1, width: 18, bold: true, wrap: true}
            - {text: DOCUMENT_TYPE, x: 19, y: 1, width: 16, bold: true, wrap: true}
            - {text: DOCUMENT_NO, x: 36, y: 1, width: 24, bold: true}
            - {text: INSURANCE_NO, x: 61, y: 1, width: 18, bold: true, wrap: true}
            - {text: INSURANCE_DESCRIPTION, x: 80, y: 1, width: 40, bold: true, wrap: true}
            - {text: FA_NO, x: 121, y: 1, width: 18, bold: true}
            - {text: FA_DESCRIPTION, x: 140, y: 1, width: 40, bold: true}
            - {text: DESCRIPTION, x: 181, y: 1, width: 40, bold: true}
            - {text: AMOUNT, x: 222, y: 1, width: 28, align: right, bold: true}
            - {text: ENTRY_NO, x: 251, y: 1, width: 22, align: right, bold: true}
            - {line: true, x: 0, y: 9.5}
        - type: body
          height: 7
          elements:
            - {text: REGISTER_NO, x: 0, y: 1.5, width: 30, bold: true}
            - {field: "no", x: 30, y: 1.5, width: 20, bold: true}
        - type: footer
          height: 8
          elements:
            - {line: true, x: 222, y: 1}
            - {text: TOTAL, x: 181, y: 2, width: 40, bold: true}
            - {total: Ins_Coverage_Ledger_Entry.amount, x: 222, y: 2, width: 28, align: right, bold: true, decimal_places: "2:2"}
    - name: Ins_Coverage_Ledger_Entry
      sections:
        - type: body
          height: 4.2
          elements:
            - {field: posting_date, x: 0, y: 0, width: 18}
            - {field: document_type, x: 19, y: 0, width: 16}
            - {field: document_no, x: 36, y: 0, width: 24}
            - {field: insurance_no, x: 61, y: 0, width: 18}
            - {value: insurance_description, x: 80, y: 0, width: 40}
            - {field: fa_no, x: 121, y: 0, width: 18}
            - {value: fa_description, x: 140, y: 0, width: 40}
            - {field: description, x: 181, y: 0, width: 40}
            - {field: amount, x: 222, y: 0, width: 28, align: right, decimal_places: "2:2"}
            - {field: entry_no, x: 251, y: 0, width: 22, align: right}
        - type: footer
          height: 7
          elements:
            - {line: true, x: 222, y: 0.5}
            - {text: TOTAL, x: 181, y: 1.5, width: 40, bold: true}
            - {total: amount, x: 222, y: 1.5, width: 28, align: right, bold: true, decimal_places: "2:2"}
