# Report 26 Setup Checklist: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 26
  name: Setup Checklist
  page:
    size: A4
    orientation: portrait
    margins: {top: 12, bottom: 12, left: 15, right: 12}
  font_size: 8
  data_items:
    - name: Setup_Checklist_Line
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 11}
            - {value: company_name, x: 0, y: 5, width: 120}
            - {value: today, x: 123, y: 0, width: 60, align: right}
            - {text: PAGE, x: 123, y: 4, width: 50, align: right}
            - {page_no: true, x: 173, y: 4, width: 10, align: right}
            - {value: user_id, x: 123, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 183, wrap: true}
        - type: header
          print_on_every_page: true
          height: 8
          elements:
            - {caption: table_name, x: 0, y: 2, width: 60, bold: true}
            - {text: NO_OF_RECORDS, x: 61, y: 2, width: 18, align: right, bold: true}
            - {caption: status, x: 82, y: 2, width: 22, bold: true}
            - {caption: responsible_id, x: 105, y: 2, width: 25, bold: true}
            - {caption: starting_date, x: 131, y: 2, width: 18, bold: true}
            - {caption: ending_date, x: 150, y: 2, width: 18, bold: true}
            - {text: COMMENT_NO, x: 169, y: 2, width: 14, align: right, bold: true}
            - {line: true, x: 0, y: 6.5}
        - type: body
          print_if: area_heading
          height: 3
          elements: []
        - type: body
          print_if: first_line
          height: 5
          elements:
            - {field: application_area_name, x: 0, y: 0.5, width: 120, bold: true}
        - type: body
          height: 4.5
          elements:
            - {field: table_name, x: 0, y: 0.5, width: 60}
            - {value: no_of_records, x: 61, y: 0.5, width: 18, align: right, blank_zero: true}
            - {field: status, x: 82, y: 0.5, width: 22}
            - {field: responsible_id, x: 105, y: 0.5, width: 25}
            - {field: starting_date, x: 131, y: 0.5, width: 18}
            - {field: ending_date, x: 150, y: 0.5, width: 18}
            - {value: comment_no, x: 169, y: 0.5, width: 14, align: right, blank_zero: true}

    - name: Extra_Setup_Checklist_Line
      sections:
        - type: header
          height: 12
          elements:
            - {text: COMMENTS, x: 0, y: 4, width: 120, bold: true, size: 10}
            - {line: true, x: 0, y: 10}
        - type: body
          height: 5.5
          elements:
            - {value: comment_no, x: 0, y: 1, width: 12, align: right, bold: true}
            - {field: table_name, x: 16, y: 1, width: 120, bold: true}

    - name: Setup_Checklist_Comment
      sections:
        - type: body
          height: 4.5
          elements:
            - {field: comment, x: 16, y: 0.5, width: 120, wrap: true}
            - {field: date, x: 140, y: 0.5, width: 20}
            - {field: code, x: 162, y: 0.5, width: 21}
