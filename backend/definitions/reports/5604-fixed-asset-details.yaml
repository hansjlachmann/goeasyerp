# Report 5604 Fixed Asset - Details: the printed layout (sections per data item, positions in mm
# from the section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 5604
  name: Fixed Asset - Details
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: FixedAsset
      sections:
        - type: header
          print_on_every_page: true
          height: 18
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 10}
            - {value: depr_book_text, x: 0, y: 5, width: 120}
            - {value: company_name, x: 0, y: 9, width: 120}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 11.5
          elements:
            - {text: FA_POSTING_DATE, x: 0, y: 1, width: 18, bold: true, wrap: true}
            - {text: FA_POSTING_CATEGORY, x: 19, y: 1, width: 18, bold: true, wrap: true}
            - {text: FA_POSTING_TYPE, x: 38, y: 1, width: 37, bold: true, size: 7}
            - {text: DOCUMENT_TYPE, x: 76, y: 1, width: 16, bold: true, wrap: true}
            - {text: DOCUMENT_NO, x: 93, y: 1, width: 26, bold: true}
            - {text: DESCRIPTION, x: 120, y: 1, width: 37, bold: true}
            - {text: AMOUNT, x: 158, y: 1, width: 24, align: right, bold: true}
            - {text: NO_OF_DEPRECIATION_DAYS, x: 183, y: 1, width: 17, align: right, bold: true, wrap: true}
            - {text: USER_ID, x: 202, y: 1, width: 20, bold: true}
            - {text: POSTING_DATE, x: 223, y: 1, width: 18, bold: true, wrap: true}
            - {text: G_L_ENTRY_NO, x: 241, y: 1, width: 16, align: right, bold: true, wrap: true}
            - {text: ENTRY_NO, x: 258, y: 1, width: 15, align: right, bold: true}
            - {line: true, x: 0, y: 9.5}
        - type: body
          height: 7
          elements:
            - {field: "no", x: 0, y: 1.5, width: 25, bold: true}
            - {field: description, x: 26, y: 1.5, width: 120, bold: true}

    - name: FALedgerEntry
      sections:
        - type: body
          height: 4.2
          elements:
            - {field: fa_posting_date, x: 0, y: 0, width: 18}
            - {field: fa_posting_category, x: 19, y: 0, width: 18}
            - {field: fa_posting_type, x: 38, y: 0, width: 37}
            - {field: document_type, x: 76, y: 0, width: 16}
            - {field: document_no, x: 93, y: 0, width: 26}
            - {field: description, x: 120, y: 0, width: 37}
            - {field: amount, x: 158, y: 0, width: 24, align: right}
            - {field: no_of_depreciation_days, x: 183, y: 0, width: 17, align: right, blank_zero: true}
            - {field: user_id, x: 202, y: 0, width: 20}
            - {field: posting_date, x: 223, y: 0, width: 18}
            - {field: g_l_entry_no, x: 241, y: 0, width: 16, align: right, blank_zero: true}
            - {field: entry_no, x: 258, y: 0, width: 15, align: right}
