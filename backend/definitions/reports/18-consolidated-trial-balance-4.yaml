# Report 18 Consolidated Trial Balance (4): the printed layout (sections per data item, positions
# in mm from the section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 18
  name: Consolidated Trial Balance (4)
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: G_L_Account
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: period_text, x: 0, y: 4.5, width: 140}
            - {value: company_name, x: 0, y: 9, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: in_thousands
          height: 5
          elements:
            - {text: IN_THOUSANDS, x: 0, y: 0, width: 140}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 13
          elements:
            - {value: amount_type, x: 0, y: 1, width: 60, bold: true}
            - {text: NO, x: 0, y: 6, width: 18, bold: true}
            - {text: NAME, x: 19, y: 6, width: 60, bold: true}
            - {value: bu_code_1, x: 80, y: 6, width: 26, align: right, bold: true}
            - {value: bu_code_2, x: 107, y: 6, width: 26, align: right, bold: true}
            - {value: bu_code_3, x: 134, y: 6, width: 26, align: right, bold: true}
            - {value: bu_code_4, x: 161, y: 6, width: 26, align: right, bold: true}
            - {text: TOTAL, x: 188, y: 6, width: 28, align: right, bold: true}
            - {text: ELIMINATIONS, x: 217, y: 6, width: 27, align: right, bold: true}
            - {text: TOTAL_INCL_ELIMINATIONS, x: 245, y: 2, width: 28, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 11}
        - type: body
          print_if: is_total
          height: 4.5
          elements:
            - {field: "no", x: 0, y: 0.5, width: 18, bold: true}
            - {value: name, x: 19, y: 0.5, width: 60, bold: true}
            - {value: amount_1, x: 80, y: 0.5, width: 26, align: right, bold: true, blank_zero: true}
            - {value: amount_2, x: 107, y: 0.5, width: 26, align: right, bold: true, blank_zero: true}
            - {value: amount_3, x: 134, y: 0.5, width: 26, align: right, bold: true, blank_zero: true}
            - {value: amount_4, x: 161, y: 0.5, width: 26, align: right, bold: true, blank_zero: true}
            - {value: total, x: 188, y: 0.5, width: 28, align: right, bold: true, blank_zero: true}
            - {value: eliminations, x: 217, y: 0.5, width: 27, align: right, bold: true, blank_zero: true}
            - {value: total_incl, x: 245, y: 0.5, width: 28, align: right, bold: true, blank_zero: true}
        - type: body
          print_unless: is_total
          height: 4.5
          elements:
            - {field: "no", x: 0, y: 0.5, width: 18}
            - {value: name, x: 19, y: 0.5, width: 60}
            - {value: amount_1, x: 80, y: 0.5, width: 26, align: right, blank_zero: true}
            - {value: amount_2, x: 107, y: 0.5, width: 26, align: right, blank_zero: true}
            - {value: amount_3, x: 134, y: 0.5, width: 26, align: right, blank_zero: true}
            - {value: amount_4, x: 161, y: 0.5, width: 26, align: right, blank_zero: true}
            - {value: total, x: 188, y: 0.5, width: 28, align: right, blank_zero: true}
            - {value: eliminations, x: 217, y: 0.5, width: 27, align: right, blank_zero: true}
            - {value: total_incl, x: 245, y: 0.5, width: 28, align: right, blank_zero: true}
