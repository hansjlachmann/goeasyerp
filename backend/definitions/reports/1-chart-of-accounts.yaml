# Report 1 Chart of Accounts: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 1
  name: Chart of Accounts
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: GLAccount
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: NO, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: NAME, x: 21, y: 1, width: 80, bold: true, wrap: true}
            - {text: INCOME_BALANCE, x: 102, y: 1, width: 26, bold: true, wrap: true}
            - {text: ACCOUNT_TYPE, x: 129, y: 1, width: 24, bold: true, wrap: true}
            - {text: TOTALING, x: 154, y: 1, width: 40, bold: true, wrap: true}
            - {text: GEN_POSTING_TYPE, x: 195, y: 1, width: 22, bold: true, wrap: true}
            - {text: GEN_BUS_POSTING_GROUP, x: 218, y: 1, width: 26, bold: true, wrap: true}
            - {text: GEN_PROD_POSTING_GROUP, x: 245, y: 1, width: 28, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          print_if: is_total
          height: 4.2
          elements:
            - {field: "no", x: 0, y: 0, width: 20, bold: true}
            - {value: name, x: 21, y: 0, width: 80, bold: true}
            - {field: income_balance, x: 102, y: 0, width: 26, bold: true}
            - {field: account_type, x: 129, y: 0, width: 24, bold: true}
            - {field: totaling, x: 154, y: 0, width: 40, bold: true}
            - {field: gen_posting_type, x: 195, y: 0, width: 22, bold: true}
            - {field: gen_bus_posting_group, x: 218, y: 0, width: 26, bold: true}
            - {field: gen_prod_posting_group, x: 245, y: 0, width: 28, bold: true}
        - type: body
          print_unless: is_total
          height: 4.2
          elements:
            - {field: "no", x: 0, y: 0, width: 20}
            - {value: name, x: 21, y: 0, width: 80}
            - {field: income_balance, x: 102, y: 0, width: 26}
            - {field: account_type, x: 129, y: 0, width: 24}
            - {field: totaling, x: 154, y: 0, width: 40}
            - {field: gen_posting_type, x: 195, y: 0, width: 22}
            - {field: gen_bus_posting_group, x: 218, y: 0, width: 26}
            - {field: gen_prod_posting_group, x: 245, y: 0, width: 28}
