# Report 804 Sub-Assemblies: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 804
  name: Sub-Assemblies
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: Item
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: NO, x: 0, y: 1, width: 22, bold: true, wrap: true}
            - {text: DESCRIPTION, x: 23, y: 1, width: 60, bold: true, wrap: true}
            - {text: BASE_UNIT_OF_MEASURE, x: 84, y: 1, width: 16, bold: true, wrap: true}
            - {text: INVENTORY, x: 101, y: 1, width: 22, align: right, bold: true, wrap: true}
            - {text: REORDER_POINT, x: 124, y: 1, width: 22, align: right, bold: true, wrap: true}
            - {text: LEAD_TIME_CALCULATION, x: 148, y: 1, width: 22, bold: true, wrap: true}
            - {text: ALTERNATIVE_ITEM_NO, x: 171, y: 1, width: 24, bold: true, wrap: true}
            - {text: UNIT_COST, x: 196, y: 1, width: 25, align: right, bold: true, wrap: true}
            - {text: VALUE_ON_HAND, x: 222, y: 1, width: 28, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          height: 4.2
          elements:
            - {field: "no", x: 0, y: 0, width: 22}
            - {field: description, x: 23, y: 0, width: 60}
            - {field: base_unit_of_measure, x: 84, y: 0, width: 16}
            - {field: quantity_on_hand, x: 101, y: 0, width: 22, align: right, decimal_places: "2:5", blank_zero: true}
            - {field: reorder_point, x: 124, y: 0, width: 22, align: right, decimal_places: "2:5", blank_zero: true}
            - {field: lead_time_calculation, x: 148, y: 0, width: 22}
            - {field: alternative_item_no, x: 171, y: 0, width: 24}
            - {field: unit_cost, x: 196, y: 0, width: 25, align: right}
            - {value: value_on_hand, x: 222, y: 0, width: 28, align: right, decimal_places: "2:2"}
