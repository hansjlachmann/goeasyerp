# Report 704 Serial Number Sold History: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 704
  name: Serial Number Sold History
  page:
    size: A4
    orientation: portrait
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: Item
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 120}
            - {value: today, x: 126, y: 0, width: 60, align: right}
            - {text: PAGE, x: 126, y: 4, width: 50, align: right}
            - {page_no: true, x: 176, y: 4, width: 10, align: right}
            - {value: user_id, x: 126, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 186, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: CUSTOMER_NO, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: CUSTOMER_NAME, x: 21, y: 1, width: 55, bold: true, wrap: true}
            - {text: SERIAL_NO, x: 77, y: 1, width: 30, bold: true, wrap: true}
            - {text: POSTING_DATE, x: 108, y: 1, width: 20, bold: true, wrap: true}
            - {text: UNIT_AMOUNT, x: 129, y: 1, width: 27, align: right, bold: true, wrap: true}
            - {text: UNIT_COST, x: 157, y: 1, width: 27, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}

    - name: Item_Ledger_Entry
      sections:
        - type: body
          print_if: first_entry
          height: 6
          elements:
            - {value: item_no, x: 0, y: 1.5, width: 25, bold: true}
            - {value: item_description, x: 26, y: 1.5, width: 100, bold: true}
        - type: body
          height: 4.2
          elements:
            - {field: source_no, x: 0, y: 0, width: 20}
            - {value: customer_name, x: 21, y: 0, width: 55}
            - {field: serial_no, x: 77, y: 0, width: 30}
            - {field: posting_date, x: 108, y: 0, width: 20}
            - {field: unit_amount, x: 129, y: 0, width: 27, align: right}
            - {field: unit_cost, x: 157, y: 0, width: 27, align: right}
