# Report 5625 Insurance - Tot. Value Insured: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 5625
  name: Insurance - Tot. Value Insured
  page:
    size: A4
    orientation: portrait
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: FixedAsset
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 10}
            - {value: company_name, x: 0, y: 9, width: 120}
            - {value: today, x: 126, y: 0, width: 60, align: right}
            - {text: PAGE, x: 126, y: 4, width: 50, align: right}
            - {page_no: true, x: 176, y: 4, width: 10, align: right}
            - {value: user_id, x: 126, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 186, wrap: true}
        - type: header
          print_on_every_page: true
          height: 11
          elements:
            - {text: FA_NO, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: FA_DESCRIPTION, x: 21, y: 1, width: 50, bold: true}
            - {text: INSURANCE_NO, x: 72, y: 1, width: 20, bold: true, wrap: true}
            - {text: INSURANCE_DESCRIPTION, x: 93, y: 1, width: 60, bold: true}
            - {text: TOTAL_VALUE_INSURED, x: 154, y: 1, width: 32, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 9.5}

    - name: InsCoverageLedgerEntry
      sections:
        - type: body
          height: 4.2
          elements:
            - {value: fa_no, x: 0, y: 0, width: 20}
            - {value: fa_description, x: 21, y: 0, width: 50}
            - {field: insurance_no, x: 72, y: 0, width: 20}
            - {value: insurance_description, x: 93, y: 0, width: 60}
            - {value: total_value_insured, x: 154, y: 0, width: 32, align: right}
