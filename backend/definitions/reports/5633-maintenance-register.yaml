# Report 5633 Maintenance Register: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 5633
  name: Maintenance Register
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: FARegister
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 10}
            - {value: company_name, x: 0, y: 9, width: 120}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 11.5
          elements:
            - {text: FA_POSTING_DATE, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: POSTING_DATE, x: 21, y: 1, width: 20, bold: true, wrap: true}
            - {text: DOCUMENT_TYPE, x: 42, y: 1, width: 16, bold: true, wrap: true}
            - {text: DOCUMENT_NO, x: 59, y: 1, width: 26, bold: true, wrap: true}
            - {text: FA_NO, x: 86, y: 1, width: 18, bold: true}
            - {text: FA_DESCRIPTION, x: 105, y: 1, width: 36, bold: true}
            - {text: DESCRIPTION, x: 142, y: 1, width: 36, bold: true}
            - {text: DEPRECIATION_BOOK_CODE, x: 179, y: 1, width: 20, bold: true, wrap: true}
            - {text: MAINTENANCE_CODE, x: 200, y: 1, width: 22, bold: true, wrap: true}
            - {text: AMOUNT, x: 223, y: 1, width: 22, align: right, bold: true}
            - {text: ENTRY_NO, x: 246, y: 1, width: 12, align: right, bold: true, wrap: true}
            - {text: G_L_ENTRY_NO, x: 259, y: 1, width: 14, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 9.5}
        - type: body
          height: 7
          elements:
            - {text: REGISTER_NO, x: 0, y: 1.5, width: 30, bold: true}
            - {field: "no", x: 31, y: 1.5, width: 20, bold: true}
        - type: footer
          height: 8
          elements:
            - {line: true, x: 223, y: 1, width: 22}
            - {text: TOTAL, x: 0, y: 2, width: 60, bold: true}
            - {value: total, x: 223, y: 2, width: 22, align: right, bold: true}

    - name: MaintenanceLedgerEntry
      sections:
        - type: body
          height: 4.2
          elements:
            - {field: fa_posting_date, x: 0, y: 0, width: 20}
            - {field: posting_date, x: 21, y: 0, width: 20}
            - {field: document_type, x: 42, y: 0, width: 16}
            - {field: document_no, x: 59, y: 0, width: 26}
            - {field: fa_no, x: 86, y: 0, width: 18}
            - {value: fa_description, x: 105, y: 0, width: 36}
            - {field: description, x: 142, y: 0, width: 36}
            - {field: depreciation_book_code, x: 179, y: 0, width: 20}
            - {field: maintenance_code, x: 200, y: 0, width: 22}
            - {field: amount, x: 223, y: 0, width: 22, align: right}
            - {field: entry_no, x: 246, y: 0, width: 12, align: right}
            - {field: g_l_entry_no, x: 259, y: 0, width: 14, align: right, blank_zero: true}
        - type: footer
          height: 7
          elements:
            - {line: true, x: 223, y: 0.5, width: 22}
            - {text: TOTAL, x: 142, y: 1.5, width: 36, bold: true}
            - {value: reg_total, x: 223, y: 1.5, width: 22, align: right, bold: true}
