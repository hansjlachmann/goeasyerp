# Report 701 Inventory - List: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 701
  name: Inventory - List
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: Item
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: NO, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: DESCRIPTION, x: 21, y: 1, width: 70, bold: true, wrap: true}
            - {text: BASE_UNIT_OF_MEASURE, x: 92, y: 1, width: 18, bold: true, wrap: true}
            - {text: INVENTORY_POSTING_GROUP, x: 111, y: 1, width: 26, bold: true, wrap: true}
            - {text: COSTING_METHOD, x: 138, y: 1, width: 20, bold: true, wrap: true}
            - {text: INVENTORY, x: 159, y: 1, width: 26, align: right, bold: true, wrap: true}
            - {text: UNIT_COST, x: 186, y: 1, width: 26, align: right, bold: true, wrap: true}
            - {text: UNIT_PRICE, x: 213, y: 1, width: 26, align: right, bold: true, wrap: true}
            - {text: VENDOR_NO, x: 240, y: 1, width: 33, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          height: 4.2
          elements:
            - {field: "no", x: 0, y: 0, width: 20}
            - {field: description, x: 21, y: 0, width: 70}
            - {field: base_unit_of_measure, x: 92, y: 0, width: 18}
            - {field: inventory_posting_group, x: 111, y: 0, width: 26}
            - {field: costing_method, x: 138, y: 0, width: 20}
            - {field: quantity_on_hand, x: 159, y: 0, width: 26, align: right}
            - {field: unit_cost, x: 186, y: 0, width: 26, align: right}
            - {field: unit_price, x: 213, y: 0, width: 26, align: right}
            - {field: vendor_no, x: 240, y: 0, width: 33}
