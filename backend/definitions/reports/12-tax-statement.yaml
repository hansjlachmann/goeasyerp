# Report 12 Tax Statement: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 12
  name: Tax Statement
  page:
    size: A4
    orientation: portrait
    margins: {top: 12, bottom: 12, left: 15, right: 12}
  font_size: 9
  data_items:
    - name: TaxStatementName
      sections:
        - type: header
          print_on_every_page: true
          height: 15
          elements:
            - {text: TITLE, x: 0, y: 0, width: 120, bold: true, size: 11}
            - {value: company_name, x: 0, y: 5, width: 120}
            - {value: today, x: 123, y: 0, width: 60, align: right}
            - {text: PAGE, x: 123, y: 4, width: 50, align: right}
            - {page_no: true, x: 173, y: 4, width: 10, align: right}
            - {value: user_id, x: 123, y: 8, width: 60, align: right}
        - type: body
          height: 11
          elements:
            - {text: TEMPLATE, x: 0, y: 1, width: 45}
            - {field: statement_template_name, x: 45, y: 1, width: 40, bold: true}
            - {text: STATEMENT_NAME, x: 0, y: 5.5, width: 45}
            - {field: name, x: 45, y: 5.5, width: 25, bold: true}
            - {field: description, x: 72, y: 5.5, width: 110}

    - name: TaxStatementLine
      sections:
        - type: header
          print_if: period_text
          height: 5
          elements:
            - {value: period_text, x: 0, y: 0, width: 183}
        - type: header
          height: 5
          elements:
            - {value: amounts_in, x: 0, y: 0, width: 183}
        - type: header
          print_if: whole_numbers
          height: 5
          elements:
            - {text: WHOLE_NUMBERS, x: 0, y: 0, width: 183}
        - type: header
          print_if: whole_add_curr
          height: 5
          elements:
            - {value: whole_add_curr_text, x: 0, y: 0, width: 183}
        - type: header
          print_if: all_entries
          height: 5
          elements:
            - {text: ALL_ENTRIES, x: 0, y: 0, width: 183}
        - type: header
          print_if: closed_entries
          height: 5
          elements:
            - {text: CLOSED_ENTRIES, x: 0, y: 0, width: 183}
        - type: header
          print_on_every_page: true
          height: 8
          elements:
            - {text: ROW_NO, x: 0, y: 2, width: 20, bold: true}
            - {text: DESCRIPTION, x: 22, y: 2, width: 110, bold: true}
            - {text: AMOUNT, x: 143, y: 2, width: 40, align: right, bold: true}
            - {line: true, x: 0, y: 6.5}
        - type: body
          print_if: is_description
          height: 5
          elements:
            - {field: row_no, x: 0, y: 0.5, width: 20}
            - {field: description, x: 22, y: 0.5, width: 120, bold: true}
        - type: body
          print_unless: is_description
          height: 5
          elements:
            - {field: row_no, x: 0, y: 0.5, width: 20}
            - {field: description, x: 22, y: 0.5, width: 120}
            - {value: amount, x: 143, y: 0.5, width: 40, align: right}
