# Report 4 Detail Trial Balance: the printed layout (sections per data item, positions in mm from the
# section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 4
  name: Detail Trial Balance
  page:
    size: A4
    orientation: landscape
    margins: {top: 12, bottom: 12, left: 12, right: 12}
  font_size: 8
  data_items:
    - name: GLAccount
      sections:
        - type: header
          print_on_every_page: true
          height: 14
          elements:
            - {text: TITLE, x: 0, y: 0, width: 140, bold: true, size: 10}
            - {value: company_name, x: 0, y: 5, width: 140}
            - {value: today, x: 213, y: 0, width: 60, align: right}
            - {text: PAGE, x: 213, y: 4, width: 50, align: right}
            - {page_no: true, x: 263, y: 4, width: 10, align: right}
            - {value: user_id, x: 213, y: 8, width: 60, align: right}
        - type: header
          print_if: period_text
          height: 5
          elements:
            - {value: period_text, x: 0, y: 0, width: 273}
        - type: header
          print_if: filter_text
          height: 5
          elements:
            - {value: filter_text, x: 0, y: 0, width: 273, wrap: true}
        - type: header
          print_on_every_page: true
          height: 9
          elements:
            - {text: POSTING_DATE, x: 0, y: 1, width: 20, bold: true, wrap: true}
            - {text: DOCUMENT_TYPE, x: 21, y: 1, width: 32, bold: true, wrap: true}
            - {text: DOCUMENT_NO, x: 54, y: 1, width: 31, bold: true, wrap: true}
            - {text: DESCRIPTION, x: 86, y: 1, width: 63, bold: true, wrap: true}
            - {text: DEBIT_AMOUNT, x: 150, y: 1, width: 30, align: right, bold: true, wrap: true}
            - {text: CREDIT_AMOUNT, x: 181, y: 1, width: 30, align: right, bold: true, wrap: true}
            - {text: BALANCE, x: 212, y: 1, width: 32, align: right, bold: true, wrap: true}
            - {text: ENTRY_NO, x: 246, y: 1, width: 20, align: right, bold: true, wrap: true}
            - {line: true, x: 0, y: 7.5}
        - type: body
          height: 6.5
          elements:
            - {field: "no", x: 0, y: 1.5, width: 20, bold: true}
            - {field: name, x: 21, y: 1.5, width: 120, bold: true}
            - {text: BALANCE_BEFORE, x: 150, y: 1.5, width: 61, align: right}
            - {value: start_balance, x: 212, y: 1.5, width: 32, align: right, bold: true}

    - name: GLEntry
      sections:
        - type: body
          height: 4.2
          elements:
            - {field: posting_date, x: 0, y: 0, width: 20}
            - {field: document_type, x: 21, y: 0, width: 32}
            - {field: document_no, x: 54, y: 0, width: 31}
            - {field: description, x: 86, y: 0, width: 63}
            - {field: debit_amount, x: 150, y: 0, width: 30, align: right, blank_zero: true}
            - {field: credit_amount, x: 181, y: 0, width: 30, align: right, blank_zero: true}
            - {value: balance, x: 212, y: 0, width: 32, align: right}
            - {field: entry_no, x: 246, y: 0, width: 20, align: right}
        - type: footer
          height: 7
          elements:
            - {line: true, x: 150, y: 0.5}
            - {text: BALANCE_AT_END, x: 86, y: 1.5, width: 63}
            - {total: debit_amount, x: 150, y: 1.5, width: 30, align: right, blank_zero: true}
            - {total: credit_amount, x: 181, y: 1.5, width: 30, align: right, blank_zero: true}
            - {value: balance, x: 212, y: 1.5, width: 32, align: right, bold: true}
