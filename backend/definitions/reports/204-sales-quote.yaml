# Report 204 Sales - Quote: the printed layout (sections per data item, positions in mm from
# the section's top left corner inside the margins; see business-logic/reports/layout.go)
report:
  id: 204
  name: Sales - Quote
  page:
    size: A4
    orientation: portrait
    margins: {top: 12, bottom: 12, left: 15, right: 12}
  font_size: 9
  data_items:
    - name: SalesHeader
      new_page_per_record: true

    - name: CopyLoop
      new_page_per_record: true
      sections:
        - type: header
          print_on_every_page: true
          height: 118
          elements:
            # The company (Print Company Address) and its logo
            - {lines: company_address, x: 0, y: 0, width: 95}
            - {text: PHONE_NO, x: 0, y: 34, width: 22, print_if: company_phone_no}
            - {value: company_phone_no, x: 22, y: 34, width: 70}
            - {text: E_MAIL, x: 0, y: 38, width: 22, print_if: company_e_mail}
            - {value: company_e_mail, x: 22, y: 38, width: 70}
            - {image: company_picture, x: 133, y: 0, width: 50, height: 20}
            # The document
            - {text: SALES_QUOTE, x: 93, y: 22, width: 90, align: right, size: 16, bold: true}
            - {value: copy_text, x: 93, y: 29, width: 90, align: right, bold: true}
            - {text: QUOTE_NO, x: 118, y: 35, width: 30}
            - {field: SalesHeader.no, x: 148, y: 35, width: 35, align: right}
            - {text: QUOTE_DATE, x: 118, y: 39, width: 30}
            - {field: SalesHeader.order_date, x: 148, y: 39, width: 35, align: right}
            - {text: PAGE, x: 118, y: 43, width: 30}
            - {page_no: true, x: 148, y: 43, width: 35, align: right}
            # Bill-to and ship-to addresses
            - {text: BILL_TO, x: 0, y: 52, width: 85, bold: true}
            - {lines: bill_to_address, x: 0, y: 57, width: 85}
            - {text: SHIP_TO, x: 98, y: 52, width: 85, bold: true}
            - {lines: ship_to_address, x: 98, y: 57, width: 85}
            # The terms
            - {line: true, x: 0, y: 93}
            - {text: CUSTOMER_ID, x: 0, y: 94, width: 30, bold: true}
            - {field: SalesHeader.bill_to_customer_no, x: 0, y: 98.5, width: 30}
            - {text: PO_NUMBER, x: 30, y: 94, width: 35, bold: true}
            - {field: SalesHeader.your_reference, x: 30, y: 98.5, width: 35}
            - {text: SALESPERSON, x: 65, y: 94, width: 40, bold: true}
            - {value: salesperson, x: 65, y: 98.5, width: 40}
            - {text: SHIP_VIA, x: 105, y: 94, width: 38, bold: true}
            - {value: ship_via, x: 105, y: 98.5, width: 38}
            - {text: TERMS, x: 143, y: 94, width: 40, bold: true}
            - {value: terms, x: 143, y: 98.5, width: 40}
            - {line: true, x: 0, y: 104}
            # The columns of the lines
            - {text: ITEM_NO, x: 0, y: 108, width: 22, bold: true}
            - {text: UNIT, x: 22, y: 108, width: 15, bold: true}
            - {text: DESCRIPTION, x: 37, y: 108, width: 76, bold: true}
            - {text: QUANTITY, x: 113, y: 108, width: 20, align: right, bold: true}
            - {value: unit_price_caption, x: 133, y: 108, width: 25, align: right, bold: true}
            - {value: line_amount_caption, x: 158, y: 108, width: 25, align: right, bold: true}
            - {line: true, x: 0, y: 113}

    - name: SalesLine
      sections:
        - type: trans_header
          height: 6
          elements:
            - {text: CONTINUED_FROM, x: 37, y: 0, width: 96}
            - {total_value: line_amount, x: 158, y: 0, width: 25, align: right}
        - type: body
          height: 4.6
          elements:
            - {field: no, x: 0, y: 0, width: 21}
            - {field: unit_of_measure_code, x: 22, y: 0, width: 14}
            - {field: description, x: 37, y: 0, width: 75, wrap: true}
            - {field: quantity, x: 113, y: 0, width: 20, align: right, blank_zero: true}
            - {field: unit_price, x: 133, y: 0, width: 25, align: right, blank_zero: true, decimal_places: "2:5"}
            - {value: line_amount, x: 158, y: 0, width: 25, align: right, blank_zero: true}
        - type: body
          print_if: description_2
          height: 4.6
          elements:
            - {field: description_2, x: 37, y: 0, width: 75, wrap: true}
        - type: trans_footer
          height: 7
          elements:
            - {line: true, x: 133, y: 1, width: 50}
            - {text: CONTINUED, x: 37, y: 1.5, width: 96}
            - {total_value: line_amount, x: 158, y: 1.5, width: 25, align: right}
        # The totals: one section per row, so rows that do not apply leave no gap. Without Prices
        # Including Tax: subtotal, invoice discount, the amounts subject to / exempt from the tax,
        # the tax, the total; with it: the total including the tax first, the tax it includes and
        # the total without it.
        - type: footer
          print_unless: prices_incl_tax
          height: 7.5
          elements:
            - {line: true, x: 98, y: 2, width: 85}
            - {text: SUBTOTAL, x: 98, y: 3, width: 60}
            - {value: subtotal, x: 158, y: 3, width: 25, align: right}
        - type: footer
          print_if: prices_incl_tax
          height: 7.5
          elements:
            - {line: true, x: 98, y: 2, width: 85}
            - {value: total_incl_tax_caption, x: 98, y: 3, width: 45, bold: true}
            - {value: currency, x: 143, y: 3, width: 15, bold: true}
            - {value: total, x: 158, y: 3, width: 25, align: right, bold: true}
        - type: footer
          print_if: invoice_discount
          height: 4.5
          elements:
            - {text: INVOICE_DISCOUNT, x: 98, y: 0, width: 60}
            - {value: invoice_discount, x: 158, y: 0, width: 25, align: right}
        - type: footer
          print_if: invoice_discount_excl
          height: 4.5
          elements:
            - {value: invoice_discount_excl_caption, x: 98, y: 0, width: 60}
            - {value: invoice_discount_excl, x: 158, y: 0, width: 25, align: right}
        - type: footer
          print_if: show_tax_base
          height: 9
          elements:
            - {value: amount_subject_caption, x: 98, y: 0, width: 60}
            - {value: amount_subject, x: 158, y: 0, width: 25, align: right}
            - {value: amount_exempt_caption, x: 98, y: 4.5, width: 60}
            - {value: amount_exempt, x: 158, y: 4.5, width: 25, align: right}
        - type: footer
          print_unless: prices_incl_tax
          height: 4.5
          elements:
            - {value: tax_caption, x: 98, y: 0, width: 60}
            - {value: tax_amount, x: 158, y: 0, width: 25, align: right}
        - type: footer
          print_if: prices_incl_tax
          height: 4.5
          elements:
            - {value: tax_included_caption, x: 98, y: 0, width: 60}
            - {value: tax_amount, x: 158, y: 0, width: 25, align: right}
        - type: footer
          print_unless: prices_incl_tax
          height: 6
          elements:
            - {line: true, x: 98, y: 0.5, width: 85}
            - {text: TOTAL, x: 98, y: 1.5, width: 45, bold: true}
            - {value: currency, x: 143, y: 1.5, width: 15, bold: true}
            - {value: total, x: 158, y: 1.5, width: 25, align: right, bold: true}
        - type: footer
          print_if: prices_incl_tax
          height: 4.5
          elements:
            - {value: total_excl_tax_caption, x: 98, y: 0, width: 60}
            - {value: total_excl_tax, x: 158, y: 0, width: 25, align: right}

    # The document's comments (Print Comments)
    - name: SalesCommentLine
      sections:
        - type: header
          height: 10
          elements:
            - {text: COMMENTS, x: 0, y: 5, width: 100, bold: true}
        - type: body
          height: 4.6
          elements:
            - {field: comment, x: 0, y: 0, width: 183, wrap: true}
