table:
  id: 4
  name: "Currency"
  refuse_delete_when_used: all
  caption: Currency
  description: Currencies (table 4 Currency)
  fields:
    - name: code
      no: 1
      type: types.Code
      db_name: code
      primary_key: true
      length: 10
      required: true

    - name: last_date_modified
      no: 2
      type: types.Date
      db_name: last_date_modified
      editable: false

    - name: last_date_adjusted
      no: 3
      type: types.Date
      db_name: last_date_adjusted
      editable: false

    - name: unrealized_gains_acc
      no: 6
      type: types.Code
      db_name: unrealized_gains_acc
      length: 20
      table_relation:
        table: G_L_Account
        field: no
        filters:
          account_type: {const: 0}   # Posting accounts only
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    - name: realized_gains_acc
      no: 7
      type: types.Code
      db_name: realized_gains_acc
      length: 20
      table_relation:
        table: G_L_Account
        field: no
        filters:
          account_type: {const: 0}   # Posting accounts only
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    - name: unrealized_losses_acc
      no: 8
