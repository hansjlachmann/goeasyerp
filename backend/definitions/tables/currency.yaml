      table_relation:
        table: G_L_Account
        field: no
        filters:
          account_type: {const: 0}   # Posting accounts only
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    - name: invoice_rounding_precision
      no: 10
      type: types.Decimal
      db_name: invoice_rounding_precision
      precision: 18
      scale: 5
      default: 1

    - name: invoice_rounding_type
      no: 12
      type: Option
      db_name: invoice_rounding_type
      options: ["Nearest", "Up", "Down"]

    - name: amount_rounding_precision
      no: 13
      type: types.Decimal
      db_name: amount_rounding_precision
      precision: 18
      scale: 5
      default: 0.01
      decimal_places: "2:5"
      validation: {min: 0}

    - name: unit_amount_rounding_precision
      no: 14
      type: types.Decimal
      db_name: unit_amount_rounding_precision
      precision: 18
      scale: 5
      default: 0.00001
      decimal_places: "2:5"
      validation: {min: 0}

    - name: description
      no: 15
      type: types.Text
      db_name: description
      length: 30

    - name: amount_decimal_places
      no: 17
      type: types.Text
      db_name: amount_decimal_places
      length: 5
      required: true
      default: "2:2"

    - name: unit_amount_decimal_places
      no: 18
      type: types.Text
      db_name: unit_amount_decimal_places
      length: 5
      required: true
      default: "2:5"

    # The customers' and vendors' amounts in the currency (classic fields 19–35, the statistics
    # by currencies of pages 481/482): filtered by Customer/Vendor Filter, the dimensions and
    # the Date Filter
    - name: customer_filter
      no: 19
      type: types.Code
      length: 20
      flow_filter: true

    - name: vendor_filter
      no: 20
      type: types.Code
      length: 20
      flow_filter: true

    - name: dimension_1_filter
      caption_class: "1,3,1"
      no: 21
      type: types.Code
      length: 10
      flow_filter: true

    - name: dimension_2_filter
      caption_class: "1,3,2"
      no: 22
      type: types.Code
      length: 10
      flow_filter: true

    - name: date_filter
      no: 23
      type: types.Date
      flow_filter: true

    - name: cust_ledg_entries_in_filter
      no: 24
      type: bool
      flow_field: true
      calc_formula: Exist
      source_table: CustomerLedgerEntry
      source_field: entry_no
      flow_filters:
        - field: customer_no
          type: filter
          value: customer_filter
        - field: currency_code
          type: field
          value: code

    - name: customer_balance
      no: 25
      type: types.Decimal
      flow_field: true
      decimal_places: "2:2"
      calc_formula: Sum
      source_table: CustomerLedgerEntry
      source_field: amount
      flow_filters:
        - field: customer_no
          type: filter
          value: customer_filter
        - field: dimension_1_code
          type: filter
          value: dimension_1_filter
        - field: dimension_2_code
          type: filter
          value: dimension_2_filter
        - field: posting_date
          type: filter
          value: date_filter
        - field: currency_code
          type: field
          value: code

    - name: customer_outstanding_orders
      no: 26
      type: types.Decimal
      flow_field: true
      decimal_places: "2:2"
      calc_formula: Sum
      source_table: SalesLine
      source_field: outstanding_amount
      flow_filters:
        - field: document_type
          type: const
          value: 1   # Order
        - field: bill_to_customer_no
          type: filter
          value: customer_filter
        - field: currency_code
          type: field
          value: code
        - field: dimension_1_code
          type: filter
          value: dimension_1_filter
        - field: dimension_2_code
          type: filter
          value: dimension_2_filter

    - name: customer_shipped_not_invoiced
      no: 27
      type: types.Decimal
      flow_field: true
      decimal_places: "2:2"
      calc_formula: Sum
      source_table: SalesLine
      source_field: shipped_not_invoiced
      flow_filters:
        - field: document_type
          type: const
          value: 1   # Order
        - field: bill_to_customer_no
          type: filter
          value: customer_filter
        - field: currency_code
          type: field
          value: code
        - field: dimension_1_code
          type: filter
          value: dimension_1_filter
        - field: dimension_2_code
          type: filter
          value: dimension_2_filter

    - name: customer_balance_due
      no: 28
      type: types.Decimal
      flow_field: true
      decimal_places: "2:2"
      calc_formula: Sum
      source_table: CustomerLedgerEntry
      source_field: remaining_amount
      flow_filters:
        - field: open
          type: const
          value: "true"
        - field: customer_no
          type: filter
          value: customer_filter
        - field: dimension_1_code
          type: filter
          value: dimension_1_filter
        - field: dimension_2_code
          type: filter
          value: dimension_2_filter
        - field: due_date
          type: filter
          value: date_filter
        - field: currency_code
          type: field
          value: code

    - name: vendor_ledg_entries_in_filter
      no: 29
