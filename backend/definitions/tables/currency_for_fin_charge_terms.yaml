table:
  id: 328
  name: "Currency_for_Fin_Charge_Terms"
  description: "The additional fee of finance charge terms in a currency (table 328)"
  lookup_page_id: 477
  data_caption_fields: [fin_charge_terms_code]
  fields:
    - name: fin_charge_terms_code
      no: 1
      type: types.Code
      db_name: fin_charge_terms_code
      length: 10
      primary_key: true
      required: true
      editable: false  # set from the list's filter (opened from the finance charge terms)
      table_relation:
        table: Finance_Charge_Terms
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: currency_code
      no: 2
      type: types.Code
      db_name: currency_code
      length: 10
      primary_key: true
      required: true
      table_relation:
        table: Currency
        field: code
        lookup_columns:
          - source: code
            width: 80
          - source: description
            width: 200

    - name: additional_fee
      no: 4
      type: types.Decimal
      db_name: additional_fee
      precision: 18
      scale: 2
      decimal_places: "2:2"
      validation: {min: 0}

  keys:
    - name: Primary
      fields: [fin_charge_terms_code, currency_code]
      clustered: true
