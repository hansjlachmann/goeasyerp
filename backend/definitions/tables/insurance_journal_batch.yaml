            width: 250

    - name: no_series
      no: 5
      type: types.Code
      db_name: no_series
      length: 10
      table_relation:
        table: No_Series
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: posting_no_series
      no: 6
      type: types.Code
      db_name: posting_no_series
      length: 10
      table_relation:
        table: No_Series
