table:
  id: 2000000006
  name: "Company"
  caption: Company
  description: Company definitions
  global: true  # Global table - no company prefix
  # A delete drops all the company's data: the user types its name to confirm (one at a time)
  type_to_delete: true
  fields:
    - name: name
      no: 1
      type: types.Text
      db_name: name
      caption: Name
      primary_key: true
      length: 100
      required: true

    - name: display_name
      no: 3
      type: types.Text
      db_name: display_name
      caption: Display Name
      length: 100

    # Set when demo data is created in the company: only such a company may be emptied for new
    # demo data (codeunit 901)
    - name: demo_company
      no: 4
      type: bool
      db_name: demo_company
      caption: Demo Company
      editable: false

  keys:
    - name: Primary
      fields: [name]
      clustered: true
