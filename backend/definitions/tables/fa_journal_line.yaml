table:
  id: 5621
  name: "FA_Journal_Line"
  description: "FA journal lines (table 5621): fixed asset postings without G/L (books whose G/L integration is off)"
  # Left out until their objects exist: 31 Budgeted FA No. (budgeted assets), 38/39/41 recurring
  # (recurring FA journals)
  fields:
    - name: journal_template_name
      no: 1
      type: types.Code
      db_name: journal_template_name
      length: 10
      primary_key: true
      required: true
      table_relation:
        table: FA_Journal_Template
        field: name
        lookup_columns:
          - source: name
            width: 100
          - source: description
            width: 250

    - name: journal_batch_name
      no: 2
      type: types.Code
      db_name: journal_batch_name
      length: 10
      primary_key: true
      required: true
      table_relation:
        table: FA_Journal_Batch
        field: name
        filters:
          journal_template_name: {field: journal_template_name}
        lookup_columns:
          - source: name
            width: 100
          - source: description
            width: 250

    - name: line_no
      no: 3
      type: int
      db_name: line_no
      primary_key: true

    - name: depreciation_book_code
      no: 4
      type: types.Code
      db_name: depreciation_book_code
      length: 10
      table_relation:
        table: Depreciation_Book
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: fa_posting_type
      no: 5
      type: Option
      db_name: fa_posting_type
      options: ["Acquisition Cost", "Depreciation", "Write-Down", "Appreciation", "Custom 1", "Custom 2", "Disposal", "Maintenance", "Salvage Value"]

    - name: fa_no
      no: 6
      type: types.Code
      db_name: fa_no
      length: 20
      table_relation:
        table: Fixed_Asset
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: description
            width: 250

    - name: fa_posting_date
      no: 7
      type: types.Date
      db_name: fa_posting_date

    - name: posting_date
      no: 8
      type: types.Date
      db_name: posting_date

    - name: document_type
      no: 9
      type: Option
      db_name: document_type
      options: [" ", "", "Invoice", "Credit Memo"]

    - name: document_date
      no: 10
      type: types.Date
      db_name: document_date

    - name: document_no
      no: 11
      type: types.Code
      db_name: document_no
      length: 20

    - name: external_document_no
      no: 12
      type: types.Code
      db_name: external_document_no
      length: 20

    - name: description
      no: 13
      type: types.Text
      db_name: description
      length: 50

    - name: amount
      no: 14
      type: types.Decimal
      db_name: amount
      decimal_places: "2:2"

    - name: debit_amount
      no: 15
      type: types.Decimal
      db_name: debit_amount
      decimal_places: "2:2"

    - name: credit_amount
      no: 16
      type: types.Decimal
      db_name: credit_amount
      decimal_places: "2:2"

    - name: salvage_value
      no: 17
      type: types.Decimal
      db_name: salvage_value
      decimal_places: "2:2"

    - name: quantity
      no: 18
      type: types.Decimal
      db_name: quantity
      decimal_places: "0:5"

    - name: correction
      no: 19
      type: bool
      db_name: correction

    - name: no_of_depreciation_days
      no: 20
      type: int
      db_name: no_of_depreciation_days

    - name: depr_until_fa_posting_date
      no: 21
      type: bool
      db_name: depr_until_fa_posting_date

    - name: depr_acquisition_cost
      no: 22
      type: bool
      db_name: depr_acquisition_cost

    - name: fa_posting_group
      no: 24
      type: types.Code
      db_name: fa_posting_group
      length: 10
      table_relation:
        table: FA_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100

    - name: maintenance_code
      no: 26
      type: types.Code
      db_name: maintenance_code
      length: 10
      table_relation:
        table: Maintenance
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: department_code
      no: 27
      type: types.Code
      db_name: department_code
      length: 10
      table_relation:
        table: Department
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: project_code
      no: 28
      type: types.Code
      db_name: project_code
      length: 10
      table_relation:
        table: Project
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: insurance_no
      no: 30
      type: types.Code
      db_name: insurance_no
      length: 20
      table_relation:
        table: Insurance
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: description
            width: 250

    - name: use_duplication_list
      no: 32
      type: bool
      db_name: use_duplication_list

    - name: duplicate_in_depreciation_book
      no: 33
      type: types.Code
      db_name: duplicate_in_depreciation_book
      length: 10
      table_relation:
        table: Depreciation_Book
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: fa_reclassification_entry
      no: 34
      type: bool
      db_name: fa_reclassification_entry

    - name: fa_error_entry_no
      no: 35
      type: int
      db_name: fa_error_entry_no
      table_relation:
        table: FA_Ledger_Entry
        field: entry_no
        lookup_columns:
          - source: entry_no
            width: 90
          - source: description
            width: 250

    - name: reason_code
      no: 36
      type: types.Code
      db_name: reason_code
      length: 10
      table_relation:
        table: Reason_Code
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: source_code
      no: 37
      type: types.Code
      db_name: source_code
      length: 10
      table_relation:
        table: Source_Code
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: index_entry
      no: 42
      type: bool
      db_name: index_entry

    - name: posting_no_series
      no: 43
      type: types.Code
      db_name: posting_no_series
      length: 10
      table_relation:
        table: No_Series
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

  keys:
    - name: Primary
      fields: [journal_template_name, journal_batch_name, line_no]
      clustered: true
    - name: fa_posting_date
      fields: [journal_template_name, journal_batch_name, fa_posting_date]
