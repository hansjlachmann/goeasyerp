table:
  id: 5622
  name: "FA_Reclass_Journal_Template"
  description: "FA reclass. journal templates (table 5622): the journals that move amounts from one fixed asset to another"
  lookup_page_id: 5638
  data_caption_fields: [name, description]
  fields:
    - name: name
      no: 1
      type: types.Code
      db_name: name
      length: 10
      primary_key: true
      required: true

    - name: description
      no: 2
      type: types.Text
      db_name: description
      length: 80

    # Form ID: the journal page of the template
    - name: page_id
      no: 6
      type: int
      db_name: page_id
      table_relation:
        table: Object
        field: id
        filters:
          type: {const: 2}
        validate: false   # set by setup; the Object rows are written at startup (a lookup only)
        lookup_columns:
          - source: id
            width: 80
          - source: caption
            width: 250
            search: name

  keys:
    - name: Primary
      fields: [name]
      clustered: true
