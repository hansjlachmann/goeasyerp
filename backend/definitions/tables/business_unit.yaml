table:
  id: 220
  name: "Business_Unit"
  caption: Business Unit
  description: "The companies consolidated into this one (table 220): each with its company, currency, share, period and the accounts of the exchange rate differences and rounding residuals"
  lookup_page_id: 240
  data_caption_fields: [code, name]
  fields:
    - name: code
      no: 1
      type: types.Code
      db_name: code
      primary_key: true
      required: true
      length: 10

    - name: consolidate
      no: 2
      type: bool
      db_name: consolidate
      default: true

    - name: consolidation_pct
      no: 3
      type: types.Decimal
      db_name: consolidation_pct
      default: 100
      decimal_places: "1:1"
      validation: {min: 0, max: 100}

    - name: starting_date
      no: 4
      type: types.Date
      db_name: starting_date

    - name: ending_date
      no: 5
      type: types.Date
      db_name: ending_date

    # the factors of the business unit's currency: for the income statement (average rate),
    # the balance sheet (current rate) and the balance sheet of the last consolidation
    - name: income_currency_factor
      no: 6
      type: types.Decimal
      db_name: income_currency_factor
      default: 1
      decimal_places: "0:15"
      validation: {min: 0}
      editable: false

    - name: balance_currency_factor
      no: 7
      type: types.Decimal
      db_name: balance_currency_factor
      default: 1
      decimal_places: "0:15"
      validation: {min: 0}
      editable: false

    - name: exch_rate_loss_acc
      no: 8
      type: types.Code
      db_name: exch_rate_loss_acc
      length: 20
      table_relation:
        table: G_L_Account
        field: "no"
        lookup_columns:
          - source: "no"
            width: 100
          - source: name
            width: 250

    - name: exch_rate_gains_acc
      no: 9
      type: types.Code
      db_name: exch_rate_gains_acc
      length: 20
      table_relation:
        table: G_L_Account
        field: "no"
        lookup_columns:
          - source: "no"
            width: 100
          - source: name
            width: 250

    - name: residual_account
      no: 10
      type: types.Code
      db_name: residual_account
      length: 20
      table_relation:
        table: G_L_Account
        field: "no"
        lookup_columns:
          - source: "no"
            width: 100
          - source: name
            width: 250

    - name: last_balance_currency_factor
      no: 11
      type: types.Decimal
      db_name: last_balance_currency_factor
      default: 1
      decimal_places: "0:15"
      editable: false

    - name: name
      no: 12
      type: types.Text
      db_name: name
      length: 30

    # the company of the business unit (Import Database reads its G/L)
    - name: company_name
      no: 13
      type: types.Text
      db_name: company_name
      length: 100
      table_relation:
        table: Company
        field: name
        validate: false
        lookup_columns:
          - source: name
            width: 200
          - source: display_name
            width: 250

    - name: currency_code
      no: 14
      type: types.Code
      db_name: currency_code
      length: 10
      table_relation:
        table: Currency
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

  keys:
    - name: Primary
      fields: [code]
      clustered: true
    - name: company
      fields: [company_name]
