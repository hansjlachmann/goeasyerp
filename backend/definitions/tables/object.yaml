table:
  id: 2000000001
  name: Object
  caption: Object
  description: The objects of this installation (tables, pages, reports, codeunits — the registered and the declared ones), written at startup
  global: true
  posted: true   # a system table written at startup (apps.SyncObjects): the API inserts, changes and deletes nothing
  lookup_page_id: 908
  data_caption_fields: [type, id, name]
  fields:
    - name: type
      no: 1
      type: Option
      db_name: type
      caption: Type
      primary_key: true
      options: ["TableData", "Table", "Page", "Report", "Dataport", "Codeunit"]

    - name: id
      no: 3
      type: int
      db_name: id
      caption: ID
      primary_key: true

    # the object's caption (English)
    - name: name
      no: 4
      type: types.Text
      db_name: name
      caption: Name
      length: 80

    # a codeunit with a Run of its own (registered: a page action or the Job Queue can run it) or
    # a report; a library codeunit (365 Format Address) is not
    - name: runnable
      no: 5
      type: bool
      db_name: runnable
      caption: Runnable

    # the object's caption in the user's language (classic Object Caption): changes with the
    # language the user works in
    - name: caption
      no: 7
      type: types.Text
      db_name: caption
      caption: Object Caption
      length: 80
      flow_field: true
      calc_formula: Lookup
      source_table: Object_Translation
      source_field: object_name
      flow_filters:
        - field: object_type
          type: field
          value: type
        - field: object_id
          type: field
          value: id
        - field: language_id
          type: language

  keys:
    - name: Primary
      fields: [type, id]
      clustered: true
