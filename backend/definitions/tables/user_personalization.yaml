table:
  id: 2000000073
  name: User_Personalization
  caption: User Personalization
  description: Appearance of the user interface per user (User Personalization)
  global: true  # Global table - the same appearance in every company
  fields:
    - name: user_id
      no: 1
      type: types.Code
      db_name: user_id
      caption: User ID
      primary_key: true
      length: 50
      required: true
      table_relation:
        table: User
        field: user_id

    # Theme used in light mode / dark mode (code of a built-in or installed theme)
    - name: light_theme
      no: 2
      type: types.Code
      db_name: light_theme
      caption: Light Theme
      length: 50

    - name: dark_theme
      no: 3
      type: types.Code
      db_name: dark_theme
      caption: Dark Theme
      length: 50

    - name: mode
      no: 4
      type: Option
      db_name: mode
      caption: Mode
      options: ["Dark", "Light"]

    # Wallpaper: asset name of the dark/light theme (blank = none), its opacity and blur
    - name: wallpaper
      no: 5
      type: types.Text
      db_name: wallpaper
      caption: Wallpaper
      length: 20

    - name: wallpaper_opacity
      no: 6
      type: int
      db_name: wallpaper_opacity
      caption: Wallpaper Opacity %

    - name: wallpaper_blur
      no: 7
      type: int
      db_name: wallpaper_blur
      caption: Wallpaper Blur

    - name: panel_opacity
      no: 8
      type: int
      db_name: panel_opacity
      caption: Panel Opacity %

    - name: font
      no: 9
      type: Option
      db_name: font
      caption: Font
      options: ["Default", "System", "Inter", "IBM Plex Sans", "Serif", "Monospace"]

    # Font size in percent of the default (0 = default)
    - name: font_size
      no: 10
      type: int
      db_name: font_size
      caption: Font Size %

    - name: density
      no: 11
      type: Option
      db_name: density
      caption: Density
      options: ["Comfortable", "Compact"]

    - name: updated_at
      no: 12
      type: types.DateTime
      db_name: updated_at
      caption: Updated At

    # Regional settings (My Settings): how dates and numbers are shown and entered
    - name: date_format
      no: 13
      type: Option
      db_name: date_format
      caption: Date Format
      options: ["Language Default", "DD.MM.YY", "DD.MM.YYYY", "DD/MM/YYYY", "MM/DD/YYYY", "YYYY-MM-DD"]

    - name: number_format
      no: 14
      type: Option
      db_name: number_format
      caption: Number Format
      options: ["Language Default", "Comma Thousands Point Decimals", "Point Thousands Comma Decimals", "Space Thousands Comma Decimals", "Point Decimals"]

    # The work date (classic): new documents and short date entries use it; blank = today. Back
    # to today at every login.
    - name: work_date
      no: 15
      type: types.Date
      db_name: work_date
      caption: Work Date

    # The font of amounts (decimals): the text font, or IBM Plex Mono — both with tabular
    # figures, so columns line up
    - name: amount_font
      no: 16
      type: Option
      db_name: amount_font
      caption: Amount Font
      options: ["Text Font", "Monospace"]

  keys:
    - name: Primary
      fields: [user_id]
      clustered: true
