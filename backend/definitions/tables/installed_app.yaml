table:
  id: 2000000153
  name: Installed_App
  caption: Installed App
  description: The apps installed in this database one row per application.yaml, written at startup
  global: true
  fields:
    - name: app_id
      no: 1
      type: types.Text
      db_name: app_id
      caption: App ID
      primary_key: true
      length: 36
      required: true

    - name: name
      no: 2
      type: types.Text
      db_name: name
      caption: Name
      length: 100

    - name: publisher
      no: 3
      type: types.Text
      db_name: publisher
      caption: Publisher
      length: 100

    - name: contact
      no: 4
      type: types.Text
      db_name: contact
      caption: Contact
      length: 250

    - name: version
      no: 5
      type: types.Text
      db_name: version
      caption: Version
      length: 50

    - name: object_series
      no: 6
      type: types.Text
      db_name: object_series
      caption: Object Numbers
      length: 250

    - name: field_series
      no: 7
      type: types.Text
      db_name: field_series
      caption: Field Numbers
      length: 250

    - name: system_tables
      no: 8
      type: types.Text
      db_name: system_tables
      caption: System Object Numbers
      length: 250

    - name: installed_at
      no: 9
      type: types.DateTime
      db_name: installed_at
      caption: Installed At

    - name: updated_at
      no: 10
      type: types.DateTime
      db_name: updated_at
      caption: Updated At

    # An extension app switched off (Disable on page 907, SUPER only): its business logic,
    # events, field checks, page parts, menu entries and objects do not run or show; its data
    # stays. Stored as Disabled so an app is on when the column is added.
    - name: disabled
      no: 11
      type: bool
      db_name: disabled
      caption: Disabled
      editable: false

    # Installing and uninstalling (Installed Apps, SUPER only): an app chosen to install is
    # Pending Install until a build includes it, one chosen to uninstall Pending Removal until a
    # build leaves it out (the build list, Build List, is what the installation's build reads)
    - name: status
      no: 12
      type: Option
      db_name: status
      caption: Status
      options: ["Installed", "Pending Install", "Pending Removal"]
      editable: false

    # Where the app's build takes it from: its GitHub repository, the version (tag) and the
    # folder of its application.yaml
    - name: source
      no: 13
      type: types.Text
      db_name: source
      caption: Repository
      length: 250
      editable: false

    - name: source_ref
      no: 14
      type: types.Text
      db_name: source_ref
      caption: Repository Version
      length: 100
      editable: false

    - name: source_path
      no: 15
      type: types.Text
      db_name: source_path
      caption: Repository Folder
      length: 100
      editable: false

    # The app's application.yaml as read when it was chosen to install: its dependencies and
    # number series are checked against it until a build includes the app (never sent to the
    # browser)
    - name: manifest
      no: 16
      type: "[]byte"
      db_name: manifest
      caption: Application File

    # Where the build takes the app from: a Git repository (Source, Source Ref, Source Path) or
    # an uploaded app package (App Package of the app's id and version)
    - name: source_type
      no: 17
      type: Option
      db_name: source_type
      caption: Source Type
      options: ["Git", "Package"]
      editable: false

  keys:
    - name: Primary
      fields: [app_id]
      clustered: true
