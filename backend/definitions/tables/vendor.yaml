    - name: territory_code
      no: 15
      type: types.Code
      db_name: territory_code
      length: 10
      table_relation:
        table: Territory
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: dimension_1_code
      no: 16
