table:
  id: 23
  name: "Vendor"
  description: "Vendors (table 23)"
  data_caption_fields: [no, name]
  auto_key: true   # OnInsert gives a vendor without No. the next number of its series
  # Left out until their tables exist: 78/79/113/114 Outstanding Orders / Amt. Rcd. Not
  # Invoiced (Purchase Line); 10004/10016/10020 (local field series)
  fields:
    - name: no
      no: 1
      type: types.Code
      db_name: no
      length: 20
      primary_key: true
      required: true

    - name: name
      no: 2
      type: types.Text
      db_name: name
      length: 50

    - name: search_name
      no: 3
      type: types.Code
      db_name: search_name
      length: 50

    - name: name_2
      no: 4
      type: types.Text
      db_name: name_2
      length: 50

    - name: address
      no: 5
      type: types.Text
      db_name: address
      length: 50

    - name: address_2
      no: 6
      type: types.Text
      db_name: address_2
      length: 50

    - name: city
      no: 7
      type: types.Text
      db_name: city
      length: 50

    - name: contact
      no: 8
      type: types.Text
      db_name: contact
      length: 50

    - name: phone_no
      no: 9
      type: types.Text
      db_name: phone_no
      length: 30

    - name: telex_no
      no: 10
      type: types.Text
      db_name: telex_no
      length: 20

    - name: our_account_no
      no: 14
