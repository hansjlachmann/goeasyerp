table:
  id: 295
  name: "Reminder_Header"
  description: "Reminders (table 295): the overdue entries of a customer with interest and additional fee, issued into an issued reminder"
  lookup_page_id: 436
  data_caption_fields: [no, name]
  fields:
    - name: no
      no: 1
      type: types.Code
      db_name: no
      length: 20
      primary_key: true

    - name: customer_no
      no: 2
      type: types.Code
      db_name: customer_no
      length: 20
      table_relation:
        table: Customer
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250
          - source: city
            width: 250

    - name: name
      no: 3
      type: types.Text
      db_name: name
      length: 50

    - name: name_2
      no: 4
      type: types.Text
      db_name: name_2
      length: 50

    - name: address
      no: 5
      type: types.Text
      db_name: address
      length: 50

    - name: address_2
      no: 6
      type: types.Text
      db_name: address_2
      length: 50

    - name: post_code
      no: 7
      type: types.Code
      db_name: post_code
      length: 20
      table_relation:
        table: Post_Code
        field: code
        validate: false
        lookup_columns:
          - source: code
            width: 100
          - source: city
            width: 250

    - name: city
      no: 8
      type: types.Text
      db_name: city
      length: 30

    - name: state
      no: 9
      type: types.Text
      db_name: state
      length: 30

    - name: country_code
      no: 10
      type: types.Code
      db_name: country_code
      length: 10
      table_relation:
        table: Country_Region
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: language_code
      no: 11
      type: types.Code
      db_name: language_code
      length: 10
      table_relation:
        table: Language
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: currency_code
      no: 12
      type: types.Code
      db_name: currency_code
      length: 10
      table_relation:
        table: Currency
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: contact
      no: 13
      type: types.Text
      db_name: contact
      length: 50

    - name: your_reference
      no: 14
      type: types.Text
      db_name: your_reference
      length: 30

    - name: dimension_1_code
      no: 15
      type: types.Code
      db_name: dimension_1_code
      length: 10
      table_relation:
        table: Dimension_1
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: dimension_2_code
      no: 16
      type: types.Code
      db_name: dimension_2_code
      length: 10
      table_relation:
        table: Dimension_2
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: customer_posting_group
      no: 17
      type: types.Code
      db_name: customer_posting_group
      length: 10
      editable: false
      table_relation:
        table: Customer_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100

    - name: gen_bus_posting_group
      no: 18
      type: types.Code
      db_name: gen_bus_posting_group
      length: 10
      editable: false
      table_relation:
        table: Gen_Business_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: vat_registration_no
      no: 19
      type: types.Text
      db_name: vat_registration_no
      length: 20

    - name: reason_code
      no: 20
      type: types.Code
      db_name: reason_code
      length: 10
      table_relation:
        table: Reason_Code
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: posting_date
      no: 21
      type: types.Date
      db_name: posting_date

    - name: document_date
      no: 22
      type: types.Date
      db_name: document_date

    - name: due_date
      no: 23
      type: types.Date
      db_name: due_date

    - name: reminder_terms_code
      no: 24
      type: types.Code
      db_name: reminder_terms_code
      length: 10
      table_relation:
        table: Reminder_Terms
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: fin_charge_terms_code
      no: 25
      type: types.Code
      db_name: fin_charge_terms_code
      length: 10
      table_relation:
        table: Finance_Charge_Terms
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: post_interest
      no: 26
      type: bool
      db_name: post_interest

    - name: post_additional_fee
      no: 27
      type: bool
      db_name: post_additional_fee

    - name: reminder_level
      no: 28
      type: int
      db_name: reminder_level

    - name: posting_description
      no: 29
      type: types.Text
      db_name: posting_description
      length: 50

    - name: comment
      no: 30
      type: bool
      flow_field: true
      calc_formula: Exist
      source_table: ReminderCommentLine
      source_field: line_no
      flow_filters:
        - field: type
          type: const
          value: 0
        - field: no
          type: field
          value: no

    - name: remaining_amount
      no: 31
      type: types.Decimal
      flow_field: true
      decimal_places: "2:2"
      calc_formula: Sum
      source_table: ReminderLine
      source_field: remaining_amount
      flow_filters:
        - field: reminder_no
          type: field
          value: no

    - name: interest_amount
      no: 32
      type: types.Decimal
      flow_field: true
      decimal_places: "2:2"
      calc_formula: Sum
      source_table: ReminderLine
      source_field: amount
      flow_filters:
        - field: reminder_no
          type: field
          value: no
        - field: type
          type: const
          value: 2

    - name: additional_fee
      no: 33
      type: types.Decimal
      flow_field: true
      decimal_places: "2:2"
      calc_formula: Sum
      source_table: ReminderLine
      source_field: amount
      flow_filters:
        - field: reminder_no
          type: field
          value: no
        - field: type
          type: const
          value: 1

    - name: tax_amount
      no: 34
      type: types.Decimal
      flow_field: true
      decimal_places: "2:2"
      calc_formula: Sum
      source_table: ReminderLine
      source_field: tax_amount
      flow_filters:
        - field: reminder_no
          type: field
          value: no

    - name: no_series
      no: 37
      type: types.Code
      db_name: no_series
      length: 10
      editable: false
      table_relation:
        table: No_Series
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: issuing_no_series
      no: 38
      type: types.Code
      db_name: issuing_no_series
      length: 10
      table_relation:
        table: No_Series
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: issuing_no
      no: 39
      type: types.Code
      db_name: issuing_no
      length: 20

    - name: tax_area_code
      no: 41
      type: types.Code
      db_name: tax_area_code
      length: 20
      table_relation:
        table: Tax_Area
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: tax_liable
      no: 42
      type: bool
      db_name: tax_liable

    - name: tax_bus_posting_group
      no: 43
      type: types.Code
      db_name: tax_bus_posting_group
      length: 10
      table_relation:
        table: Tax_Business_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

  keys:
    - name: Primary
      fields: [no]
      clustered: true
    - name: customer_currency
      fields: [customer_no, currency_code]
