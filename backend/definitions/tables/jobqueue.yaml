table:
  id: 472
  name: "Job_Queue"
  fields:
    - name: no
      no: 1
      type: types.Code
      db_name: no
      primary_key: true
      length: 20
      required: true

    - name: description
      no: 2
      type: types.Text
      db_name: description
      length: 100

    - name: description_2
      no: 3
      type: types.Text
      db_name: description_2
      length: 100

    - name: status
      no: 4
      type: Option
      db_name: status
      options: ["On Hold", "Ready", "Error"]

    # What the job runs: a codeunit, or a report (printed: its PDF goes to the log and the
    # notification) — Object ID to Run is its number, Parameter a report's options and filters
    - name: object_type_to_run
      no: 16
      type: Option
      db_name: object_type_to_run
      options: ["Codeunit", "Report"]

    - name: object_id_to_run
      no: 5
      type: int
      db_name: object_id_to_run
      table_relation:
        conditions:
          - when: {field: object_type_to_run, equal: 0}
            table: Object
            field: id
            filters:
              type: {const: 5}
              runnable: {const: true}
            lookup_columns:
              - source: id
                width: 80
              - source: caption
                width: 250
                search: name
          - when: {field: object_type_to_run, equal: 1}
            table: Object
            field: id
            filters:
              type: {const: 3}
            lookup_columns:
              - source: id
                width: 80
              - source: caption
                width: 250
                search: name

    - name: parameter
      no: 6
      type: types.Text
      db_name: parameter
      length: 2000

    - name: next_start
      no: 7
      type: types.DateTime
      db_name: next_start

    - name: minutes_between_run
      no: 8
      type: int
      db_name: minutes_between_run

    - name: recurring_job
      no: 9
      type: bool
      db_name: recurring_job

    - name: recurrence
      no: 10
      type: Option
      db_name: recurrence
      options: ["Once", "Minutes", "Hourly", "Daily", "Weekly", "Monthly"]

    # One or more addresses separated by ";", checked by OnValidate
    - name: notification_email
      no: 11
      type: types.Text
      db_name: notification_email
      length: 250

    - name: notify_on
      no: 12
      type: Option
      db_name: notify_on
      options: ["Never", "Always", "On Error"]

    # Language of the notification e-mails; blank = the default language
    - name: notification_language
      no: 13
      type: types.Code
      db_name: notification_language
      length: 10
      table_relation:
        table: Language
        field: code
        lookup_columns:
          - source: code
            width: 80
          - source: name
            width: 200

    # FlowField - count of related Job Queue Entries
    - name: number_of_entries
      no: 14
      type: int
      flow_field: true
      calc_formula: Count
      source_table: Job_Queue_Entry
      source_field: entry_no
      flow_filters:
        - field: job_queue_no
          type: field
          value: no

    # The user the job runs as: who set it up (stamped when a user saves it); a scheduled run
    # checks this user's permission to run the codeunit or report
    - name: user_id
      no: 15
      type: types.Code
      db_name: user_id
      length: 50
      editable: false
      table_relation:
        table: User
        field: user_id
        validate: false   # a removed user stays on the entry; its run then fails
        lookup_columns:
          - source: user_id
            width: 120
          - source: user_name
            width: 200
