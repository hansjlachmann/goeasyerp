table:
  id: 206
  name: "Res_Journal_Template"
  description: "Resource journal templates (table 206): the journals with their page, source code and numbering"
  lookup_page_id: 271
  data_caption_fields: [name, description]
  fields:
    - name: name
      no: 1
      type: types.Code
      db_name: name
      length: 10
      primary_key: true
      required: true

    - name: description
      no: 2
      type: types.Text
      db_name: description
      length: 80

    # Reports (test, posting) come with the report prints
    - name: test_report_id
      no: 5
      type: int
      db_name: test_report_id

    # Form ID: the journal page of the template (Resource Journal 207)
    - name: page_id
      no: 6
      type: int
      db_name: page_id
      table_relation:
        table: Object
        field: id
        filters:
          type: {const: 2}
        validate: false   # set by setup; the Object rows are written at startup (a lookup only)
        lookup_columns:
          - source: id
            width: 80
          - source: name
            width: 250

    - name: posting_report_id
      no: 7
      type: int
      db_name: posting_report_id

    - name: force_posting_report
      no: 8
      type: bool
      db_name: force_posting_report

    - name: source_code
      no: 10
      type: types.Code
      db_name: source_code
      length: 10
      table_relation:
        table: Source_Code
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: reason_code
      no: 11
      type: types.Code
      db_name: reason_code
      length: 10
      table_relation:
        table: Reason_Code
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    # Recurring journals come later
    - name: recurring
      no: 12
      type: bool
      db_name: recurring

    - name: no_series
      no: 16
      type: types.Code
      db_name: no_series
      length: 10
      table_relation:
        table: No_Series
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: posting_no_series
      no: 17
      type: types.Code
      db_name: posting_no_series
      length: 10
      table_relation:
        table: No_Series
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

  keys:
    - name: Primary
      fields: [name]
      clustered: true
