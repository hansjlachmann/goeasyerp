# The main menu (Main Menu, classic forms 330–337 and the Fixed Assets menu): one module per
# entry, each with the classic menu of its form — the records, journals and documents, then
# reports, history, Setup and Activities. An entry opens a page (page_id) or runs a report or
# codeunit (run_object) or holds a sub-menu (items); entries whose object does not exist yet are
# shown greyed out ("not available yet") and become available when it is built. Captions:
# common.menu.<key> (i18n.Key of the name). Not in the classic menus: the ledger entry lists
# next to the registers, Create Year / Close Year, and the Administration module.
