page:
  id: 251
  type: List
  name: General Journal Batches
  source_table: Gen_Journal_Batch
  caption: General Journal Batches
  editable: true   # opened from a template (filtered on it); a new batch takes the template's settings (OnNewRecord)

  layout:
    repeater:
      fields:
        - source: journal_template_name
          width: 110
          visible: false

        - source: name
          width: 110

        - source: description
          width: 250

        - source: bal_account_type
          width: 130

        - source: bal_account_no
          width: 110

        - source: no_series
          width: 110

        - source: posting_no_series
          width: 110

        - source: reason_code
          width: 110


  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true

    # The batches: the template's test report on the batch (codeunit 228), every batch in the list
    # posted, or posted and the posting report printed (codeunits 233/234)
    - name: Posting
      caption: Posting
      image: Post
      promoted: true
      items:
        - name: Reconcile
          caption: Reconcile
          image: Calculate
          shortcut: Ctrl+F9
          run_page: 345
          run_page_params:
            journal_template_name: journal_template_name
            journal_batch_name: name
        - name: Test Report
          caption: Test Report
          image: Print
          run_object: table:Gen_Journal_Batch.TestReport
        - name: Post
          caption: Post
          image: Post
          shortcut: F11
          run_object: codeunit:233
        - name: Post and Print
          caption: Post and Print
          image: Print
          shortcut: Shift+F11
          run_object: codeunit:234
