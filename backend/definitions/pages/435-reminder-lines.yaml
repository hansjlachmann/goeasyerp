page:
  id: 435
  type: List
  name: Reminder Lines
  source_table: Reminder_Line   # the lines of the Reminder card (434), linked by its No.
  caption: Lines
  editable: true
  delayed_insert: true
  auto_split_key: true

  layout:
    repeater:
      fields:
        - source: reminder_no
          width: 100
          visible: false
        - source: line_no
          width: 90
          visible: false
        - source: type
          width: 150
        - source: entry_no
          width: 90
          visible: false
        - source: posting_date
          width: 100
          visible: false
        - source: document_date
          width: 100
          visible: false
        - source: due_date
          width: 100
        - source: document_type
          width: 120
        - source: document_no
          width: 120
        - source: "no"
          width: 110
          on_after_validate: table:Reminder_Line.InsertExtendedText(false)   # the automatic extended text
        - source: description
          width: 300
        - source: reminder_level
          width: 90
          visible: false
        - source: original_amount
          width: 120
        - source: remaining_amount
          width: 120
        - source: interest_rate
          width: 100
          visible: false
        - source: amount
          width: 120
        - source: tax_amount
          width: 110
          visible: false

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    # the line's extended text, always (codeunit 378)
    - name: Insert Ext. Texts
      caption: Insert Ext. Texts
      image: Document
      promoted: true
      run_object: table:Reminder_Line.InsertExtendedText(true)
