page:
  id: 155
  type: Card
  name: Customer Sales
  source_table: Customer
  caption: Customer Sales
  editable: false
  # classic form 155 with its lines (form 351): the customer's balance due (open entries by due date),
  # sales and profit per period

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
            editable: false
          - source: name
            editable: false
      - name: Periods
        caption: Periods
        period_grid:
          date_filter: date_filter
          drilldown_date_field: posting_date
          view_by: 2
          filters:
            - source: dimension_1_filter
              drilldown_filter_field: dimension_1_code
            - source: dimension_2_filter
              drilldown_filter_field: dimension_2_code
          columns:
            - source: balance_due_lcy
              drilldown: 25
              drilldown_filter_field: customer_no
              drilldown_filter_value: "no"
              drilldown_date_field: due_date
              drilldown_filters:
                - {field: open, const: "true"}
            - source: sales_lcy
              drilldown: 25
              drilldown_filter_field: customer_no
              drilldown_filter_value: "no"
            - source: profit_lcy
              drilldown: 25
              drilldown_filter_field: customer_no
              drilldown_filter_value: "no"
