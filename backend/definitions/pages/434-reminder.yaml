page:
  id: 434
  type: Card
  name: Reminder
  source_table: Reminder_Header
  caption: Reminder
  list_page_id: 436
  enable_navigation: true
  editable: true
  focus_field: "no"

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: no
            importance: Promoted
            assist_edit: "table:Reminder_Header.AssistEdit"
          - source: customer_no
            importance: Promoted
          - source: name
          - source: address
          - source: address_2
          - source: post_code
          - source: city
          - source: state
          - source: contact
          - source: your_reference
          - source: posting_date
          - source: document_date
          - source: reminder_level
          - source: reminder_terms_code
          - source: fin_charge_terms_code
          - source: due_date
          - source: posting_description

      # The lines: the customer entries with interest, the additional fee and the texts
      - name: Lines
        caption: Lines
        subpage:
          page_id: 435
          link:
            reminder_no: "no"

      - name: Posting
        caption: Posting
        fields:
          - source: currency_code
          - source: customer_posting_group
          - source: gen_bus_posting_group
          - source: department_code
          - source: project_code
          - source: tax_area_code
          - source: tax_liable
          - source: tax_bus_posting_group
          - source: post_interest
          - source: post_additional_fee
          - source: issuing_no_series
          - source: issuing_no
          - source: language_code
          - source: vat_registration_no
          - source: remaining_amount
            editable: false
          - source: interest_amount
            editable: false
          - source: additional_fee
            editable: false
          - source: tax_amount
            editable: false

  actions:
    - name: Back to List
      caption: Back to List
      image: Back
      shortcut: Esc
      promoted: true
      run_page: 436

    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    - name: Functions
      caption: Functions
      image: Calculate
      promoted: true
      items:
        - name: Suggest Reminder Lines
          caption: Suggest Reminder Lines
          run_object: report:189
        - name: Update Reminder Text
          caption: Update Reminder Text
          run_object: report:187

    - name: Issue
      caption: Issue
      image: Post
      shortcut: F9
      promoted: true
      run_object: report:190

    - name: Customer
      caption: Customer
      image: Customer
      shortcut: Shift+F5
      promoted: true
      run_page: 21
      run_page_filter_field: "no"
      run_page_filter_value: customer_no

    - name: Customer Ledger Entries
      caption: Customer Ledger Entries
      image: Entries
      shortcut: Ctrl+F7
      promoted: true
      run_page: 25
      run_page_filter_field: customer_no
      run_page_filter_value: customer_no

    - name: Comments
      caption: Comments
      image: Document
      promoted: true
      run_page: 442
      run_page_filters:
        - {field: type, const: "0"}
        - {field: "no", value: "no"}
