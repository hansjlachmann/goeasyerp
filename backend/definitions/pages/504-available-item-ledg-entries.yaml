page:
  id: 504
  type: List
  name: Available - Item Ledg. Entries
  source_table: Item_Ledger_Entry
  caption: Available - Item Ledg. Entries
  editable: false   # opened from the Reservation page for one line: the open inbound item ledger entries of the item at the location, up to its date

  layout:
    repeater:
      fields:
        - source: entry_type
          width: 120
        - source: document_no
          width: 120
        - source: location_code
          width: 120
        - source: posting_date
          width: 120
        - source: remaining_quantity
          width: 130
        - source: reserved_quantity
          width: 130
        - source: available_quantity
          calculated: true
          type: types.Decimal
          decimal_places: "0:5"
          width: 130
        - source: current_reserved_quantity
          calculated: true
          type: types.Decimal
          decimal_places: "0:5"
          width: 160

  actions:
    # The line the page is for reserves from the selected line / its reservations from it are canceled
    - name: Reserve
      caption: Reserve
      image: Approve
      promoted: true
      run_object: table:Item_Ledger_Entry.ReserveAvailable
    - name: Cancel Reservation
      caption: Cancel Reservation
      image: Cancel
      promoted: true
      run_object: table:Item_Ledger_Entry.CancelAvailableReservation
