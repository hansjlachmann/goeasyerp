page:
  id: 499
  type: List
  name: Available - Sales Lines
  source_table: Sales_Line
  caption: Available - Sales Lines
  editable: false   # opened from the Reservation page for one line: the sales lines of one document type that give the item back (credit memos, negative order lines), up to its date

  layout:
    repeater:
      fields:
        - source: document_type
          width: 120
        - source: document_no
          width: 120
        - source: location_code
          width: 120
        - source: shipment_date
          width: 120
        - source: outstanding_qty_base
          width: 130
        - source: reserved_qty_base
          width: 130
        - source: available_quantity
          calculated: true
          type: types.Decimal
          decimal_places: "0:5"
          width: 130
        - source: current_reserved_quantity
          calculated: true
          type: types.Decimal
          decimal_places: "0:5"
          width: 160

  actions:
    # The line the page is for reserves from the selected line / its reservations from it are canceled
    - name: Reserve
      caption: Reserve
      image: Approve
      promoted: true
      run_object: table:Sales_Line.ReserveAvailable
    - name: Cancel Reservation
      caption: Cancel Reservation
      image: Cancel
      promoted: true
      run_object: table:Sales_Line.CancelAvailableReservation
