page:
  id: 153
  type: Card
  name: Item Statistics
  source_table: Item   # opened from the Item Card and List (Item › Statistics) on one item
  caption: Item Statistics
  editable: false

  # classic form 153: the calculated fields are filled by the page's OnAfterGetRecord trigger
  # (business-logic/pages/itemstatistics.go); their captions are pages.item_statistics.fields.*.
  # Left out: Scheduled Receipt/Need (Qty.) of production orders, and the Drop Shipment Filter
  # of the order quantities (the order lines have no drop shipment).
  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
          - source: description
          - source: base_unit_of_measure
          - source: quantity_on_hand
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: qty_on_purch_order
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: qty_on_sales_order
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: qty_available
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"

      - name: This Period
        caption: This Period
        fields:
          - source: this_period_name
            calculated: true
            type: types.Text
