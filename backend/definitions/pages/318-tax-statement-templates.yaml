    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    # the template's statements (page 320)
    - name: Statement Names
      caption: Statement Names
      image: List
      promoted: true
      run_page: 320
      run_page_filter_field: statement_template_name
      run_page_filter_value: name
