page:
  id: 5411
  type: List
  name: Items by Bin
  source_table: Item
  caption: Items by Bin
  # classic form 5411: the items against the bins of the Location Filter — a matrix page whose
  # columns and cells come from its OnMatrixCalculate trigger (a cell: the item's quantity on
  # hand in the bin)

  layout:
    matrix:
      table: Item
      calculated: true
      no_periods: true   # the columns are the bins
      date_filter: date_filter
      view_by: 0
      filters:
        - source: location_filter
        - source: bin_filter
        - source: variant_filter
      fields:
        - source: "no"
          width: 90
        - source: description
          width: 240

  # the actions work on the selected row (its item)
  actions:
    - name: Item
      caption: Item
      image: Card
      promoted: true
      items:
        - name: Card
          caption: Card
          image: Card
          shortcut: Shift+F5
          run_page: 30
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Ledger Entries
          caption: Ledger Entries
          image: Entries
          shortcut: Ctrl+F5
          run_page: 38
          run_page_filter_field: item_no
          run_page_filter_value: "no"

    - name: Item Availability by
      caption: Item Availability by
      image: Calendar
      promoted: true
      items:
        - name: Period
          caption: Period
          image: Calendar
          run_page: 157
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Variant
          caption: Variant
          image: Calendar
          run_page: 5414
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Location
          caption: Location
          image: Calendar
          run_page: 492
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Bin
          caption: Bin
          image: Calendar
          run_page: 5412
          run_page_filter_field: "no"
          run_page_filter_value: "no"
