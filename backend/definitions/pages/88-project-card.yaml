        caption: Posting
        fields:
          - source: project_posting_group
          - source: recognition_method
          - source: application_method
          - source: project_usage_posting
          - source: completion_percent
          - source: project_posting_date
          - source: recognition_date
          - source: dimension_1_code
          - source: dimension_2_code
      - name: Duration
        caption: Duration
        fields:
