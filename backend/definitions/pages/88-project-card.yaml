    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    - name: Budget
      caption: Budget
      image: Calculate
      promoted: true
      run_page: 212
      run_page_params:
        project: "no"

    - name: Quantity Allocated
      caption: Quantity Allocated
      image: Calendar
      promoted: true
      run_page: 215
      run_page_filter_field: "no"
      run_page_filter_value: "no"

    - name: Budget Entries
      caption: Budget Entries
      image: Entries
      promoted: true
      run_page: 220
      run_page_filter_field: project_no
      run_page_filter_value: "no"

    - name: Comments
      caption: Comments
      image: Document
      promoted: true
      run_page: 124
      run_page_filters:
