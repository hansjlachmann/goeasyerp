page:
  id: 216
  type: List
  name: Project Budget Lines
  source_table: Project_Budget_Line
  caption: Project Budget (Phase/Task/Step)

  layout:
    repeater:
      fields:
        - source: project_no
          width: 110
        - source: phase_code
          width: 100
        - source: task_code
          width: 100
        - source: step_code
          width: 100
        - source: type
          width: 130
        - source: "no"
          width: 110
        - source: variant_code
          width: 100
          visible: false
        - source: description
          width: 220
        - source: starting_date
          width: 110
        - source: dimension_1_code
          width: 110
          visible: false
        - source: dimension_2_code
          width: 110
          visible: false
        - source: price_group_code
          width: 110
          visible: false
        - source: quantity
          width: 100
        - source: direct_unit_cost
          width: 120
          visible: false
        - source: unit_cost
          width: 110
        - source: total_cost
          width: 120
        - source: unit_price
          width: 110
        - source: total_price
          width: 120

  actions:

    - name: Budget Entries
      caption: Budget Entries
      image: Entries
      promoted: true
      run_page: 220
      run_page_filters:
        - {field: project_no, value: project_no}
        - {field: phase_code, value: phase_code}
        - {field: task_code, value: task_code}
        - {field: step_code, value: step_code}
        - {field: type, value: type}
        - {field: "no", value: "no"}
        - {field: variant_code, value: variant_code}
    # the line's resource or resource group: its budget against its capacity per period (pages 227, 231)
    - name: Resource Availability
      caption: Resource Availability
      image: Calendar
      promoted: true
      run_object: table:Project_Budget_Line.ResourceAvailability

    - name: Res. Gr. Availability
      caption: Res. Gr. Availability
      image: Calendar
      promoted: true
      run_object: table:Project_Budget_Line.ResGrAvailability

    # the line's budget entries and Starting Date moved by a date formula (form 366)
    - name: Change Budget Dates
      caption: Change Budget Dates
      image: Calendar
      promoted: true
      run_object: table:Project_Budget_Line.ChangeDates
