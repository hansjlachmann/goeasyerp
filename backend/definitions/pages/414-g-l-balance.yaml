page:
  id: 414
  type: List
  name: G/L Balance
  source_table: G_L_Account
  caption: G/L Balance
  # classic form 414: the G/L accounts' debit, credit and net change in one period (glbalance.go)

  layout:
    matrix:
      closing_entries: true   # Closing Entries Include/Exclude
      table: G_L_Account
      value: net_change
      calculated: true
      view_as: true
      date_filter: date_filter
      view_by: 2
      filters:
        - source: dimension_1_filter
          drilldown_filter_field: dimension_1_code
        - source: dimension_2_filter
          drilldown_filter_field: dimension_2_code
        - source: business_unit_filter
          drilldown_filter_field: business_unit_code
      drilldown: 20
      drilldown_row_field: gl_account_no
      drilldown_row_value: totaling   # a total account: the accounts it totals
      drilldown_date_field: posting_date
      fields:
        - source: "no"
          width: 90
          style_expr: {field: account_type, not_equal: 0, style: Strong}
        - source: name
          width: 260
          indent_field: indentation
          style_expr: {field: account_type, not_equal: 0, style: Strong}

  # the actions work on the selected row (its G/L account)
  actions:
    - name: Account
      caption: Account
      image: Card
      promoted: true
      items:
        - name: Card
          caption: Card
          image: Card
          run_page: 17
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Ledger Entries
          caption: Ledger Entries
          image: Entries
          run_page: 20
          run_page_filter_field: gl_account_no
          run_page_filter_value: "no"
        - name: Comments
          caption: Comments
          image: Document
          run_page: 124
          run_page_filters:
            - {field: table_name, const: "0"}   # G/L Account
            - {field: "no", value: "no"}
        - name: Extended Texts
          caption: Extended Texts
          image: Document
          run_page: 391
          run_page_filters:
            - {field: table_name, const: "1"}   # G/L Account
            - {field: "no", value: "no"}
        - name: Balance/Budget
          caption: Balance/Budget
          image: Statistics
          run_page: 154
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Balance by Dim. 1/2
          caption: Balance by Dim. 1/2
          image: Statistics
          run_page: 412
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Account Balance
          caption: Account Balance
          image: Statistics
          run_page: 415
          run_page_filter_field: "no"
          run_page_filter_value: "no"

    - name: Balance
      caption: Balance
      image: Statistics
      promoted: true
      items:
        - name: By Periods
          caption: By Periods
          image: Statistics
          run_page: 408
        - name: By Dimension 1
          caption: By Dimension 1
          image: Statistics
          run_page: 409
        - name: By Dimension 2
          caption: By Dimension 2
          image: Statistics
          run_page: 410
        - name: By Business Units
          caption: By Business Units
          image: Statistics
          run_page: 411
