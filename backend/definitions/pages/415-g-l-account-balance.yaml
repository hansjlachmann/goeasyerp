page:
  id: 415
  type: Card
  name: G/L Account Balance
  source_table: G_L_Account
  caption: G/L Account Balance
  editable: false
  # classic form 415 with its lines (form 416): one G/L account's net change per period. The debit
  # and credit columns are the account's debit and credit entries in the period (the classic
  # lines split the net change by its sign)

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
            editable: false
          - source: name
            editable: false
      - name: Periods
        caption: Periods
        period_grid:
          closing_entries: true   # Closing Entries Include/Exclude
          date_filter: date_filter
          drilldown_date_field: posting_date
          view_by: 2
          filters:
            - source: dimension_1_filter
              drilldown_filter_field: dimension_1_code
            - source: dimension_2_filter
              drilldown_filter_field: dimension_2_code
            - source: business_unit_filter
              drilldown_filter_field: business_unit_code
          columns:
            - source: debit_amount
              drilldown: 20
              drilldown_filter_field: gl_account_no
              drilldown_filter_value: "no"
            - source: credit_amount
              drilldown: 20
              drilldown_filter_field: gl_account_no
              drilldown_filter_value: "no"
            - source: net_change
              drilldown: 20
              drilldown_filter_field: gl_account_no
              drilldown_filter_value: "no"
