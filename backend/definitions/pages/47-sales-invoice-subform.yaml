page:
  id: 47
  type: List
  name: Sales Invoice Subform
  source_table: Sales_Line   # the lines of the Sales Invoice card (43), linked by Document Type and No.
  caption: Lines
  editable: true
  delayed_insert: true      # a line is inserted when the user leaves it
  auto_split_key: true      # a new line gets Line No. 10000, 20000 … or halfway between its neighbours

  layout:
    repeater:
      fields:
        - source: document_type
          width: 100
          visible: false
        - source: document_no
          width: 100
          visible: false
        - source: line_no
          width: 90
          visible: false
        - source: type
          width: 110
        - source: "no"
          width: 120
        - source: variant_code
          width: 100
          visible: false
        - source: description
          width: 260
        - source: location_code
          width: 100
          visible: false
        - source: quantity
          width: 100
          on_after_validate: table:Sales_Line.ReserveAlways
        - source: reserve
          width: 100
          visible: false
          on_after_validate: table:Sales_Line.ReserveAlways
        - source: reserved_quantity
          width: 120
          visible: false
        - source: unit_of_measure_code
          width: 110
          on_after_validate: table:Sales_Line.ReserveAlways
        - source: unit_price
          width: 120
        - source: line_discount_percent
          width: 110
        - source: line_discount_amount
          width: 130
          visible: false
        - source: amount
          width: 120
        - source: amount_including_tax
          width: 150
          visible: false
        - source: tax_group_code
          width: 110
        - source: allow_invoice_disc
          width: 120
          visible: false
        - source: inv_discount_amount
          width: 130
          visible: false
        - source: unit_cost_lcy
          width: 120
          visible: false
        - source: work_type_code
          width: 110
          visible: false
        - source: dimension_1_code
          width: 110
          visible: false
        - source: dimension_2_code
          width: 110
          visible: false
        - source: project_no
          width: 110
          visible: false
        - source: phase_code
          width: 100
          visible: false
        - source: task_code
          width: 100
          visible: false
        - source: step_code
          width: 100
          visible: false
        - source: appl_to_project_entry
          width: 110
          visible: false
        - source: project_applies_to_id
          width: 130
          visible: false
          on_lookup: "table:Sales_Line.SelectProjectEntry"
        - source: apply_and_close_project
          width: 110
          visible: false
        - source: serial_no
          width: 110
          visible: false
          on_lookup: table:Sales_Line.SelectItemEntry
        - source: lot_no
          width: 110
          visible: false
          on_lookup: table:Sales_Line.SelectItemEntry
        - source: bin_code
          width: 100
          visible: false

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    # Reservations of the line: the Reservation page (the sources it can reserve from) and its entries
    # the line's bill of materials as a line per component (codeunit 63)
    - name: Explode BOM
      caption: Explode BOM
      image: Lines
      promoted: true
      run_object: table:Sales_Line.ExplodeBOM
    - name: Reserve
      caption: Reserve
      image: Lines
      promoted: true
      run_object: table:Sales_Line.ShowReservation
    - name: Reservation Entries
      caption: Reservation Entries
      image: Entries
      promoted: true
      run_object: table:Sales_Line.ShowReservationEntries
