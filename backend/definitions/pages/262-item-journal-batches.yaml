page:
  id: 262
  type: List
  name: Item Journal Batches
  source_table: Item_Journal_Batch
  caption: Item Journal Batches
  editable: true   # opened from a template (filtered on it); a new batch takes the template's settings (OnNewRecord)

  layout:
    repeater:
      fields:
        - source: journal_template_name
          width: 110
          visible: false
        - source: name
          width: 110
        - source: description
          width: 250
        - source: no_series
          width: 110
        - source: posting_no_series
          width: 110
        - source: reason_code
          width: 110

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    # The batches: the template's test report on the batch (codeunit 228), every batch in the list
    # posted, or posted and the posting report printed (codeunits 243/244)
    - name: Posting
      caption: Posting
      image: Post
      promoted: true
      items:
        - name: Test Report
          caption: Test Report
          image: Print
          run_object: table:Item_Journal_Batch.TestReport
        - name: Post
          caption: Post
          image: Post
          shortcut: F11
          run_object: codeunit:243
        - name: Post and Print
          caption: Post and Print
          image: Print
          shortcut: Shift+F11
          run_object: codeunit:244
