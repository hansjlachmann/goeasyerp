page:
  id: 143
  type: List
  name: Posted Sales Invoices
  source_table: Sales_Invoice_Header
  caption: Posted Sales Invoices
  card_page_id: 132

  layout:
    repeater:
      fields:
        - source: "no"
          width: 120
        - source: sell_to_customer_no
          width: 130
        - source: sell_to_customer_name
          width: 250
        - source: posting_date
          width: 110
        - source: due_date
          width: 110
        - source: currency_code
          width: 90
        - source: amount
          width: 130
        - source: amount_including_tax
          width: 150
        - source: order_no
          width: 120
          visible: false
        - source: no_printed
          width: 100
          visible: false

  actions:
    - name: Print
      caption: Print
      image: Print
      promoted: true
      run_object: table:Sales_Invoice_Header.PrintRecords

    - name: Statistics
      caption: Statistics
      image: Statistics
      shortcut: F9
      promoted: true
      run_page: 397
      run_page_filter_field: "no"
      run_page_filter_value: "no"

    - name: Navigate
      caption: Navigate
      image: Navigate
      shortcut: Ctrl+Alt+Q
      promoted: true
      run_page: 344
      run_page_params:
        document_no: "no"
        posting_date: posting_date

    - name: Comments
      caption: Comments
      image: Document
      promoted: true
      run_page: 67
      run_page_filters:
        - field: document_type
          const: "6"
        - field: "no"
          value: "no"
