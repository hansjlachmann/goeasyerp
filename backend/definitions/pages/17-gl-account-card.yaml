page:
  id: 17
  type: Card
  name: G/L Account Card
  source_table: G_L_Account
  caption: G/L Account Card
  list_page_id: 16
  enable_navigation: true
  editable: true
  focus_field: "no"

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: no
            importance: Promoted
          - source: name
            importance: Promoted
          - source: income_balance
          - source: debit_credit
          - source: account_type
          - source: reconciliation_account
          - source: direct_posting
          - source: totaling
            table_relation: G_L_Account
          - source: no_of_blank_lines
          - source: new_page
          - source: search_name
          - source: balance
            style: Strong
          - source: blocked
          - source: last_date_modified
          - source: comment
          - source: automatic_ext_text

      - name: Posting
        caption: Posting
        fields:
          - source: dimension_1_code
            table_relation: Department
          - source: dimension_2_code
            table_relation: Project
          - source: gen_prod_posting_group
            table_relation: Gen_Product_Posting_Group
          - source: gen_bus_posting_group
            table_relation: Gen_Business_Posting_Group
          - source: gen_posting_type
          - source: dimension_1_posting
          - source: dimension_2_posting
          - source: tax_bus_posting_group
            table_relation: Tax_Business_Posting_Group
          - source: tax_prod_posting_group
            table_relation: Tax_Product_Posting_Group
          - source: tax_area_code
            table_relation: Tax_Area
          - source: tax_liable
          - source: tax_group_code
            table_relation: Tax_Group

      - name: Consolidation
        caption: Consolidation
        fields:
          - source: consol_credit_acc
          - source: consol_debit_acc
          - source: consol_currency_val_method

      - name: Reporting
        caption: Reporting
        fields:
          - source: exchange_rate_adjustment

  actions:
    - name: Back to List
      caption: Back to List
      image: Back
      shortcut: Esc
      promoted: true
      enabled: true
      run_page: 16

    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true

    - name: Ledger Entries
      caption: Ledger Entries
      image: Entries
      shortcut: Ctrl+F7
      promoted: true
      run_page: 20
      run_page_filter_field: gl_account_no
      run_page_filter_value: no

    - name: Balance/Budget
      caption: Balance/Budget
      image: Statistics
      promoted: true
      run_page: 154
      run_page_filter_field: "no"
      run_page_filter_value: "no"

    - name: Comments
      caption: Comments
      image: Document
      promoted: true
      run_page: 124
      run_page_filters:
        - {field: table_name, const: "0"}   # G/L Account
        - {field: "no", value: "no"}

    - name: Extended Texts
      caption: Extended Texts
      image: Document
      promoted: true
      run_page: 391
      run_page_filters:
        - {field: table_name, const: "1"}   # G/L Account
        - {field: "no", value: "no"}

    # The G/L accounts' balance by periods, dimensions and business units (classic Balance menu)
