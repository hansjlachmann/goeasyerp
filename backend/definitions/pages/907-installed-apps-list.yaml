page:
  id: 907
  type: List
  name: Installed Apps
  source_table: Installed_App
  caption: Installed Apps
  # The base application and the extension apps built into this installation, with the
  # number series each may use (application.yaml). Written at startup, read-only; an extension
  # app can be disabled and enabled again (SUPER only).

  layout:
    repeater:
      fields:
        - source: name
          width: 240

        - source: version
          width: 90

        - source: status
          width: 150

        - source: disabled
          width: 90

        - source: publisher
          width: 160

        - source: object_series
          width: 220

        - source: field_series
          width: 140

        - source: system_tables
          width: 200

        - source: app_id
          width: 290

        - source: source
          width: 280

        - source: source_ref
          width: 120

        - source: source_commit
          width: 330

        - source: source_path
          width: 140

        - source: contact
          width: 280

        - source: installed_at
          width: 170

        - source: updated_at
          width: 170

  actions:
    - name: Install App
      caption: Install App
      image: Import
      promoted: true
      run_object: table:Installed_App.InstallApp

    # an app package (.zip of the app's folder) instead of a repository: built by the
    # installation's own builder (App Build Setup: Allow Upload)
    - name: Upload App
      caption: Upload App
      image: Import
      promoted: true
      run_object: table:Installed_App.UploadApp

    - name: Uninstall App
      caption: Uninstall App
      image: Delete
      promoted: true
      run_object: table:Installed_App.UninstallApp

    - name: Cancel Pending
      caption: Cancel Pending
      image: Undo
      run_object: table:Installed_App.CancelPending

    # building the program with the planned apps: the installation's own builder (Build Apps,
    # App Builds) or a CI pipeline (Build List: apps.yaml) — App Build Setup chooses
    - name: Build
      caption: Build
      image: Run
      promoted: true
      items:
        - name: Build Apps
          caption: Build Apps
          image: Run
          run_object: table:Installed_App.BuildApps

        - name: App Builds
          caption: App Builds
          image: History
          run_page: 912

        # the app audit's latest report of the app's source (S55)
        - name: Audit Report
          caption: Audit Report
          image: Document
          run_object: table:Installed_App.ShowAuditReport

        # findings of the app audit a SUPER user approved for one app's exact source (S55)
        - name: App Audit Exceptions
          caption: App Audit Exceptions
          image: Approve
          run_page: 917

        - name: Build List
          caption: Build List
          image: Export
          run_object: table:Installed_App.BuildList

        - name: App Build Setup
          caption: App Build Setup
          image: Setup
          run_page: 913

    - name: Enable App
      caption: Enable App
      image: Approve
      promoted: true
      run_object: table:Installed_App.EnableApp

    - name: Disable App
      caption: Disable App
      image: Cancel
      promoted: true
      run_object: table:Installed_App.DisableApp
