page:
  id: 5654
  type: List
  name: Insurance Journal
  source_table: Insurance_Journal_Line
  caption: Insurance Journal
  editable: true
  auto_split_key: true
  delayed_insert: true
  # classic form 5654: a fixed asset's coverage by an insurance policy; Post (F11, codeunit 5654)
  # writes insurance coverage ledger entries and an insurance register

  # The batch the journal shows; OnOpenPage (business-logic/pages/insurancejournal.go) turns
  # template and batch into the list's filters
  header_fields:
    - param: batch
      source: journal_batch_name
      lookup_page: 5655
      lookup_field: name
      lookup_filters:
        journal_template_name: journal_template_name

  # Under the list for the cursor row (OnAfterGetRecord: codeunit 5656 GetDescriptions)
  footer:
    - source: insurance_description
      calculated: true
      type: types.Text
    - source: fa_description_footer
      calculated: true
      type: types.Text

  layout:
    repeater:
      fields:
        - source: posting_date
          width: 100
        - source: document_type
          width: 110
          visible: false
        - source: document_date
          width: 100
          visible: false
        - source: document_no
          width: 110
        - source: external_document_no
          width: 120
          visible: false
        - source: insurance_no
          width: 110
        - source: fa_no
          width: 110
        - source: fa_description
          width: 200
        - source: description
          width: 250
        - source: amount
          width: 120
        - source: dimension_1_code
          width: 110
          visible: false
        - source: dimension_2_code
          width: 110
          visible: false
        - source: index_entry
          width: 80
          visible: false
        - source: reason_code
          width: 110
          visible: false
        - source: source_code
          width: 110
          visible: false

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    - name: Insurance
      caption: Insurance
      image: Card
      promoted: true
      items:
        - name: Card
          caption: Card
          shortcut: Shift+F5
          run_page: 5644
          run_page_filter_field: "no"
          run_page_filter_value: insurance_no
        - name: Coverage Ledger Entries
          caption: Coverage Ledger Entries
          shortcut: Ctrl+F5
          run_page: 5647
          run_page_filter_field: insurance_no
          run_page_filter_value: insurance_no

    - name: Posting
      caption: Posting
      image: Post
      promoted: true
      items:
        # The batch (codeunit 5654 Insurance Jnl.-Post, after asking)
        - name: Post
          caption: Post
          image: Post
          shortcut: F11
          run_object: codeunit:5654
        # what Post would write for the batch, nothing saved (Posting Preview 115)
        - name: Preview Posting
          caption: Preview Posting
          image: Search
          shortcut: Ctrl+Alt+F9
          run_object: "table:Insurance_Journal_Line.PreviewPosting"