page:
  id: 503
  type: List
  name: Available - BOM Jnl. Lines
  source_table: BOM_Journal_Line
  caption: Available - BOM Jnl. Lines
  editable: false   # opened from the Reservation page for one line: the BOM journal lines that assemble the item, up to its date

  layout:
    repeater:
      fields:
        - source: document_no
          width: 120
        - source: location_code
          width: 120
        - source: posting_date
          width: 120
        - source: quantity_base
          width: 130
        - source: reserved_qty_base
          width: 130
        - source: available_quantity
          calculated: true
          type: types.Decimal
          decimal_places: "0:5"
          width: 130
        - source: current_reserved_quantity
          calculated: true
          type: types.Decimal
          decimal_places: "0:5"
          width: 160

  actions:
    # The line the page is for reserves from the selected line / its reservations from it are canceled
    - name: Reserve
      caption: Reserve
      image: Approve
      promoted: true
      run_object: table:BOM_Journal_Line.ReserveAvailable
    - name: Cancel Reservation
      caption: Cancel Reservation
      image: Cancel
      promoted: true
      run_object: table:BOM_Journal_Line.CancelAvailableReservation

    - name: Show Entire Batch
      caption: Show Entire Batch
      image: Document
      promoted: true
      run_object: table:BOM_Journal_Line.ShowEntireBatch
