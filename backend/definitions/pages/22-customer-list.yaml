  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    - name: Customer
      caption: Customer
      image: Customer
      promoted: true
      items:
        - name: Ledger Entries
          caption: Ledger Entries
          image: Entries
          run_page: 25
          run_page_filter_field: customer_no
          run_page_filter_value: "no"
        - name: Comments
          caption: Comments
          image: Document
          run_page: 124
          run_page_filters:
            - {field: table_name, const: "1"}   # Customer
            - {field: "no", value: "no"}
        - name: Bank Accounts
          caption: Bank Accounts
          image: Card
          run_page: 424
          run_page_filter_field: customer_no
          run_page_filter_value: "no"
        - name: Ship-to Addresses
          caption: Ship-to Addresses
          image: Navigate
          run_page: 301
          run_page_filter_field: customer_no
          run_page_filter_value: "no"
        - name: Statistics
          caption: Statistics
          image: Statistics
          shortcut: F7
          run_page: 151
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Statistics by Currencies
          caption: Statistics by Currencies
          image: Statistics
          run_page: 481
          run_page_params:
            customer_no: "no"
        - name: Entry Statistics
          caption: Entry Statistics
          image: Statistics
          run_page: 302
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Customer Sales
          caption: Customer Sales
          image: Calendar
          run_page: 155
          run_page_filter_field: "no"
          run_page_filter_value: "no"

    - name: Sales
      caption: Sales
      image: Document
      promoted: true
      items:
        - name: Invoice Discounts
          caption: Invoice Discounts
          image: Calculate
          run_page: 23
          run_page_filter_field: code
          run_page_filter_value: invoice_disc_code
        - name: Cust./Item Discounts
          caption: Cust./Item Discounts
          image: Calculate
          run_page: 24
          run_page_filter_field: customer_disc_group
          run_page_filter_value: cust_item_disc_gr
        - name: Quotes
          caption: Quotes
          image: Document
          run_page: 9300
          run_page_filter_field: sell_to_customer_no
          run_page_filter_value: "no"
        - name: Blanket Orders
          caption: Blanket Orders
          image: Document
          run_page: 9303
          run_page_filter_field: sell_to_customer_no
          run_page_filter_value: "no"
        - name: Orders
          caption: Orders
          image: Document
          run_page: 9305
          run_page_filter_field: sell_to_customer_no
          run_page_filter_value: "no"
