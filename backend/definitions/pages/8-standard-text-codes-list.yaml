page:
  id: 8
  type: List
  name: Standard Text Codes
  source_table: Standard_Text
  caption: Standard Text Codes
  editable: true
  copy_paste_allowed: true   # Ctrl+C / Ctrl+V copy and paste selected records

  layout:
    repeater:
      fields:
        - source: code
          width: 120

        - source: description
          width: 360

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true

    - name: Extended Texts
      caption: Extended Texts
      image: Document
      promoted: true
      run_page: 391
      run_page_filters:
        - {field: table_name, const: "0"}   # Standard Text
        - {field: "no", value: "code"}
