page:
  id: 290
  type: List
  name: Recurring Resource Jnl.
  source_table: Res_Journal_Line
  caption: Recurring Resource Journal
  editable: true
  auto_split_key: true      # a new line gets Line No. 10000, 20000 … or halfway between its neighbours
  delayed_insert: true      # inserted when the user leaves the line
  # classic form 290: the lines of a recurring resource template — posted they stay, dated ahead

  # The batch the journal shows (classic Batch Name above the lines): the page's batch
  # parameter; OnOpenPage (business-logic/pages/resjournal.go) turns template and batch into
  # the list's filters
  header_fields:
    - param: batch
      source: journal_batch_name
      lookup_page: 272
      lookup_field: name
      lookup_filters:
        journal_template_name: journal_template_name

  # Under the list for the cursor row (OnAfterGetRecord, business-logic/pages/resjournal.go)
  footer:
    - source: resource_name
      calculated: true
      type: types.Text

  layout:
    repeater:
      fields:
        - source: recurring_method
          width: 110
        - source: recurring_frequency
          width: 90
        - source: posting_date
          width: 100
        - source: document_date
          width: 100
          visible: false
        - source: entry_type
          width: 100
        - source: document_no
          width: 110
        - source: resource_no
          width: 110
        - source: description
          width: 250
        - source: work_type_code
          width: 110
        - source: department_code
          width: 110
          visible: false
        - source: project_code
          width: 110
          visible: false
        - source: gen_bus_posting_group
          width: 140
          visible: false
        - source: gen_prod_posting_group
          width: 140
          visible: false
        - source: unit_of_measure_code
          width: 110
        - source: quantity
          width: 100
        - source: direct_unit_cost
          width: 120
          visible: false
        - source: unit_cost
          width: 120
        - source: total_cost
          width: 120
        - source: unit_price
          width: 120
        - source: total_price
          width: 120
        - source: chargeable
          width: 90
        - source: external_document_no
          width: 130
          visible: false
        - source: reason_code
          width: 110
          visible: false
        - source: expiration_date
          width: 100

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    # The line's resource: its card and its ledger entries
    - name: Resource
      caption: Resource
      image: Card
      promoted: true
      items:
        - name: Card
          caption: Card
          shortcut: Shift+F5
          run_page: 76
          run_page_filter_field: "no"
          run_page_filter_value: resource_no
        - name: Ledger Entries
          caption: Ledger Entries
          shortcut: Ctrl+F5
          run_page: 202
          run_page_filter_field: resource_no
          run_page_filter_value: resource_no

    # Posting: the batch (codeunit 271 Res. Jnl.-Post, after asking; the list's filters say which batch)
    - name: Post
      caption: Post
      image: Post
      shortcut: F11
      promoted: true
      run_object: codeunit:271

    # what Post would write for the batch, nothing saved (Posting Preview 115)
    - name: Preview Posting
      caption: Preview Posting
      image: Search
      shortcut: Ctrl+Alt+F9
      promoted: true
      run_object: "table:Res_Journal_Line.PreviewPosting"
