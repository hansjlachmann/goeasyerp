page:
  id: 344
  type: List
  name: Navigate
  source_table: Document_Entry
  caption: Navigate
  editable: false
  source_table_temporary: true   # the lines are found again on every load (OnFindRecords)

  # The document to find: filters on Document No. and Posting Date (blank: any), or the
  # external document no. and business contact
  header_fields:
    - param: document_no
      source: document_no
    - param: posting_date
      source: posting_date
    # or by an external document no. (Document No. and Posting Date blank): the vendor's or
    # customer's ledger entries with it give the documents
    - param: ext_document_no
      source: ext_document_no
    - param: contact_type
      source: contact_type
      options:
        - {value: "0", caption: "Vendor"}
        - {value: "1", caption: "Customer"}
    - param: contact_no
      source: contact_no

  layout:
    repeater:
      fields:
        - source: table_id
          width: 90

        - source: table_name
          width: 300

        - source: no_of_records
          width: 130
          drilldown_page_field: page_id
          drilldown_filters:
            - field: document_no
              value: document_no_filter
              optional: true
            - field: "no"
              value: no_filter
              optional: true
            - field: posting_date
              value: posting_date_filter
              optional: true

  actions:
    - name: Find
      caption: Find
      image: Search
      promoted: true
      apply_header_fields: true   # searches again with the header fields as typed
    - name: Show
      caption: Show
      image: Entries
      promoted: true
      run_page_field: page_id
      run_page_filters:
        - field: document_no
          value: document_no_filter
          optional: true
        - field: "no"
          value: no_filter
          optional: true
        - field: posting_date
          value: posting_date_filter
          optional: true

    # the tables found and their entries (report 35 Document Entries)
    - name: Print
      caption: Print
      image: Print
      promoted: true
      run_object: report:35
