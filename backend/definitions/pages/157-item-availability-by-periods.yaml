page:
  id: 157
  type: Card
  name: Item Availability by Periods
  source_table: Item
  caption: Item Availability by Periods
  editable: false
  # classic form 157 with its lines (form 353): the item's inventory per period. The order,
  # scheduled receipt and planned order columns come with the documents and production

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
            editable: false
          - source: description
            editable: false
      - name: Periods
        caption: Periods
        period_grid:
          date_filter: date_filter
          drilldown_date_field: posting_date
          view_by: 0
          filters:
            - source: location_filter
              drilldown_filter_field: location_code   # the ledger field a drilldown filters
            - source: variant_filter
              drilldown_filter_field: variant_code
            - source: bin_filter
              drilldown_filter_field: bin_code
          columns:
            - source: net_change
              drilldown: 38
              drilldown_filter_field: item_no
              drilldown_filter_value: "no"

  actions:
    # The item's availability by the other views (classic Item › Item Availability by)
    - name: Item
      caption: Item
      image: Card
      promoted: true
      items:
        - name: Item Availability by
          caption: Item Availability by
          image: Calendar
          items:
            - name: Period
              caption: Period
              run_page: 157
              run_page_filter_field: "no"
              run_page_filter_value: "no"
            - name: Variant
              caption: Variant
              run_page: 5414
              run_page_filter_field: "no"
              run_page_filter_value: "no"
            - name: Location
              caption: Location
              run_page: 492
              run_page_filter_field: "no"
              run_page_filter_value: "no"
            - name: Bin
              caption: Bin
              run_page: 5412
              run_page_filter_field: "no"
              run_page_filter_value: "no"
