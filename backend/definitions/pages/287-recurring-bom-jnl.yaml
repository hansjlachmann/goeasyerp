page:
  id: 287
  type: List
  name: Recurring BOM Jnl.
  source_table: BOM_Journal_Line
  caption: Recurring BOM Journal
  editable: true
  auto_split_key: true      # a new line gets Line No. 10000, 20000 … or halfway between its neighbours
  delayed_insert: true      # inserted when the user leaves the line
  # classic form 287: the assemblies of a recurring BOM template — posted they stay, dated ahead

  # The batch the journal shows (classic Batch Name above the lines): the page's batch
  # parameter; OnOpenPage (business-logic/pages/bomjournal.go) turns template and batch into
  # the list's filters
  header_fields:
    - param: batch
      source: journal_batch_name
      lookup_page: 265
      lookup_field: name
      lookup_filters:
        journal_template_name: journal_template_name

  # Under the list for the cursor row (OnAfterGetRecord, business-logic/pages/bomjournal.go)
  footer:
    - source: item_description
      calculated: true
      type: types.Text

  layout:
    repeater:
      fields:
        - source: recurring_method
          width: 110
        - source: recurring_frequency
          width: 90
        - source: posting_date
          width: 100
        - source: document_date
          width: 100
          visible: false
        - source: document_no
          width: 110
        - source: item_no
          width: 110
        - source: variant_code
          width: 100
          visible: false
        - source: description
          width: 250
        - source: dimension_1_code
          width: 110
          visible: false
        - source: dimension_2_code
          width: 110
          visible: false
        - source: location_code
          width: 100
        - source: quantity
          width: 100
          on_after_validate: table:BOM_Journal_Line.ReserveAlways
        - source: reserve
          width: 100
          visible: false
          on_after_validate: table:BOM_Journal_Line.ReserveAlways
        - source: reserved_quantity
          on_drilldown: table:BOM_Journal_Line.ShowReservationEntries
          width: 120
          visible: false
        - source: unit_of_measure_code
          width: 110
          on_after_validate: table:BOM_Journal_Line.ReserveAlways
        - source: unit_cost
          width: 120
        - source: total_cost
          width: 120
        - source: reason_code
          width: 110
          visible: false
        - source: expiration_date
          width: 100
        - source: lot_no
          width: 110
          visible: false
        - source: bin_code
          width: 100
          visible: false

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    # The line's item: its card, ledger entries and bill of materials
    - name: Item
      caption: Item
      image: Card
      promoted: true
      items:
        - name: Card
          caption: Card
          shortcut: Shift+F5
          run_page: 30
          run_page_filter_field: "no"
          run_page_filter_value: item_no
        - name: Ledger Entries
          caption: Ledger Entries
          shortcut: Ctrl+F5
          run_page: 38
          run_page_filter_field: item_no
          run_page_filter_value: item_no
        - name: Bill of Materials
          caption: Bill of Materials
          run_page: 36
          run_page_filter_field: parent_item_no
          run_page_filter_value: item_no
        # the item at the line's place up to its date (classic Item Availability by): a pick changes
        # the line's date, variant, location or bin after a question
        - name: Item Availability by
          caption: Item Availability by
          image: Calendar
          items:
            - name: Period
              caption: Period
              run_object: table:BOM_Journal_Line.ItemAvailability(0)
            - name: Variant
              caption: Variant
              run_object: table:BOM_Journal_Line.ItemAvailability(1)
            - name: Location
              caption: Location
              run_object: table:BOM_Journal_Line.ItemAvailability(2)
            - name: Bin
              caption: Bin
              run_object: table:BOM_Journal_Line.ItemAvailability(3)
        - name: Reservation Entries
          caption: Reservation Entries
          image: Entries
          run_object: table:BOM_Journal_Line.ShowReservationEntries

    - name: Posting
      caption: Posting
      image: Post
      promoted: true
      items:
        # what posting the batch would refuse, per line (report 802 BOM Journal - Test)
        - name: Test Report
          caption: Test Report
          image: Print
          run_object: report:802
        # Posting: the batch (codeunit 251 BOM Jnl.-Post, after asking; the list's filters say which batch)
        - name: Post
          caption: Post
          image: Post
          shortcut: F11
          run_object: codeunit:251
        # Post, then the template's posting report on the register (codeunit 252 BOM Jnl.-Post+Print)
        - name: Post and Print
          caption: Post and Print
          image: Print
          shortcut: Shift+F11
          run_object: codeunit:252
        # what Post would write for the batch, nothing saved (Posting Preview 115)
        - name: Preview Posting
          caption: Preview Posting
          image: Search
          shortcut: Ctrl+Alt+F9
          run_object: "table:BOM_Journal_Line.PreviewPosting"

    # Reservations of the line: the Reservation page (the sources it can reserve from) and its entries
    - name: Reserve
      caption: Reserve
      image: Lines
      run_object: table:BOM_Journal_Line.ShowReservation
      promoted: true