page:
  id: 497
  type: List
  name: Reservation Entries
  source_table: Reservation_Entry
  caption: Reservation Entries
  editable: false   # entries are made by the reservation functions; opened from a line: its open entries

  layout:
    repeater:
      fields:
        - source: reservation_status
          width: 130
        - source: item_no
          width: 100
        - source: variant_code
          width: 90
          visible: false
        - source: location_code
          width: 100
        - source: valid_to_date
          width: 110
        - source: expected_receipt_date
          width: 110
        - source: shipment_date
          width: 110
        - source: quantity
          width: 110
        - source: reserved_for
          calculated: true
          type: types.Text
          width: 260
        - source: reserved_from
          calculated: true
          type: types.Text
          width: 260
        - source: description
          width: 200
          visible: false
        - source: for_type
          width: 130
          visible: false
        - source: for_subtype
          width: 90
          visible: false
        - source: for_id
          width: 110
          visible: false
        - source: for_batch_name
          width: 110
          visible: false
        - source: for_ref_no
          width: 90
          visible: false
        - source: from_type
          width: 130
          visible: false
        - source: from_subtype
          width: 90
          visible: false
        - source: from_id
          width: 110
          visible: false
        - source: from_batch_name
          width: 110
          visible: false
        - source: from_ref_no
          width: 90
          visible: false
        - source: entry_no
          width: 90
        - source: creation_date
          width: 110
          visible: false
        - source: transferred_from_entry_no
          width: 110
          visible: false
        - source: serial_no
          width: 110
          visible: false
        - source: lot_no
          width: 110
          visible: false
        - source: bin_code
          width: 100
          visible: false

  actions:
    # Cancel the selected open entries, each after a question (the classic Cancel Reservation)
    - name: Cancel Reservation
      caption: Cancel Reservation
      image: Cancel
      promoted: true
      run_object: table:Reservation_Entry.CancelReservation

    # The line an entry is reserved for / from, on its line list (classic LookupReservedFor /
    # LookupReservedFrom), and the closed entries shown or hidden
    - name: Entry
      caption: Entry
      image: Entries
      promoted: true
      items:
        - name: Reserved For
          caption: Reserved For
          image: Lines
          run_object: table:Reservation_Entry.LookupReservedFor
        - name: Reserved From
          caption: Reserved From
          image: Lines
          run_object: table:Reservation_Entry.LookupReservedFrom

    - name: Functions
      caption: Functions
      image: Calculate
      promoted: true
      items:
        - name: Show History
          caption: Show History
          image: History
          run_object: table:Reservation_Entry.ShowHistory
        - name: Hide History
          caption: Hide History
          image: History
          run_object: table:Reservation_Entry.HideHistory
