page:
  id: 113
  type: Card
  name: G/L Budget by Periods
  source_table: G_L_Budget_Name
  caption: G/L Budget by Periods
  list_page_id: 121
  enable_navigation: true
  editable: true
  # classic form 113: the G/L accounts' Budgeted Amount per period in a matrix — here on the
  # budget's card (classic: the Budget Filter of the form); a value typed into a cell enters a
  # budget entry with the difference (OnMatrixValidate → SetGLAccBudgetedAmount)

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: name
            importance: Promoted
          - source: description

      - name: Budget
        caption: Budget
        matrix:
          # the actions of the selected row (its G/L account)
          actions:
            - name: Account
              caption: Account
              image: Card
              promoted: true
              items:
                - name: Card
                  caption: Card
                  image: Card
                  run_page: 17
                  run_page_filter_field: "no"
                  run_page_filter_value: "no"
                - name: Ledger Entries
                  caption: Ledger Entries
                  image: Entries
                  run_page: 20
                  run_page_filter_field: gl_account_no
                  run_page_filter_value: "no"
                - name: Comments
                  caption: Comments
                  image: Document
                  run_page: 124
                  run_page_filters:
                    - {field: table_name, const: "0"}   # G/L Account
                    - {field: "no", value: "no"}
                - name: Extended Texts
                  caption: Extended Texts
                  image: Document
                  run_page: 391
                  run_page_filters:
                    - {field: table_name, const: "1"}   # G/L Account
                    - {field: "no", value: "no"}
                - name: Budget by Dim. 1/2
                  caption: Budget by Dim. 1/2
                  image: Statistics
                  run_page: 420
                  run_page_filter_field: "no"
                  run_page_filter_value: "no"
                - name: Balance/Budget
                  caption: Balance/Budget
                  image: Statistics
                  run_page: 154
                  run_page_filter_field: "no"
                  run_page_filter_value: "no"
          table: G_L_Account
          value: budgeted_amount
          entry_table: G_L_Budget_Entry
          date_filter: date_filter
          record_filters:
            budget_filter: name
          view_by: 2
          editable: true
          filters:
            - source: dimension_1_filter
              drilldown_filter_field: dimension_1_code
            - source: dimension_2_filter
              drilldown_filter_field: dimension_2_code
          fields:
            - source: "no"
              width: 90
              style_expr: {field: account_type, not_equal: 0, style: Strong}
            - source: name
              width: 260
              indent_field: indentation
              style_expr: {field: account_type, not_equal: 0, style: Strong}
          drilldown: 120
          drilldown_row_field: gl_account_no
          drilldown_row_value: totaling   # a total account: the accounts it totals
          drilldown_date_field: date
          drilldown_record_filters:
            budget_name: name

  actions:
    - name: Back to List
      caption: Back to List
      image: Back
      shortcut: Esc
      promoted: true
      run_page: 121

    - name: Entries
      caption: Entries
      image: Entries
      shortcut: Ctrl+F7
      promoted: true
      run_page: 120
      run_page_filter_field: budget_name
      run_page_filter_value: name

    # The budget functions (classic Functions menu): an amount spread over periods, a budget from
    # history, the budget as a file and back (reports 81/82/83), and Copy Budget (report 96)
    - name: Functions
      caption: Functions
      image: Calculate
      promoted: true
      items:
        - name: Amount by Period
          caption: Amount by Period
          image: Calculate
          run_object: report:81
        - name: From History
          caption: From History
          image: History
          run_object: report:82
        - name: Import or Export Budget
          caption: Import or Export Budget
          image: Import
          run_object: report:83
        - name: Copy Budget
          caption: Copy Budget
          image: Copy
          run_object: report:96

    - name: Trial Balance/Budget
      caption: Trial Balance/Budget
      image: Print
      promoted: true
      run_object: report:9

    # the budget views of all accounts (classic Budget menu)
    - name: Budget
      caption: Budget
      image: Statistics
      promoted: true
      items:
        - name: By Dimension 1
          caption: By Dimension 1
          image: Statistics
          run_page: 417
        - name: By Dimension 2
          caption: By Dimension 2
          image: Statistics
          run_page: 418
        - name: By Business Units
          caption: By Business Units
          image: Statistics
          run_page: 419
        - name: G/L Balance/Budget
          caption: G/L Balance/Budget
          image: Statistics
          run_page: 422
