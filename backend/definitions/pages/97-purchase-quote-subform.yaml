page:
  id: 97
  type: List
  name: Purchase Quote Subform
  source_table: Purchase_Line   # the lines of the Purchase Quote card (49), linked by Document Type and No.
  caption: Lines
  editable: true
  delayed_insert: true      # a line is inserted when the user leaves it
  auto_split_key: true      # a new line gets Line No. 10000, 20000 … or halfway between its neighbours

  layout:
    repeater:
      fields:
        - source: document_type
          width: 100
          visible: false
        - source: document_no
          width: 100
          visible: false
        - source: line_no
          width: 90
          visible: false
        - source: type
          width: 110
        - source: "no"
          width: 120
          on_after_validate: table:Purchase_Line.InsertExtendedText(false)   # the automatic extended text
        - source: variant_code
          width: 100
          visible: false
        - source: description
          width: 260
        - source: vendor_item_no
          width: 130
          visible: false
        - source: location_code
          width: 100
          visible: false
        - source: quantity
          width: 100
          on_after_validate: table:Purchase_Line.ReserveAlways
        - source: reserve
          width: 100
          visible: false
          on_after_validate: table:Purchase_Line.ReserveAlways
        - source: reserved_quantity
          width: 120
          visible: false
        - source: unit_of_measure_code
          width: 110
          on_after_validate: table:Purchase_Line.ReserveAlways
        - source: direct_unit_cost
          width: 120
        - source: line_discount_percent
          width: 110
        - source: line_discount_amount
          width: 130
          visible: false
        - source: amount
          width: 120
        - source: amount_including_tax
          width: 150
          visible: false
        - source: tax_group_code
          width: 110
        - source: use_tax
          width: 90
          visible: false
        - source: expected_receipt_date
          width: 130
          visible: false
        - source: allow_invoice_disc
          width: 120
          visible: false
        - source: inv_discount_amount
          width: 130
          visible: false
        - source: indirect_cost_percent
          width: 120
          visible: false
        - source: unit_cost_lcy
          width: 120
          visible: false
        - source: unit_price_lcy
          width: 120
          visible: false
        - source: dimension_1_code
          width: 110
          visible: false
        - source: dimension_2_code
          width: 110
          visible: false
        - source: fa_posting_type
          width: 130
          visible: false
        - source: depreciation_book_code
          width: 110
          visible: false
        - source: maintenance_code
          width: 110
          visible: false
        - source: serial_no
          width: 110
          visible: false
          on_lookup: table:Purchase_Line.SelectItemEntry
        - source: lot_no
          width: 110
          visible: false
          on_lookup: table:Purchase_Line.SelectItemEntry
        - source: bin_code
          width: 100
          visible: false

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    # Reservations of the line: the Reservation page (the sources it can reserve from) and its entries
    # the line's extended text, always (codeunit 378)
    - name: Insert Ext. Texts
      caption: Insert Ext. Texts
      image: Document
      promoted: true
      run_object: table:Purchase_Line.InsertExtendedText(true)
    # the line's bill of materials as a line per component (codeunit 73)
    - name: Explode BOM
      caption: Explode BOM
      image: Lines
      promoted: true
      run_object: table:Purchase_Line.ExplodeBOM
    - name: Reserve
      caption: Reserve
      image: Lines
      promoted: true
      run_object: table:Purchase_Line.ShowReservation
    # The line's item (classic Line menu): its availability and its reservation entries
    - name: Line
      caption: Line
      image: Lines
      promoted: true
      items:
        # the item at the line's place up to its date (classic Item Availability by): a pick changes
        # the line's date, variant, location or bin after a question
        - name: Item Availability by
          caption: Item Availability by
          image: Calendar
          items:
            - name: Period
              caption: Period
              run_object: table:Purchase_Line.ItemAvailability(0)
            - name: Variant
              caption: Variant
              run_object: table:Purchase_Line.ItemAvailability(1)
            - name: Location
              caption: Location
              run_object: table:Purchase_Line.ItemAvailability(2)
            - name: Bin
              caption: Bin
              run_object: table:Purchase_Line.ItemAvailability(3)
        - name: Reservation Entries
          caption: Reservation Entries
          image: Entries
          run_object: table:Purchase_Line.ShowReservationEntries
