page:
  id: 18
  type: List
  name: G/L Account List
  source_table: G_L_Account
  caption: G/L Account List
  card_page_id: 17
  modal_card: true
  editable: false            # a lookup list, as classic

  layout:
    repeater:
      fields:
        - source: no
          width: 110
          style_expr: {field: account_type, not_equal: 0, style: Strong}   # heading and total accounts bold

        - source: name
          width: 280
          indent_field: indentation
          style_expr: {field: account_type, not_equal: 0, style: Strong}

        - source: income_balance
          width: 150

        - source: account_type
          width: 130

        - source: gen_posting_type
          width: 140

        - source: gen_bus_posting_group
          width: 190

        - source: gen_prod_posting_group
          width: 190

        - source: tax_bus_posting_group
          width: 190

        - source: tax_prod_posting_group
          width: 190

        - source: direct_posting
          width: 120

        - source: reconciliation_account
          width: 170

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true

    - name: Account
      caption: Account
      image: Card
      promoted: true
      items:
        - name: Ledger Entries
          caption: Ledger Entries
          image: Entries
          run_page: 20
          run_page_filter_field: gl_account_no
          run_page_filter_value: "no"
        - name: Comments
          caption: Comments
          image: Document
          run_page: 124
          run_page_filters:
            - {field: table_name, const: "0"}   # G/L Account
            - {field: "no", value: "no"}
        - name: Extended Texts
          caption: Extended Texts
          image: Document
          run_page: 391
          run_page_filters:
            - {field: table_name, const: "1"}   # G/L Account
            - {field: "no", value: "no"}
        - name: Balance/Budget
          caption: Balance/Budget
          image: Statistics
          run_page: 154
          run_page_filter_field: "no"
          run_page_filter_value: "no"
