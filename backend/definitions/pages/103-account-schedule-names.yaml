      caption: Edit Account Schedule
      image: Lines
      promoted: true
      run_page: 104
      run_page_params:
        schedule: name

    - name: Overview
      caption: Overview
      image: Statistics
      promoted: true
      run_page: 490
      run_page_filter_field: name
      run_page_filter_value: name

    - name: Print
      caption: Print
      image: Print
      promoted: true
      run_object: report:25
