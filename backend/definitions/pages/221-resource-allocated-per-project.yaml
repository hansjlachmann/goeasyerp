page:
  id: 221
  type: Card
  name: Resource Allocated per Project
  source_table: Resource
  caption: Resource Allocated per Project
  enable_navigation: true
  editable: false
  # classic form 221: the projects against periods with the budgeted quantity of the
  # resource (the projects' resource_filter is the card's No.)

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
            editable: false
          - source: name
            editable: false

      - name: Projects
        caption: Projects
        matrix:
          table: Project
          value: budgeted_res_qty
          date_filter: date_filter
          record_filters:
            resource_filter: "no"
          view_by: 2
          fields:
            - source: "no"
              width: 100
            - source: description
              width: 250
            - source: status
              width: 100
