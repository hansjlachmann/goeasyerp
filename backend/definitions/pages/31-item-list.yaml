page:
  id: 31
  type: List
  name: Item List
  source_table: Item
  caption: Item List
  card_page_id: 30
  modal_card: true
  editable: true

  layout:
    repeater:
      fields:
        - source: "no"
          width: 100
        - source: description
          width: 250
        - source: base_unit_of_measure
          width: 110
        - source: shelf_bin_no
          width: 110
          visible: false
        - source: costing_method
          width: 110
          visible: false
        - source: average_cost
          width: 120
          visible: false
        - source: standard_cost
          width: 120
          visible: false
        - source: quantity_on_hand
          width: 120
          drilldown: 38
        - source: unit_cost
          width: 120
        - source: last_direct_cost
          width: 120
          visible: false
        - source: price_profit_calculation
          width: 150
          visible: false
        - source: profit_percent
          width: 100
          visible: false
        - source: unit_price
          width: 120
        - source: inventory_posting_group
          width: 150
          visible: false
        - source: gen_prod_posting_group
          width: 150
          visible: false
        - source: tax_prod_posting_group
          width: 150
          visible: false
        - source: vendor_no
          width: 110
        - source: vendor_item_no
          width: 150
          visible: false
        - source: search_description
          width: 200
        - source: blocked
          width: 80

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    - name: Item
      caption: Item
      image: Card
      promoted: true
      items:
        - name: Entries
          caption: Entries
          image: Entries
          items:
            - name: Ledger Entries
              caption: Ledger Entries
              image: Entries
              shortcut: Ctrl+F5
              run_page: 38
              run_page_filter_field: item_no
              run_page_filter_value: "no"
            - name: Application Entries
              caption: Application Entries
              image: Navigate
              run_page: 506
              run_page_filter_field: item_no
              run_page_filter_value: "no"
            - name: Reservation Entries
              caption: Reservation Entries
              image: Entries
              run_page: 497
              run_page_filters:
                - {field: item_no, value: "no"}
                - {field: reservation_status, const: "0"}   # Open
            - name: Phys. Inventory Ledger Entries
              caption: Phys. Inventory Ledger Entries
              image: Entries
              run_page: 390
              run_page_filter_field: item_no
              run_page_filter_value: "no"
        - name: Statistics
          caption: Statistics
          image: Statistics
          shortcut: F7
          run_page: 153
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Entry Statistics
          caption: Entry Statistics
          image: Statistics
          run_page: 304
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Turnover
          caption: Turnover
          image: Statistics
          run_page: 158
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        # The item per period, location or variant (classic Item Availability by), its turnover
        - name: Item Availability by
          caption: Item Availability by
          image: Calendar
          items:
            - name: Period
              caption: Period
              run_page: 157
              run_page_filter_field: "no"
              run_page_filter_value: "no"
            - name: Location
              caption: Location
              run_page: 492
              run_page_filter_field: "no"
              run_page_filter_value: "no"
            - name: Variant
              caption: Variant
              run_page: 5414
              run_page_filter_field: "no"
              run_page_filter_value: "no"
            - name: Bin
              caption: Bin
              run_page: 5412
              run_page_filter_field: "no"
              run_page_filter_value: "no"
        - name: Comments
          caption: Comments
          image: Document
          run_page: 124
          run_page_filters:
            - {field: table_name, const: "3"}   # Item
            - {field: "no", value: "no"}
        - name: Picture
          caption: Picture
          image: Attach
          run_page: 346
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Units of Measure
          caption: Units of Measure
          image: Rows
          run_page: 5404
          run_page_filter_field: item_no
          run_page_filter_value: "no"
        - name: Variants
          caption: Variants
          image: Lines
          run_page: 5401
          run_page_filter_field: item_no
          run_page_filter_value: "no"
        - name: Translations
          caption: Translations
          image: Document
          run_page: 35
          run_page_filter_field: item_no
          run_page_filter_value: "no"
        - name: Extended Texts
          caption: Extended Texts
          image: Document
          run_page: 391
          run_page_filters:
            - {field: table_name, const: "2"}   # Item
            - {field: "no", value: "no"}
        - name: Bill of Materials
          caption: Bill of Materials
          image: Rows
          run_page: 36
          run_page_filter_field: parent_item_no
          run_page_filter_value: "no"
        - name: Calc. Standard Cost
          caption: Calc. Standard Cost
          image: Calculate
          run_object: table:Item.CalcStandardCost
        - name: Where-Used List
          caption: Where-Used List
          image: Rows
          run_page: 37
          run_page_filters:
            - {field: type, const: "1"}   # Item
            - {field: "no", value: "no"}


    - name: Sales
      caption: Sales
      image: Document
      promoted: true
      items:
        - name: Item/Cust. Discounts
          caption: Item/Cust. Discounts
          image: Calculate
          run_page: 32
          run_page_filter_field: item_discount_group
          run_page_filter_value: item_cust_disc_gr
        - name: Quantity Discounts
          caption: Quantity Discounts
          image: Calculate
          run_page: 34
          run_page_filter_field: code
          run_page_filter_value: sales_qty_disc_code
        - name: Prices
          caption: Prices
          image: Calculate
          run_page: 33
          run_page_filter_field: item_no
          run_page_filter_value: "no"
        - name: Sales Orders
          caption: Orders
          image: Document
          run_page: 48
          run_page_filters:
            - {field: type, const: "2"}   # Item
            - {field: "no", value: "no"}


    - name: Purchases
      caption: Purchases
      image: Document
      promoted: true
      items:
        - name: Vendors
          caption: Vendors
          image: Customer
          run_page: 114
          run_page_filter_field: item_no
          run_page_filter_value: "no"
        - name: Purchase Orders
          caption: Orders
          image: Document
          run_page: 56
          run_page_filters:
            - {field: type, const: "2"}   # Item
            - {field: "no", value: "no"}
