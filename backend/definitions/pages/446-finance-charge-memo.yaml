  type: Card
  name: Finance Charge Memo
  source_table: Finance_Charge_Memo_Header
  caption: Finance Charge Memo
  list_page_id: 448
  enable_navigation: true
  editable: true
  focus_field: "no"

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: no
            importance: Promoted
            assist_edit: "table:Finance_Charge_Memo_Header.AssistEdit"
          - source: customer_no
            importance: Promoted
          - source: name
          - source: address
          - source: address_2
          - source: post_code
          - source: city
          - source: state
          - source: contact
          - source: your_reference
          - source: posting_date
          - source: document_date
          - source: fin_charge_terms_code
          - source: due_date
          - source: posting_description

      # The lines: the customer entries with interest, the additional fee and the texts
      - name: Lines
        caption: Lines
        subpage:
          page_id: 447
          link:
            finance_charge_memo_no: "no"

      - name: Posting
        caption: Posting
        fields:
          - source: currency_code
          - source: customer_posting_group
          - source: gen_bus_posting_group
          - source: dimension_1_code
          - source: dimension_2_code
          - source: tax_area_code
          - source: tax_liable
          - source: tax_bus_posting_group
          - source: post_interest
          - source: post_additional_fee
          - source: issuing_no_series
          - source: issuing_no
          - source: language_code
          - source: vat_registration_no
          - source: remaining_amount
            editable: false
          - source: interest_amount
            editable: false
          - source: additional_fee
            editable: false
          - source: tax_amount
            editable: false

  actions:
    - name: Back to List
      caption: Back to List
      image: Back
      shortcut: Esc
      promoted: true
      run_page: 448

    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    - name: Memo
      caption: Memo
      image: Document
      promoted: true
      items:
        - name: Statistics
          caption: Statistics
          image: Statistics
          shortcut: F7
          run_page: 449
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Customer
          caption: Customer
          image: Customer
          shortcut: Shift+F5
          run_page: 21
          run_page_filter_field: "no"
          run_page_filter_value: customer_no
        - name: Customer Ledger Entries
          caption: Customer Ledger Entries
          image: Entries
          shortcut: Ctrl+F7
          run_page: 25
          run_page_filter_field: customer_no
          run_page_filter_value: customer_no
        - name: Comments
          caption: Comments
          image: Document
          run_page: 454
          run_page_filters:
            - {field: type, const: "0"}
            - {field: "no", value: "no"}

    - name: Functions
      caption: Functions
      image: Calculate
      promoted: true
      items:
        - name: Create Finance Charge Memos
          caption: Create Finance Charge Memos
          image: New
          run_object: report:191
        - name: Suggest Finance Charge Memo Lines
          caption: Suggest Finance Charge Memo Lines
          run_object: report:192
        - name: Update Finance Charge Text
          caption: Update Finance Charge Text
          run_object: report:186

    - name: Issuing
      caption: Issuing
      image: Post
      promoted: true
      items:
        # what issuing would refuse (codeunit 228: Report Selections F.C.Test)
        - name: Test Report
          caption: Test Report
          image: Print
          run_object: "table:Finance_Charge_Memo_Header.TestReport"
        - name: Issue
          caption: Issue
          image: Post
          shortcut: F9
          run_object: report:193