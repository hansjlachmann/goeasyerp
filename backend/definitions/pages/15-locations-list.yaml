page:
  id: 15
  type: List
  name: Locations
  source_table: Location
  caption: Locations
  editable: true
  copy_paste_allowed: true   # Ctrl+C / Ctrl+V copy and paste selected records

  layout:
    repeater:
      fields:
        - source: code
          width: 120

        - source: name
          width: 300

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true

    # the location's bins
    - name: Bins
      caption: Bins
      image: Rows
      promoted: true
      run_page: 5400
      run_page_filter_field: location_code
      run_page_filter_value: code
