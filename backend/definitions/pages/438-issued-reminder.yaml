page:
  id: 438
  type: Card
  name: Issued Reminder
  source_table: Issued_Reminder_Header
  caption: Issued Reminder
  list_page_id: 440
  enable_navigation: true
  editable: false

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: no
          - source: customer_no
          - source: name
          - source: address
          - source: address_2
          - source: post_code
          - source: city
          - source: state
          - source: contact
          - source: your_reference
          - source: posting_date
          - source: document_date
          - source: reminder_level
          - source: reminder_terms_code
          - source: fin_charge_terms_code
          - source: due_date
          - source: pre_assigned_no
          - source: no_printed

      - name: Lines
        caption: Lines
        subpage:
          page_id: 439
          link:
            reminder_no: "no"

      - name: Posting
        caption: Posting
        fields:
          - source: currency_code
          - source: customer_posting_group
          - source: gen_bus_posting_group
          - source: department_code
          - source: project_code
          - source: tax_area_code
          - source: tax_liable
          - source: tax_bus_posting_group
          - source: interest_posted
          - source: additional_fee_posted
          - source: source_code
          - source: user_id
          - source: remaining_amount
          - source: interest_amount
          - source: additional_fee
          - source: tax_amount

  actions:
    - name: Back to List
      caption: Back to List
      image: Back
      shortcut: Esc
      promoted: true
      run_page: 440

    - name: Print
      caption: Print
      image: Print
      promoted: true
      run_object: table:Issued_Reminder_Header.PrintRecords

    - name: Customer
      caption: Customer
      image: Customer
      shortcut: Shift+F5
      promoted: true
      run_page: 21
      run_page_filter_field: "no"
      run_page_filter_value: customer_no

    - name: Comments
      caption: Comments
      image: Document
      promoted: true
      run_page: 442
      run_page_filters:
        - {field: type, const: "1"}
        - {field: "no", value: "no"}

    - name: Navigate
      caption: Navigate
      image: Navigate
      shortcut: Ctrl+Alt+Q
      promoted: true
      run_page: 344
      run_page_params:
        document_no: "no"
        posting_date: posting_date
