page:
  id: 232
  type: List
  name: Apply Customer Entries
  source_table: Customer_ledger_entry
  caption: Apply Customer Entries
  editable: false   # opened from a journal line (Apply Entries): its open entries, OK applies the line

  # Under the list: the journal line's amount, the marked entries' amount and the balance
  # (OnAfterGetRecord with the page's parameters, business-logic/genjnl/apply.go)
  footer:
    - source: appln_amount
      calculated: true
      type: types.Decimal
      decimal_places: "2:2"
    - source: applied_amount
      calculated: true
      type: types.Decimal
      decimal_places: "2:2"
    - source: appln_balance
      calculated: true
      type: types.Decimal
      decimal_places: "2:2"

  layout:
    repeater:
      fields:
        - source: posting_date
          width: 100

        - source: document_type
          width: 130

        - source: document_no
          width: 110

        - source: customer_no
          width: 110

        - source: description
          width: 250

        - source: currency_code
          width: 110

        - source: amount
          width: 120

        - source: remaining_amount
          width: 120

        - source: due_date
          width: 100

        - source: pmt_discount_date
          width: 100

        - source: pmt_disc_possible
          width: 120

        - source: applies_to_id
          width: 110

        - source: open
          width: 80
          visible: false

        - source: positive
          width: 80
          visible: false


  actions:
    # Mark the selected entries with the journal line's Applies-to ID, or take the mark off
    - name: Set Applies-to ID
      caption: Set Applies-to ID
      image: Approve
      shortcut: F9
      promoted: true
      run_object: table:Customer_ledger_entry.SetAppliesToID

    # Opened from the ledger entries: post the application of the entry under the cursor (it must
    # be marked too) to the other entries marked with the user's Applies-to ID (codeunit 226)
    - name: Post Application
      caption: Post Application
      image: Post
      shortcut: F11
      promoted: true
      run_object: codeunit:226

    - name: Navigate
      caption: Navigate
      image: Navigate
      shortcut: Ctrl+Alt+Q
      promoted: true
      run_page: 344
      run_page_params:
        document_no: document_no
        posting_date: posting_date

    - name: Reminder/Fin. Charge Entries
      caption: Reminder/Fin. Charge Entries
      image: Entries
      run_page: 444
      run_page_filter_field: customer_entry_no
      run_page_filter_value: entry_no
