page:
  id: 29
  type: List
  name: Vendor Ledger Entries
  source_table: Vendor_ledger_entry
  caption: Vendor Ledger Entries
  # Editable for now (demo data; Vendor No. uses the on-demand vendor lookup). Posted
  # ledger entries are read-only — make this page read-only once posting exists.
  editable: true

  layout:
    repeater:
      fields:
        - source: entry_no
          width: 80

        - source: posting_date
          width: 100

        - source: document_type
          width: 110

        - source: document_no
          width: 110

        - source: vendor_no
          width: 100

        - source: description
          width: 220

        - source: amount_lcy
          width: 110

        - source: remaining_amt_lcy
          width: 120

        - source: open
          width: 60

        - source: due_date
          width: 100

  actions:
    - name: Show Document
      caption: Show Document
      image: Document
      shortcut: Shift+F7
      promoted: true
      run_object: table:Vendor_ledger_entry.ShowDoc

    - name: Navigate
      caption: Navigate
      image: Navigate
      shortcut: Ctrl+Alt+Q
      promoted: true
      run_page: 344
      run_page_params:
        document_no: document_no
        posting_date: posting_date

    # Apply the entry to other open entries of the vendor (classic Apply Entries on the ledger
    # entries): mark them with Set Applies-to ID (F9), then Post Application (F11)
    - name: Apply Entries
      caption: Apply Entries
      image: Approve
      shortcut: Shift+F9
      promoted: true
      run_page: 233
      run_page_params:
        vendor_no: vendor_no

    # Undo the entry's latest application (the application register, table 905)
    - name: Unapply Entries
      caption: Unapply Entries
      image: Undo
      promoted: true
      run_object: table:Vendor_ledger_entry.UnapplyEntries

    # The applications of the entry (applied and unapplied)
    - name: Applications
      caption: Applications
      image: History
      promoted: true
      run_page: 909
      run_page_filters:
        - field: account_type
          const: "1"
        - field: ledger_entry_no
          value: entry_no
