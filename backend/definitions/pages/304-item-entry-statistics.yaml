            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: positive_adjmt_unit_amount
            calculated: true
            type: types.Decimal
            decimal_places: "2:5"
          - source: positive_adjmt_amount
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"

      - name: Shipment
        caption: Shipment
