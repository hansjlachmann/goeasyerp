page:
  id: 304
  type: Card
  name: Item Entry Statistics
  source_table: Item   # opened from the Item Card and List (Item › Entry Statistics) on one item
  caption: Item Entry Statistics
  editable: false

  # classic form 304: the item's most recently posted entries per entry type and its next and
  # last order lines to be received and shipped, within its Variant, Location and Bin Filters
  # (OnAfterGetRecord in business-logic/pages/itemstatistics.go; captions
  # pages.item_entry_statistics.fields.*). The order lines have no drop shipment, so the Drop
  # Shipment Filter applies to the entries only.
  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
          - source: description

      - name: Receipt
        caption: Receipt
        fields:
          - source: receipt_date
            calculated: true
            type: types.Date
          - source: receipt_document_no
            calculated: true
            type: types.Code
          - source: receipt_quantity
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: receipt_unit_amount
            calculated: true
            type: types.Decimal
            decimal_places: "2:5"
          - source: receipt_amount
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"

      - name: Purchase
        caption: Purchase
        fields:
          - source: purchase_date
            calculated: true
            type: types.Date
          - source: purchase_document_no
            calculated: true
            type: types.Code
          - source: purchase_quantity
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: purchase_unit_amount
            calculated: true
            type: types.Decimal
            decimal_places: "2:5"
          - source: purchase_amount
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"

      - name: Positive Adjustment
        caption: Positive Adjustment
        fields:
