page:
  id: 145
  type: List
  name: Posted Purchase Receipts
  source_table: Purch_Rcpt_Header
  caption: Posted Purchase Receipts
  card_page_id: 136

  layout:
    repeater:
      fields:
        - source: "no"
          width: 120
        - source: buy_from_vendor_no
          width: 130
        - source: buy_from_vendor_name
          width: 250
        - source: posting_date
          width: 110
        - source: expected_receipt_date
          width: 130
        - source: location_code
          width: 110
        - source: order_no
          width: 120
        - source: no_printed
          width: 100
          visible: false

  actions:
    - name: Print
      caption: Print
      image: Print
      promoted: true
      run_object: table:Purch_Rcpt_Header.PrintRecords

    - name: Statistics
      caption: Statistics
      image: Statistics
      shortcut: F9
      promoted: true
      run_page: 399
      run_page_filter_field: "no"
      run_page_filter_value: "no"

    - name: Navigate
      caption: Navigate
      image: Navigate
      shortcut: Ctrl+Alt+Q
      promoted: true
      run_page: 344
      run_page_params:
        document_no: "no"
        posting_date: posting_date

    - name: Comments
      caption: Comments
      image: Document
      promoted: true
      run_page: 66
      run_page_filters:
        - field: document_type
          const: "5"
        - field: "no"
          value: "no"
