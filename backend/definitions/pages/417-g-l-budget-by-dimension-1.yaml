page:
  id: 417
  type: List
  name: G/L Budget by Dimension 1
  source_table: G_L_Account
  caption: G/L Budget by Dimension 1
  # classic form 417: the G/L accounts' budgeted amount against the Dimension 1 values in one period
  # (a value typed into a cell enters the budget: one Budget Filter, Net Change; glbalance.go)

  layout:
    matrix:
      table: G_L_Account
      value: budgeted_amount
      calculated: true
      editable: true
      entry_table: G_L_Budget_Entry
      view_as: true
      date_filter: date_filter
      view_by: 2
      filters:
        - source: budget_filter
          drilldown_filter_field: budget_name
        - source: dimension_2_filter
          drilldown_filter_field: dimension_2_code
      drilldown: 120
      drilldown_row_field: gl_account_no
      drilldown_row_value: totaling
      drilldown_date_field: date
      fields:
        - source: "no"
          width: 90
          style_expr: {field: account_type, not_equal: 0, style: Strong}
        - source: name
          width: 260
          indent_field: indentation
          style_expr: {field: account_type, not_equal: 0, style: Strong}

  # the actions work on the selected row (its G/L account)
  actions:
    - name: Account
      caption: Account
      image: Card
      promoted: true
      items:
        - name: Card
          caption: Card
          image: Card
          run_page: 17
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Ledger Entries
          caption: Ledger Entries
          image: Entries
          run_page: 20
          run_page_filter_field: gl_account_no
          run_page_filter_value: "no"
        - name: Comments
          caption: Comments
          image: Document
          run_page: 124
          run_page_filters:
            - {field: table_name, const: "0"}   # G/L Account
            - {field: "no", value: "no"}
        - name: Extended Texts
          caption: Extended Texts
          image: Document
          run_page: 391
          run_page_filters:
            - {field: table_name, const: "1"}   # G/L Account
            - {field: "no", value: "no"}
        - name: Balance/Budget
          caption: Balance/Budget
          image: Statistics
          run_page: 154
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Balance by Dim. 1/2
          caption: Balance by Dim. 1/2
          image: Statistics
          run_page: 412
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Account Balance
          caption: Account Balance
          image: Statistics
          run_page: 415
          run_page_filter_field: "no"
          run_page_filter_value: "no"

    - name: Balance
      caption: Balance
      image: Statistics
      promoted: true
      items:
        - name: By Periods
          caption: By Periods
          image: Statistics
          run_page: 408
        - name: By Dimension 1
          caption: By Dimension 1
          image: Statistics
          run_page: 409
        - name: By Dimension 2
          caption: By Dimension 2
          image: Statistics
          run_page: 410
        - name: By Business Units
          caption: By Business Units
          image: Statistics
          run_page: 411
        - name: G/L Balance
          caption: G/L Balance
          image: Statistics
          run_page: 414
