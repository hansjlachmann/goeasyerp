page:
  id: 9303
  type: List
  name: Blanket Sales Orders
  source_table: Sales_Header   # OnOpenPage: Document Type = Blanket Order (business-logic/pages/blanketorder.go)
  caption: Blanket Sales Orders
  card_page_id: 507            # a full page: the card has its lines

  layout:
    repeater:
      fields:
        - source: "no"
          width: 120
        - source: sell_to_customer_no
          width: 130
        - source: sell_to_customer_name
          width: 250
        - source: order_date
          width: 110
        - source: shipment_date
          width: 110
        - source: salesperson_code
          width: 110
        - source: currency_code
          width: 90
        - source: amount
          width: 130
        - source: amount_including_tax
          width: 150
        - source: external_document_no
          width: 150
          visible: false
        - source: location_code
          width: 110
          visible: false

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    - name: Print
      caption: Print
      image: Print
      promoted: true
      run_object: report:210

    # an order of the lines' quantities to ship (the blanket order stays)
    - name: Make Order
      caption: Make Order
      image: Document
      promoted: true
      run_object: codeunit:84

    - name: Statistics
      caption: Statistics
      image: Statistics
      shortcut: F9
      promoted: true
      run_page: 160
      run_page_filters:
        - field: document_type
          value: document_type
        - field: "no"
          value: "no"
