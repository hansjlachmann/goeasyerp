            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: total_unused_capacity
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: total_not_chargeable_units
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: total_not_chargeable_price
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: total_chargeable_units
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: total_chargeable_price
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: total_chargeable_pct
            calculated: true
            type: types.Decimal
            decimal_places: "1:1"
          - source: total_invoiced
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: total_invoiced_pct
            calculated: true
            type: types.Decimal
            decimal_places: "1:1"
          - source: total_usage_cost
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: total_profit
