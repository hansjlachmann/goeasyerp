# Page 48 Sales Orders (classic form 48): the sales order lines (source table view: Document Type = Order) — the item's Sales › Orders
page:
  id: 48
  type: List
  name: Sales Orders
  source_table: Sales_Line
  caption: Sales Orders
  editable: false
  source_table_view: # classic SourceTableView WHERE(Document Type=CONST(Order))
    - {field: document_type, value: 1}

  layout:
    repeater:
      fields:
        - source: type
          width: 90
        - source: no
          width: 90
        - source: description
          width: 240
        - source: shipment_date
          width: 100
        - source: sell_to_customer_no
          width: 110
        - source: document_no
          width: 110
        - source: currency_code
          width: 80
        - source: quantity
          width: 100
        - source: outstanding_quantity
          width: 110
        - source: unit_of_measure_code
          width: 90
        - source: amount
          width: 120
        - source: unit_price
          width: 110
        - source: line_discount_percent
          width: 90

  actions:
    - name: Line
      caption: Line
      image: Lines
      promoted: true
      items:
        - name: Show Document
          caption: Show Document
          image: Document
          shortcut: Shift+F5
          run_object: table:Sales_Line.ShowDocument
        - name: Reservation Entries
          caption: Reservation Entries
          image: Entries
          run_object: table:Sales_Line.ShowReservationEntries
