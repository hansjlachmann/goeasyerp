          width: 120
        - source: unit_of_measure_code
          width: 110
          visible: false
        - source: amount
          width: 120
        - source: discount_amount
          width: 120
          visible: false
        - source: adjusted_cost_qty
          width: 130
        - source: adjusted_cost_invoiced_qty
          width: 140
