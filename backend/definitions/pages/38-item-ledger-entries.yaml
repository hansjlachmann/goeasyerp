  actions:

    # Application: the entry's application entries, the entries it closed (Invoicing Entries, page
    # 63) and its applications as the closing side (Applied Entries, page 523)
    - name: Application
      caption: Application
      image: Navigate
      promoted: true
      items:
        - name: Application Entries
          caption: Application Entries
          image: Navigate
          run_page: 506
          run_page_filter_field: item_ledger_entry_no
          run_page_filter_value: entry_no
        - name: Invoicing Entries
          caption: Invoicing Entries
          image: Entries
          run_object: table:Item_Ledger_Entry.ShowInvoicingEntries
        - name: Applied Entries
          caption: Applied Entries
          image: Entries
          run_object: table:Item_Ledger_Entry.ShowAppliedEntries
    - name: Navigate
      caption: Navigate
      image: Navigate
      shortcut: Ctrl+Alt+Q
      promoted: true
      run_page: 344
      run_page_params:
        document_no: document_no
        posting_date: posting_date

    # The open reservations of the entry (classic ShowReservationEntries: the entry as the supply)
    - name: Reservation Entries
      caption: Reservation Entries
      image: Entries
      promoted: true
      run_page: 497
      run_page_filters:
        - {field: reservation_status, const: "0"}   # Open
        - {field: from_type, const: "6"}           # Item Ledger Entry
        - {field: from_ref_no, value: entry_no}
