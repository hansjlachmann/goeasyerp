page:
  id: 16
  type: List
  name: Chart of Accounts
  source_table: G_L_Account
  caption: Chart of Accounts
  card_page_id: 17
  modal_card: true           # the card opens over the list (full screen with its button)
  editable: true
  copy_paste_allowed: true   # Ctrl+C / Ctrl+V copy and paste selected records

  layout:
    repeater:
      fields:
        - source: no
          width: 110
          style_expr: {field: account_type, not_equal: 0, style: Strong}   # heading and total accounts bold

        - source: name
          width: 280
          indent_field: indentation
          style_expr: {field: account_type, not_equal: 0, style: Strong}

        - source: income_balance
          width: 150

        - source: account_type
          width: 130

        - source: direct_posting
          width: 120

        - source: net_change
          width: 140
          drilldown: 20   # the FlowField's filters: a total account's Totaling, the Date Filter …

        - source: balance_at_date
          width: 150
          drilldown: 20   # the FlowField's filters: a total account's Totaling, the Date Filter …

        - source: additional_currency_net_change
          width: 150
          visible: false
          drilldown: 20   # the FlowField's filters: a total account's Totaling, the Date Filter …

        - source: add_currency_balance_at_date
          width: 150
          visible: false
          drilldown: 20   # the FlowField's filters: a total account's Totaling, the Date Filter …

        - source: totaling
          width: 160
          table_relation: G_L_Account

        - source: dimension_1_code
          width: 140
          table_relation: Department

        - source: dimension_2_code
          width: 130
          table_relation: Project

        - source: gen_posting_type
          width: 140

        - source: gen_bus_posting_group
          width: 190
          table_relation: Gen_Business_Posting_Group

        - source: gen_prod_posting_group
          width: 190
          table_relation: Gen_Product_Posting_Group

        - source: tax_bus_posting_group
          width: 190
          table_relation: Tax_Business_Posting_Group

        - source: tax_prod_posting_group
          width: 190
          table_relation: Tax_Product_Posting_Group

        - source: consol_debit_acc
          width: 160

        - source: consol_credit_acc
          width: 160

        - source: consol_currency_val_method
          width: 160
          visible: false

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true

    - name: Account
      caption: Account
      image: Card
      promoted: true
      items:
        - name: Ledger Entries
          caption: Ledger Entries
          image: Entries
          run_page: 20
          run_page_filter_field: gl_account_no
          run_page_filter_value: "no"
        - name: Comments
          caption: Comments
          image: Document
          run_page: 124
          run_page_filters:
            - {field: table_name, const: "0"}   # G/L Account
            - {field: "no", value: "no"}
        - name: Extended Texts
          caption: Extended Texts
          image: Document
          run_page: 391
          run_page_filters:
            - {field: table_name, const: "1"}   # G/L Account
            - {field: "no", value: "no"}
        - name: Balance/Budget
          caption: Balance/Budget
          image: Statistics
          run_page: 154
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Balance by Dim. 1/2
          caption: Balance by Dim. 1/2
          image: Statistics
          run_page: 412
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Account Balance
          caption: Account Balance
          image: Statistics
          run_page: 415
          run_page_filter_field: "no"
          run_page_filter_value: "no"


    - name: Functions
      caption: Functions
      image: Setup
      promoted: true
      enabled: true
      items:
        - name: Indent Chart of Accounts
          caption: Indent Chart of Accounts
          image: Rows
          run_object: codeunit:3

    # The G/L accounts' balance by periods, dimensions and business units (classic Balance menu)
    - name: Balance
      caption: Balance
      image: Statistics
      promoted: true
      items:
        - name: By Periods
          caption: By Periods
          image: Statistics
          run_page: 408
        - name: By Dimension 1
          caption: By Dimension 1
          image: Statistics
          run_page: 409
        - name: By Dimension 2
          caption: By Dimension 2
          image: Statistics
          run_page: 410
        - name: By Business Units
          caption: By Business Units
          image: Statistics
          run_page: 411
        - name: G/L Balance
          caption: G/L Balance
          image: Statistics
          run_page: 414
