# Production docker-compose using pre-built images from GitHub Container Registry
#
# Run it through the wrapper, which reads the server's own settings from prod.env
# (untracked: APP_VERSION, database password, JWT secret — see prod.env.example):
#   scripts/prod.sh pull
#   scripts/prod.sh up -d
# Operations (upgrade, backup, restore, reboot): docs/operations.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped # start again after a host reboot
    environment:
      POSTGRES_USER: openerp
      # Only applied when the volume is created; to change it later see docs/operations.md
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in prod.env (openssl rand -hex 24; an existing database: docs/operations.md, Changing the database password)}
      POSTGRES_DB: openerp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Localhost only (admin tools through an SSH tunnel); the backend uses the compose network
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openerp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # With extension apps: the installation's own backend image (BACKEND_IMAGE in prod.env, built
    # by its installation repository); else the base release's
    image: ${BACKEND_IMAGE:-ghcr.io/hansjlachmann/goeasyerp/backend:${APP_VERSION:-latest}}
    restart: unless-stopped
    ports:
      # Users go through nginx (80/443). Published on PUBLISH_HOST (default 127.0.0.1) for a
      # tunnel or proxy on the same host; set PUBLISH_HOST=0.0.0.0 in prod.env only if a
      # proxy on another machine must reach it
      - "${PUBLISH_HOST:-127.0.0.1}:8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: openerp
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in prod.env (openssl rand -hex 24; an existing database: docs/operations.md, Changing the database password)}
      DB_NAME: openerp
      # at most this many database connections at once (empty: 40; PostgreSQL allows 100)
      DB_MAX_CONNS: ${DB_MAX_CONNS:-}
      # the app builder's database role is made with it (the server itself works as the role goeasyerp)
      BUILDER_DB_PASSWORD: ${BUILDER_DB_PASSWORD:-}
      # The company the server enters at startup (empty: the first company; a new database: main)
      COMPANY_NAME: ${COMPANY_NAME:-}
      PORT: 8080
      APP_VERSION: ${APP_VERSION:-latest}
      # Without it every restart logs all users out (random key per start)
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in prod.env (openssl rand -hex 32)}
      # Encrypts the SMTP password in the database (empty: derived from JWT_SECRET)
      OPENERP_ENCRYPTION_KEY: ${OPENERP_ENCRYPTION_KEY:-}
      # NAV report proxy used by the NAV Report Runner codeunit (empty: http://localhost:5009)
      NAV_PROXY_URL: ${NAV_PROXY_URL:-}
      # Themes from GitHub (Appearance dialog): optional token against GitHub's download limit
      # (60/hour without) and the GitHub owners themes may come from (empty: any)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      THEME_ALLOWED_OWNERS: ${THEME_ALLOWED_OWNERS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # The builds of the extension apps by the installation's own builder (App Build Setup:
      # Builds By = Local Builder): the server runs the newest one of its version
      APP_BUILDS_DIR: /builds
    volumes:
      - app_builds:/builds:ro
    depends_on:
      db:
        condition: service_healthy

  # The installation's own builder of the extension apps (Installed Apps → Upload App / Build
  # Apps). Started only with the profile apps: COMPOSE_PROFILES=apps in prod.env
  builder:
    image: ghcr.io/hansjlachmann/goeasyerp/builder:${APP_VERSION:-latest}
    profiles: ["apps"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # its own role (BUILDER_DB_PASSWORD): the build tables only; without it the server's role
      DB_USER: ${BUILDER_DB_PASSWORD:+goeasyerp_builder}
      DB_PASSWORD: ${BUILDER_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      DB_NAME: openerp
      APP_BUILDS_DIR: /builds
      # read access to private app repositories on GitHub (empty: public ones only)
      APPS_TOKEN: ${APPS_TOKEN:-}
    volumes:
      - app_builds:/builds
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/hansjlachmann/goeasyerp/frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:3000:3000"
    environment:
      PORT: 3000
      ORIGIN: https://localhost
    depends_on:
      - backend

  nginx:
    # a fixed nginx version (raise it for nginx security releases: 1.31.9 fixes the 2026-11 HTTP/2 flaws)
    image: nginx:1.31.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  app_builds:
