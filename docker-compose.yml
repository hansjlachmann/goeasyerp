# Development stack (backend, frontend, PostgreSQL, nginx). Needs JWT_SECRET in the shell:
#   export JWT_SECRET=$(openssl rand -hex 32) && docker compose up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openerp
      POSTGRES_PASSWORD: openerp
      POSTGRES_DB: openerp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openerp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: openerp
      DB_PASSWORD: openerp
      DB_NAME: openerp
      # development: keep openerp the superuser with its password (tests use it); installations
      # leave this out and the server works as the role goeasyerp (docs/operations.md)
      DB_KEEP_SUPERUSER: "true"
      COMPANY_NAME: ${COMPANY_NAME:-}
      PORT: 8080
      APP_VERSION: ${APP_VERSION:-dev}
      # signs the sessions: set it in the shell first (export JWT_SECRET=$(openssl rand -hex 32));
      # the server refuses to start without one, or with a known example text
      JWT_SECRET: ${JWT_SECRET:?export JWT_SECRET=$(openssl rand -hex 32) before docker compose up}
      # the first user needs it on the login page (S37); empty: a random one in the backend log
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # a session without requests ends after this (S39; e.g. 30m, 8h; empty: 2h; 0: never)
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ORIGIN: http://localhost:3000
    depends_on:
      - backend

  nginx:
    # a fixed nginx version (raise it for nginx security releases: 1.31.9 fixes the 2026-11 HTTP/2 flaws)
    image: nginx:1.31.9-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
