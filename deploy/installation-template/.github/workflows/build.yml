# Builds the installation's backend image: the GoEasyERP base release of apps.yaml with the apps
# it lists compiled in (the base's Dockerfile merges them: EXTENSIONS_PATH), pushed to this
# repository's package registry as ghcr.io/<owner>/<repository>/backend:<base version>, :latest
# (multi-arch: linux/amd64 and linux/arm64)
name: Build GoEasyERP with the installation's apps

on:
  push:
    paths:
      - apps.yaml
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the build list
        uses: actions/checkout@v4
        with:
          path: installation

      - name: Read the base version
        id: list
        run: |
          version=$(yq '.base.version' installation/apps.yaml)
          [ -n "$version" ] && [ "$version" != "null" ] || { echo "apps.yaml has no base.version"; exit 1; }
          echo "base=$version" >> "$GITHUB_OUTPUT"
          # package names are lower case
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"

      - name: Check out the base release
        uses: actions/checkout@v4
        with:
          repository: hansjlachmann/goeasyerp
          ref: v${{ steps.list.outputs.base }}
          path: base

      - name: Check out the apps
        env:
          APPS_TOKEN: ${{ secrets.APPS_TOKEN }}
        run: |
          mkdir -p base/apps
          count=$(yq '.apps | length' installation/apps.yaml)
          for i in $(seq 0 $((count - 1))); do
            id=$(yq ".apps[$i].id" installation/apps.yaml)
            repository=$(yq ".apps[$i].repository" installation/apps.yaml)
            ref=$(yq ".apps[$i].ref" installation/apps.yaml)
            commit=$(yq ".apps[$i].commit // \"\"" installation/apps.yaml)
            folder=$(yq ".apps[$i].path // \"\"" installation/apps.yaml)
            case "$repository" in https://github.com/*) ;; *) echo "app $id: not a GitHub repository: $repository"; exit 1 ;; esac
            url="$repository"
            if [ -n "$APPS_TOKEN" ]; then url="https://x-access-token:${APPS_TOKEN}@${repository#https://}"; fi
            if [ -z "$commit" ]; then
              # installed before commits were recorded: built at the tag as it is now
              echo "::warning::app $id has no recorded commit: built at the tag $ref (install it again to pin it)"
              git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$ref" "$url" "app-$i"
            else
              # exactly the commit recorded at install, and only while the tag still points to it
              case "$commit" in *[!0-9a-f]*) echo "app $id: not a commit: $commit"; exit 1 ;; esac
              [ ${#commit} -eq 40 ] || { echo "app $id: not a commit: $commit"; exit 1; }
              refs=$(git ls-remote -- "$url" "refs/tags/$ref" "refs/tags/$ref^{}")
              now=$(printf '%s\n' "$refs" | awk -v r="refs/tags/$ref^{}" '$2 == r {print $1}')
              [ -n "$now" ] || now=$(printf '%s\n' "$refs" | awk -v r="refs/tags/$ref" '$2 == r {print $1}')
              if [ "$now" != "$commit" ]; then
                echo "app $id: the tag $ref now points to '${now}', not to $commit, which was installed — refused"
                exit 1
              fi
              git init --quiet "app-$i"
              git -C "app-$i" fetch --quiet --depth 1 -- "$url" "$commit"
              git -C "app-$i" -c advice.detachedHead=false checkout --quiet FETCH_HEAD
            fi
            cp -r "app-$i/${folder:-.}" "base/apps/$id"
            echo "✓ $(yq ".apps[$i].name" installation/apps.yaml) $(yq ".apps[$i].version" installation/apps.yaml)"
          done

      # the app audit (S55): every app's code is checked before it is built into the server —
      # with the allowed Go modules and the exceptions approved in GoEasyERP (apps.yaml); an app
      # that fails it stops the build
      - uses: actions/setup-go@v5
        with:
          go-version-file: base/go.mod
          cache: false

      - name: Audit the apps
        working-directory: base
        run: |
          [ -n "$(ls apps 2>/dev/null)" ] || { echo "no apps"; exit 0; }
          go run ./cmd/app-audit -build-list ../installation/apps.yaml apps/*

      # Known vulnerabilities in the modules the apps bring in (the apps whose go.mod requires
      # modules besides the base; the base's own are its release's to fix). The apps' code
      # compiles only merged into the base, so they are merged into a copy first, as the build does.
      - name: Check the apps' modules for known vulnerabilities
        working-directory: base
        run: |
          [ -n "$(ls apps 2>/dev/null)" ] || { echo "no apps"; exit 0; }
          cp -r . ../vulncheck
          cd ../vulncheck
          go run ./tools/extmerge --core backend/definitions --apps apps --output merged \
            --translations translations --translations-output merged-translations --go-root .
          rm -rf backend/definitions translations
          mv merged backend/definitions
          mv merged-translations translations
          go generate ./backend/generated/tables
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          go run ./cmd/app-audit -govulncheck -build-list ../installation/apps.yaml apps/*

      # the image runs on x86 servers and on ARM (e.g. a Raspberry Pi)
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the package registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: base
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.list.outputs.base }}
            EXTENSIONS_PATH=apps
          push: true
          tags: |
            ${{ steps.list.outputs.image }}:${{ steps.list.outputs.base }}
            ${{ steps.list.outputs.image }}:latest
