# GoEasyERP on one computer (trial installation) — only Docker Desktop is needed.
#
# Install and upgrade with one line (it downloads this file, keeps your settings, backs the
# database up before an upgrade and starts GoEasyERP):
#   Windows (PowerShell):  irm https://raw.githubusercontent.com/hansjlachmann/goeasyerp/main/scripts/goeasyerp.ps1 | iex
#   Linux, macOS, WSL:     curl -fsSL https://raw.githubusercontent.com/hansjlachmann/goeasyerp/main/scripts/goeasyerp.sh | sh
#
# By hand:
#   1. Save this file as docker-compose.yml in a folder of its own, e.g. C:\GoEasyERP
#   2. Next to it create a file .env with the lines  JWT_SECRET=<any long random text>
#      (keep it: it also encrypts stored passwords) and POSTGRES_PASSWORD=<another long random
#      text> (the database's password; it takes effect when the database is made — to change it
#      later, change it in the database first), and, if wanted, GOEASYERP_PORT=8000,
#      GOEASYERP_BIND=127.0.0.1 (0.0.0.0: other computers too) and
#      GOEASYERP_ORIGIN=http://<computer name>:8000 (the address the users open)
#   3. In that folder:  docker compose up -d
#   4. Wait 2-3 minutes, open http://localhost:8000 and create the first user
#
# Stop: docker compose stop     Start again: docker compose start
# Upgrade: run the line above again, or take the new version of this file (the settings stay in
#   .env), then: docker compose pull && docker compose up -d
# Never run "docker compose down -v": it deletes the database.
# A server installation (HTTPS, backups, settings file) is described in docs/operations.md.

name: goeasyerp # the database volume is goeasyerp_postgres_data, whatever the folder

# Every container's log is rotated: at most 5 files of 10 MB (S34; Docker keeps everything
# otherwise, and a flood of requests fills the disk)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Containers without root rights they do not need (S41): no capabilities, no setuid
# programs, a read-only file system with /tmp in memory (the backend and frontend images run as
# users of their own too)
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    # postgres starts as root and changes to its own user: these five capabilities, nothing else
    # (its file system stays writable — the install script copies backups out of its /tmp)
    cap_drop:
      - ALL
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      POSTGRES_USER: openerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the file .env next to docker-compose.yml - run the GoEasyERP install script again, it sets it}
      POSTGRES_DB: openerp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openerp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/hansjlachmann/goeasyerp/backend:0.1.187 # x-release-please-version
    logging: *logging
    <<: *hardened
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: openerp
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the file .env next to docker-compose.yml - run the GoEasyERP install script again, it sets it}
      DB_NAME: openerp
      # the app builder's database role is made with it (the server itself works as the role goeasyerp)
      BUILDER_DB_PASSWORD: ${BUILDER_DB_PASSWORD:-}
      COMPANY_NAME: ${COMPANY_NAME:-}
      PORT: 8080
      APP_VERSION: "0.1.187" # x-release-please-version
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the file .env next to docker-compose.yml}
      # The builds of the extension apps (Installed Apps → Upload App / Build Apps)
      APP_BUILDS_DIR: /builds
    volumes:
      - app_builds:/builds:ro
    depends_on:
      db:
        condition: service_healthy

  # Builds the extension apps in this installation. Started only with the profile apps: put
  # COMPOSE_PROFILES=apps in .env (a large download — the Go toolchain —, needed only when apps are installed)
  builder:
    image: ghcr.io/hansjlachmann/goeasyerp/builder:0.1.187 # x-release-please-version
    logging: *logging
    security_opt:
      - no-new-privileges:true
    profiles: ["apps"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # its own role (BUILDER_DB_PASSWORD): the build tables only; without it the server's role
      DB_USER: ${BUILDER_DB_PASSWORD:+goeasyerp_builder}
      DB_PASSWORD: ${BUILDER_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      DB_NAME: openerp
      APP_BUILDS_DIR: /builds
    volumes:
      - app_builds:/builds
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/hansjlachmann/goeasyerp/frontend:0.1.187 # x-release-please-version
    logging: *logging
    <<: *hardened
    restart: unless-stopped
    environment:
      PORT: 3000
      ORIGIN: ${GOEASYERP_ORIGIN:-http://localhost:${GOEASYERP_PORT:-8000}}
    depends_on:
      - backend

  web:
    # a fixed nginx version (raise it for nginx security releases: 1.31.9 fixes the 2026-11 HTTP/2 flaws)
    image: nginx:1.31.9-alpine
    logging: *logging
    # the master process starts as root, binds 80 and runs its workers as the user nginx (not
    # read_only: Docker writes the inline config below into the container's file system)
    cap_drop:
      - ALL
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "${GOEASYERP_BIND:-127.0.0.1}:${GOEASYERP_PORT:-8000}:80" # 127.0.0.1: this computer only
    configs:
      - source: nginx
        target: /etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend

configs:
  nginx:
    content: |
      events {}
      http {
        server {
          listen 80;
          client_max_body_size 8m;
          server_tokens off;
          location /api {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$remote_addr;
            proxy_buffering off;
            proxy_read_timeout 3600s;
          }
          location /health {
            proxy_pass http://backend:8080;
          }
          location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
          }
        }
      }

volumes:
  postgres_data:
  app_builds:
