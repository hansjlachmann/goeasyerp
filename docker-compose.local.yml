# GoEasyERP on one computer (trial installation) — only Docker Desktop is needed.
#
# Install and upgrade with one line (it downloads this file, keeps your settings, backs the
# database up before an upgrade and starts GoEasyERP):
#   Windows (PowerShell):  irm https://raw.githubusercontent.com/hansjlachmann/goeasyerp/main/scripts/goeasyerp.ps1 | iex
#   Linux, macOS, WSL:     curl -fsSL https://raw.githubusercontent.com/hansjlachmann/goeasyerp/main/scripts/goeasyerp.sh | sh
#
# By hand:
#   1. Save this file as docker-compose.yml in a folder of its own, e.g. C:\GoEasyERP
#   2. Next to it create a file .env with the line  JWT_SECRET=<any long random text>
#      (keep it: it also encrypts stored passwords) and, if wanted, GOEASYERP_PORT=8000,
#      GOEASYERP_BIND=127.0.0.1 (0.0.0.0: other computers too) and
#      GOEASYERP_ORIGIN=http://<computer name>:8000 (the address the users open)
#   3. In that folder:  docker compose up -d
#   4. Wait 2-3 minutes, open http://localhost:8000 and create the first user
#
# Stop: docker compose stop     Start again: docker compose start
# Upgrade: run the line above again, or take the new version of this file (the settings stay in
#   .env), then: docker compose pull && docker compose up -d
# Never run "docker compose down -v": it deletes the database.
# A server installation (HTTPS, backups, settings file) is described in docs/operations.md.

name: goeasyerp # the database volume is goeasyerp_postgres_data, whatever the folder

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openerp
      POSTGRES_PASSWORD: openerp
      POSTGRES_DB: openerp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openerp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/hansjlachmann/goeasyerp/backend:0.1.155 # x-release-please-version
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: openerp
      DB_PASSWORD: openerp
      DB_NAME: openerp
      COMPANY_NAME: cronus
      PORT: 8080
      APP_VERSION: "0.1.155" # x-release-please-version
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the file .env next to docker-compose.yml}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/hansjlachmann/goeasyerp/frontend:0.1.155 # x-release-please-version
    restart: unless-stopped
    environment:
      PORT: 3000
      ORIGIN: ${GOEASYERP_ORIGIN:-http://localhost:${GOEASYERP_PORT:-8000}}
    depends_on:
      - backend

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${GOEASYERP_BIND:-127.0.0.1}:${GOEASYERP_PORT:-8000}:80" # 127.0.0.1: this computer only
    configs:
      - source: nginx
        target: /etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend

configs:
  nginx:
    content: |
      events {}
      http {
        server {
          listen 80;
          client_max_body_size 20m;
          location /api {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
          }
          location /health {
            proxy_pass http://backend:8080;
          }
          location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
          }
        }
      }

volumes:
  postgres_data:
