name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write # release-please labels its release PRs through the Issues API
  packages: write

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04

    # PostgreSQL for the tests that also run on it (TEST_POSTGRES_DSN): production runs on
    # PostgreSQL, the other tests on SQLite
    services:
      postgres:
        image: postgres:16-alpine # as production
        env:
          POSTGRES_USER: openerp
          POSTGRES_DB: ci_test
          POSTGRES_HOST_AUTH_METHOD: trust # a throwaway database of the job, no password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openerp -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Generated table code is up to date
        run: |
          go generate ./backend/generated/tables
          git add --intent-to-add .
          git diff --exit-code -- backend/generated backend/business-logic/tables

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # the default 1 minute is too short for the generated table code without a warm cache
          args: --timeout=10m

      - name: Run tests
        env:
          TEST_POSTGRES_DSN: postgres://openerp@localhost:5432/ci_test?sslmode=disable
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: backend
          fail_ci_if_error: false

      - name: Build
        run: go build -v ./...

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: frontend/coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  release:
    name: Release Please
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # A repository token (secret RELEASE_TOKEN: Contents, Pull requests and Issues read/write):
          # the Actions token can no longer create releases here. Falls back to it when unset.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-24.04
    # The multi-arch build (arm64 under QEMU) has hung for hours (0.1.68, 0.1.82); a normal run
    # takes ~7 minutes (0.1.85). Fail fast so the job can simply be re-run. The frontend image
    # no longer runs npm under QEMU (frontend/Dockerfile), which was what hung.
    # Re-run with "Re-run failed jobs": "Re-run all jobs" runs Release Please again, which then
    # creates no release, so this job is skipped and the images stay missing (0.1.89, 0.1.90).
    timeout-minutes: 30
    needs: [backend, frontend, release]
    # Only build Docker images when a release is created
    if: needs.release.outputs.release_created == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags for backend
        id: tags-backend
        run: |
          TAGS="ghcr.io/${{ github.repository }}/backend:latest"
          TAGS="$TAGS,ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"
          if [ "${{ needs.release.outputs.release_created }}" == "true" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository }}/backend:${{ needs.release.outputs.version }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Determine tags for frontend
        id: tags-frontend
        run: |
          TAGS="ghcr.io/${{ github.repository }}/frontend:latest"
          TAGS="$TAGS,ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}"
          if [ "${{ needs.release.outputs.release_created }}" == "true" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository }}/frontend:${{ needs.release.outputs.version }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Determine version
        id: version
        run: |
          if [ "${{ needs.release.outputs.release_created }}" == "true" ]; then
            echo "version=${{ needs.release.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags-backend.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit .env file
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase origin main
          echo "# GoEasyERP Environment Configuration" > .env
          echo "# This file is automatically updated by CI on each release" >> .env
          echo "" >> .env
          echo "APP_VERSION=${{ needs.release.outputs.version }}" >> .env
          git add .env
          git diff --staged --quiet || git commit -m "chore: update .env to version ${{ needs.release.outputs.version }}"
          git push
