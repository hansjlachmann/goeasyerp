name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # every night the Go tests with the race detector (pushes and pull requests run them without:
  # several times faster)
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# Every job reads only; the jobs that write say what they need (a taken-over action or a test
# run cannot change the repository or push images)
permissions:
  contents: read

jobs:
  # A release changes only version files: the release-please PR and its merge commit carry the
  # code CI tested on main already (the release PR is only made after CI passed there), so the
  # tests do not run for them again — only when both the PR/commit is release-please's and it
  # changes nothing but the release files
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # the files of a pull request
    outputs:
      release_only: ${{ steps.check.outputs.release_only }}
      go: ${{ steps.parts.outputs.go }}
      frontend: ${{ steps.parts.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Release files only?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          release=false
          case "$EVENT" in
            pull_request)
              case "$HEAD_REF" in release-please--*)
                release=true
                files=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename') ;;
              esac ;;
            push)
              case "$COMMIT_MESSAGE" in "chore(main): release "*)
                release=true
                files=$(git diff --name-only HEAD^ HEAD) ;;
              esac ;;
          esac
          if [ "$release" = true ]; then
            for f in $files; do
              case "$f" in
                CHANGELOG.md|.release-please-manifest.json|backend/definitions/application.yaml|docker-compose.local.yml) ;;
                *) echo "changes $f: the tests run"; release=false ;;
              esac
            done
          fi
          echo "release files only: $release"
          echo "release_only=$release" >> "$GITHUB_OUTPUT"

      # Which jobs the change needs: the Go jobs not for a change of the frontend or the docs
      # only (frontend/src/app.css excepted: a Go test checks the themes against it); the
      # frontend job not for the docs only (its end-to-end tests run against the server, so Go
      # changes need it). Everything runs at night, by hand, for a workflow change, or when the
      # pushed range is not known.
      - name: Which parts changed?
        id: parts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          files=""
          known=false
          case "$EVENT" in
            pull_request)
              files=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename') && known=true ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
                 git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
                files=$(git diff --name-only "$BEFORE" "$AFTER") && known=true
              fi ;;
          esac
          go=false
          frontend=false
          if [ "$known" != true ] || [ -z "$files" ]; then
            go=true
            frontend=true
          fi
          for f in $files; do
            case "$f" in
              *.md|docs/*) ;;
              frontend/src/app.css) go=true; frontend=true ;;
              frontend/*) frontend=true ;;
              *) go=true; frontend=true ;;
            esac
          done
          echo "go: $go, frontend: $frontend (range known: $known)"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  # Lint, the generated code and the builds; the tests run in Backend tests, in parallel
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.release_only != 'true' && needs.changes.outputs.go == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Generated table code is up to date
        run: |
          go generate ./backend/generated/tables
          git add --intent-to-add .
          git diff --exit-code -- backend/generated backend/business-logic/tables

      # (go vet: golangci-lint's govet linter, enabled by default)
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # the default 1 minute is too short for the generated table code without a warm cache
          args: --timeout=10m

      - name: Build
        run: go build -v ./...

      # The base application with the test extension app merged in, as an installation's
      # build does: extension apps keep building as the base changes
      - name: Build with the test extension app
        run: scripts/check-extension-fixture.sh

  # The Go tests in three parallel jobs of about the same time (measured 2026-11-20 without the
  # race detector: the reports package alone 4.5 min; the posting packages 6 min of test time;
  # the rest). A new slow package: put it into a group, else it runs with the rest.
  backend-tests:
    name: Backend tests (${{ matrix.group }})
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.release_only != 'true' && needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [reports, posting, rest]

    # PostgreSQL for the tests that also run on it (TEST_POSTGRES_DSN): production runs on
    # PostgreSQL, the other tests on SQLite
    services:
      postgres:
        image: postgres:16-alpine # as production
        env:
          POSTGRES_USER: openerp
          POSTGRES_DB: ci_test
          POSTGRES_HOST_AUTH_METHOD: trust # a throwaway database of the job, no password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openerp -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: The group's packages
        id: packages
        env:
          GROUP: ${{ matrix.group }}
        run: |
          m=github.com/hansjlachmann/goeasyerp/backend/business-logic
          reports="$m/reports"
          posting="$m/genjnl $m/codeunits $m/fajnl $m/itemjnl $m/demodata $m/salesposting $m/purchposting"
          case "$GROUP" in
            reports) list="$reports" ;;
            posting) list="$posting" ;;
            rest) list=$(go list ./... | grep -v -x -F $(printf -- '-e %s ' $reports $posting)) ;;
          esac
          echo "list=$(echo $list)" >> "$GITHUB_OUTPUT"
          echo "$list" | tr ' ' '\n'

      - name: Run tests
        env:
          TEST_POSTGRES_DSN: postgres://openerp@localhost:5432/ci_test?sslmode=disable
          # the race detector in the nightly run (and when started by hand): several times slower
          RACE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-race' || '' }}
          # the app builder's whole build (cmd/app-builder TestBuildBundle) also only then: on every
          # run "Build with the test extension app" builds the base with the test app already
          GOEASYERP_SKIP_APP_BUILD: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '' || '1' }}
          PACKAGES: ${{ steps.packages.outputs.list }}
        run: go test -v $RACE -timeout 45m -coverprofile=coverage.out $PACKAGES

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.out
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.release_only != 'true' && needs.changes.outputs.frontend == 'true'

    # The E2E tests run against the API server with demo data (DEMO_DATA) on a throwaway
    # PostgreSQL of the job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openerp
          POSTGRES_DB: e2e
          POSTGRES_HOST_AUTH_METHOD: trust # a throwaway database of the job, no password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openerp -d e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          directory: frontend/coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      - name: Set up Go (API server for the E2E tests)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Start the API server with demo data
        working-directory: .
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: openerp
          DB_NAME: e2e
          COMPANY_NAME: main
          PORT: '8080'
          DEMO_DATA: SMALL
          JOB_QUEUE_ENABLED: 'false'
        run: |
          go build -o "$RUNNER_TEMP/api-server" ./cmd/api-server
          # a fresh session key and test user password per run (masked in the log)
          JWT_SECRET=$(openssl rand -hex 32)
          E2E_PASSWORD=$(openssl rand -hex 12)
          echo "::add-mask::$E2E_PASSWORD"
          echo "E2E_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
          JWT_SECRET=$JWT_SECRET nohup "$RUNNER_TEMP/api-server" > "$RUNNER_TEMP/api-server.log" 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://localhost:8080/health > /dev/null && exit 0
            sleep 5
          done
          cat "$RUNNER_TEMP/api-server.log"
          exit 1

      # The runner's Google Chrome (preinstalled on GitHub's Ubuntu images) instead of downloading
      # Playwright's Chromium and its system packages on every run (5 min); the download only
      # when the image has no Chrome
      - name: Browser for the E2E tests
        run: |
          if command -v google-chrome > /dev/null; then
            google-chrome --version
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install chromium --with-deps
          fi

      - name: Run E2E tests
        run: npm run test:e2e

      - name: API server log
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/api-server.log"

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  security:
    name: Security scan
    # Known vulnerabilities in the Go modules and the Go version the release images are built
    # with (golang:1.26-alpine: the latest 1.26 patch), and in the frontend's production
    # dependencies. It does not hold the release back: a new advisory must not stop a fix from
    # shipping — a red run here is the signal to update (Dependabot opens the pull requests).
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: false
      - name: govulncheck
        # GOTOOLCHAIN=local: the scan reports on the latest 1.26 patch set up above, as the
        # images have it (the vulnerability database is read live)
        env:
          GOTOOLCHAIN: local
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ !cancelled() }} # the npm check also when govulncheck found something
        with:
          node-version: 22
      - name: npm audit (production dependencies)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  release:
    name: Release Please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please labels its release PRs through the Issues API
    needs: [changes, backend, backend-tests, frontend]
    # after the tests, or without them for a release's own commit (skipped, see Changes)
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # A repository token (secret RELEASE_TOKEN: Contents, Pull requests and Issues read/write):
          # the Actions token can no longer create releases here. Falls back to it when unset.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the .env version commit
      packages: write
    # The multi-arch build (arm64 under QEMU) has hung for hours (0.1.68, 0.1.82); a normal run
    # takes ~7 minutes (0.1.85). Fail fast so the job can simply be re-run. The frontend image
    # no longer runs npm under QEMU (frontend/Dockerfile), which was what hung.
    # Re-run with "Re-run failed jobs": "Re-run all jobs" runs Release Please again, which then
    # creates no release, so this job is skipped and the images stay missing (0.1.89, 0.1.90).
    timeout-minutes: 30
    needs: [release]
    # Only build Docker images when a release is created (always(): the tests may have been
    # skipped for the release's own commit, see Changes)
    if: always() && needs.release.result == 'success' && needs.release.outputs.release_created == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags for backend
        id: tags-backend
        run: |
          TAGS="ghcr.io/${{ github.repository }}/backend:latest"
          TAGS="$TAGS,ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"
          if [ "${{ needs.release.outputs.release_created }}" == "true" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository }}/backend:${{ needs.release.outputs.version }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Determine tags for frontend
        id: tags-frontend
        run: |
          TAGS="ghcr.io/${{ github.repository }}/frontend:latest"
          TAGS="$TAGS,ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}"
          if [ "${{ needs.release.outputs.release_created }}" == "true" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository }}/frontend:${{ needs.release.outputs.version }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Determine version
        id: version
        run: |
          if [ "${{ needs.release.outputs.release_created }}" == "true" ]; then
            echo "version=${{ needs.release.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags-backend.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags-frontend.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Commit .env file
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase origin main
          echo "# GoEasyERP Environment Configuration" > .env
          echo "# This file is automatically updated by CI on each release" >> .env
          echo "" >> .env
          echo "APP_VERSION=${{ needs.release.outputs.version }}" >> .env
          git add .env
          git diff --staged --quiet || git commit -m "chore: update .env to version ${{ needs.release.outputs.version }}"
          git push

  # The installation's builder of the extension apps (Dockerfile target app-builder), next to the
  # other images: amd64 and arm64 each built natively on a runner of its own (its build cache must
  # be compiled on the platform that uses it), then joined — app-builder-image.yml
  docker-builder:
    name: Docker Build & Push (app builder)
    needs: [release]
    if: always() && needs.release.result == 'success' && needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/app-builder-image.yml
    with:
      version: ${{ needs.release.outputs.version }}
