events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8080;
    }

    upstream frontend {
        server frontend:3000;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # Mozilla's "intermediate" settings (S43): TLS 1.2 only with forward-secret AEAD suites
        # (no CBC, no static RSA), TLS 1.3 as it is; the client picks among them (all are
        # strong); no session tickets (their key would undo forward secrecy until nginx restarts)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;
        server_tokens off;

        # The largest upload: a picture (6 MB) or an app package; the backend takes the same (S34)
        client_max_body_size 8m;

        # Browsers use https only for this host from now on (S25). The other security headers
        # (CSP, framing, nosniff, referrer, no-store) come from the frontend and the backend.
        add_header Strict-Transport-Security "max-age=31536000" always;

        # API routes - proxy to backend
        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;  # overwrite: the backend trusts it from nginx only
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support — disable buffering for streaming responses
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # WebSocket support (if needed)
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Everything else - proxy to frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;  # overwrite: the backend trusts it from nginx only
            proxy_set_header X-Forwarded-Proto $scheme;

            # The frontend sends its static files (scripts, styles, icons) without the headers of
            # its pages: they are added here, once (the pages' own copies hidden). An add_header
            # here replaces the server's, so HSTS is repeated.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Cross-Origin-Resource-Policy;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
    }
}
